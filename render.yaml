# Blueprint do Render. Em New → Blueprint, apontando para este repositório,
# ele cria o banco e o serviço já ligados um no outro.
databases:
  - name: oren-db
    databaseName: oren
    region: virginia
    plan: free # ATENÇÃO: o plano free expira. Para uso real, troque para basic-256mb ou maior.

services:
  - type: web
    name: oren-pipeline
    runtime: node
    region: virginia
    plan: free # o plano free dorme quando ninguém usa e demora a acordar
    buildCommand: npm install
    # migrate e seed são seguros de repetir: criam o que falta e não sobrescrevem
    # o pipeline que já está no banco.
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oren-db
          property: connectionString
