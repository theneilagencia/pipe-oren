# Blueprint do Render. Em New → Blueprint, apontando para este repositório,
# ele cria o banco e o serviço já ligados um no outro.
# USANDO SUPABASE (recomendado): apague este bloco "databases" inteiro e cadastre
# DATABASE_URL no painel do Render com a string de *Connection pooling* do
# Supabase (host pooler.supabase.com, porta 5432). A conexão direta do Supabase é
# IPv6 e não funciona a partir do Render.
#
# USANDO O BANCO DO RENDER: ele EXPIRA 30 dias depois de criado, com 14 dias de
# tolerância. Serve para experimentar, não para valer.
databases:
  - name: oren-db
    databaseName: oren
    region: virginia
    plan: free

services:
  - type: web
    name: oren-pipeline
    runtime: node
    region: virginia
    plan: free # o plano free dorme quando ninguém usa e demora a acordar
    buildCommand: npm install
    # migrate e seed são seguros de repetir: criam o que falta e não sobrescrevem
    # o pipeline que já está no banco.
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oren-db
          property: connectionString
