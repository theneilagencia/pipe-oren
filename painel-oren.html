function barras(itens,total,porContagem){
 const base=porContagem?itens.reduce((a,i)=>a+(i.n||0),0):total;
 if(!itens.length||!base)return '<div class="empty">'+TEXTOS.vazio.grafico+"</div>";
 const cel=ehCel();
 const w=cel?320:560,lw=cel?0:140,rw=cel?0:(porContagem?230:200),bw=w-lw-rw,hb=cel?16:18,lin=cel?40:32;
 let s='<svg class="gsvg" viewBox="0 0 '+w+' '+(itens.length*lin)+'" width="100%" preserveAspectRatio="xMinYMin meet" role="img">';
 itens.forEach((it,i)=>{
  const medida=porContagem?(it.n||0):it.valor;
  const y=i*lin,len=Math.max(2,Math.round((medida/base)*bw));
  const vlr=porContagem
   ?it.n+(it.n===1?" negócio · ":" negócios · ")+(Number(it.valor)>0?brlV(it.valor):"valor a definir")
   :it.n+" · "+brlV(it.valor);
  if(cel){
   s+='<text x="0" y="'+(y+12)+'" font-size="12" fill="#4a564f">'+esc(it.nome)+"</text>";
   s+='<text x="'+w+'" y="'+(y+12)+'" text-anchor="end" font-size="12" fill="#1a1a1a">'+esc(vlr)+"</text>";
   s+='<rect x="0" y="'+(y+18)+'" width="'+len+'" height="'+hb+'" fill="'+(it.cor||"#0e5351")+'"></rect>';
  }else{
   s+='<text x="0" y="'+(y+18)+'" font-size="13" fill="#4a564f">'+esc(it.nome)+"</text>";
   s+='<rect x="'+lw+'" y="'+(y+6)+'" width="'+len+'" height="'+hb+'" fill="'+(it.cor||"#0e5351")+'"></rect>';
   s+='<text x="'+(lw+bw+8)+'" y="'+(y+18)+'" font-size="13" fill="#1a1a1a">'+esc(vlr)+"</text>";
  }
 });
 return s+"</svg>";
}
function rosca(itens){
 const tot=itens.reduce((s,i)=>s+i.valor,0);
 if(!tot)return '<div class="empty">'+TEXTOS.vazio.grafico+"</div>";
 const cx=90,cy=90,r=78,ri=48;let a=-Math.PI/2,s='<svg class="gsvg" viewBox="0 0 180 180" width="100%" role="img">';
 itens.forEach(it=>{
  if(!it.valor)return;
  const ang=it.valor/tot*Math.PI*2,b=a+ang;
  const p=(rr,t)=>[cx+rr*Math.cos(t),cy+rr*Math.sin(t)].map(v=>v.toFixed(2)).join(" ");
  const big=ang>Math.PI?1:0;
  s+='<path d="M '+p(r,a)+" A "+r+" "+r+" 0 "+big+" 1 "+p(r,b)+" L "+p(ri,b)+" A "+ri+" "+ri+" 0 "+big+" 0 "+p(ri,a)+' Z" fill="'+it.cor+'"></path>';
  a=b;
 });
 s+="</svg>";
 let lg='<div class="rowlist">';
 itens.forEach(it=>{lg+=itemLinha('<span class="dot" style="background:'+it.cor+'"></span>'+esc(it.nome),
  ['<span class="mut">'+esc(brlV(it.valor))+"</span>",
   '<span class="soft">'+(tot?Math.round(it.valor/tot*100):0)+"%</span>"]);});
 return '<div class="rosca">'+s+lg+"</div></div>";
}

function iconeHint(k,escuro){
 return '<button type="button" class="hint'+(escuro?" esc":"")+'" data-hint="'+k+
  '" aria-label="O que é isto" aria-expanded="false">?</button>';
}
function abrirHint(btn){
 const h=HINTS[btn.getAttribute("data-hint")];if(!h)return;
 fecharHint(false);
 const el=$("#hint");
 el.innerHTML='<div class="lbl">'+esc(h.t)+"</div><p>"+esc(h.a)+"</p>"+(h.b?"<p>"+esc(h.b)+"</p>":"")+
  '<button type="button" class="hintx" data-fechahint="1">Entendi</button>';
 el.className="on";el.removeAttribute("hidden");
 btn.setAttribute("aria-expanded","true");
 state.hintBtn=btn;
 posicionarHint(btn);
 el.querySelector(".hintx").focus();
}
function posicionarHint(btn){
 const el=$("#hint");
 if(ehCel()){el.style.left="";el.style.top="";return;}
 const r=btn.getBoundingClientRect();
 el.style.left=Math.max(8,Math.min(window.innerWidth-288,r.left-8))+"px";
 el.style.top=Math.max(8,Math.min(window.innerHeight-200,r.bottom+8))+"px";
}
function fecharHint(devolveFoco){
 const el=$("#hint");if(!el||el.className!=="on")return;
 el.className="";el.setAttribute("hidden","");el.innerHTML="";
 const b=state.hintBtn;state.hintBtn=null;
 if(b){b.setAttribute("aria-expanded","false");if(devolveFoco&&b.isConnected)b.focus();}
}

function render(){
 aplicarLinkTodo();
 fecharHint(false);
 aplicarResponsaveis(state.data);   /* lista do Admin entra antes de qualquer select */
 renderTopo();renderNav();renderMenu();renderPubSeg();renderChips();
 const c=$("#content");
 if(state.tela==="painel")c.innerHTML=telaPainel();
 else if(state.tela==="todo")c.innerHTML=telaTodo();
 else if(state.tela==="negocios")c.innerHTML=telaNegocios();
 else c.innerHTML=telaContas();
 renderPainelLateral();renderImpressao();
}
function renderTopo(){
 $("#title").textContent=TEXTOS.nav[state.tela];
 const rotuloNovo=state.tela==="contas"
  ?(state.aba==="clientes"?TEXTOS.novoCliente:TEXTOS.novoParceiro):TEXTOS.novo;
 $("#btnnovo").textContent=rotuloNovo;
 $("#fab").title=rotuloNovo;
 $("#fab").setAttribute("aria-label",rotuloNovo);
 $("#busca").placeholder=TEXTOS.buscaPh;
 /* Mac mostra ⌘K, o resto mostra Ctrl K. Escrever a tecla errada ensina errado. */
 $("#cmdk").textContent=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?"⌘K":"Ctrl K";
 if($("#busca").value!==state.filtros.busca)$("#busca").value=state.filtros.busca;
 const s=$("#savedot");
 if(state.semRede){s.textContent=TEXTOS.semRede;s.className="no";}
 else if(state.salvando){s.textContent=TEXTOS.salvando;s.className="ok";}
 else{s.textContent=state.dirty?TEXTOS.naoSalvo:TEXTOS.salvo;s.className=state.dirty?"no":"ok";}
 const q=$("#quem");
 if(state.usuario)q.innerHTML="<b>"+esc(state.usuario.nome)+"</b>"+
  (state.usuario.papel==="leitor"?"<span>somente leitura</span>":"")+
  '<button data-senha="1">Trocar senha</button>'+
  '<button data-sair="1" style="margin-left:auto">'+TEXTOS.sair+"</button>"+
  '<span class="ver" title="Versão publicada">'+esc(VERSAO)+"</span>";
 else q.innerHTML="";
}
function renderNav(){

 /* Ícone, nome e o atalho aparecendo no hover: quem usa todo dia aprende o
    atalho sem ler manual. */
 $("#nav").innerHTML=telas.map(k=>
  '<button data-tela="'+k+'" class="'+(state.tela===k?"on":"")+'"'+
  (state.tela===k?' aria-current="page"':"")+">"+ICONES[k]+"<span>"+TEXTOS.nav[k]+"</span>"+
  '<span class="atk">'+ATALHO_TELA[k]+"</span></button>").join("");
 $("#bnav").innerHTML=telas.map(k=>
  '<button data-tela="'+k+'" class="'+(state.tela===k?"on":"")+'"'+(state.tela===k?' aria-current="page"':"")+">"+
  ICONES[k]+"<span>"+TEXTOS.nav[k]+"</span></button>").join("");
}

 const permitidos=state.servidor
  ?(state.usuario&&state.usuario.papel==="editor"?["importar","exportar","imprimir"]:["exportar","imprimir"])
  :Object.keys(TEXTOS.menu);

  TEXTOS.menu[k]+"</button>"+iconeHint("m_"+k,esc_)+"</div>").join("");

}

function renderChips(){
 /* No To Do quem filtra são as abas e as pastilhas da própria tela. Deixar o
    seletor de responsável aqui era pior que ruído: escolher outra pessoa nele
    esvaziava "Minhas tarefas" sem explicar por quê. */
 if(state.tela==="todo"){$("#chips").innerHTML="";return;}
 const f=state.filtros,ch=[];
 if(state.tela==="painel"){
  ch.push('<span class="soft" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase">'+
   esc(TEXTOS.periodoLbl)+iconeHint("periodo")+"</span>");
  ch.push('<div class="seg">'+Object.keys(TEXTOS.periodos).map(k=>
   '<button data-per="'+k+'" class="'+(f.periodo===k?"on":"")+'">'+TEXTOS.periodos[k]+"</button>").join("")+"</div>");
  ch.push('<span class="soft" style="font-size:11px">'+esc(TEXTOS.periodoAfeta)+"</span>");
 }
 ch.push(sel("frente",TEXTOS.col.frente,{"":"Todas as frentes",payments:"Payments",capital:"Capital",governance:"Governance"}));
 const rs={"":"Todos os responsáveis"};RESPS.forEach(r=>rs[r]=r);
 ch.push(sel("responsavel",TEXTOS.col.resp,rs));
 ch.push(sel("tipoVenda","Tipo de venda",{"":"Direta e por parceiro",direta:TEXTOS.tipoVenda.direta,parceiro:TEXTOS.tipoVenda.parceiro}));
 if(f.busca)ch.push('<span class="chip">Busca <b>'+esc(f.busca)+'</b><button data-limpa="busca">×</button></span>');
 $("#chips").innerHTML=ch.join("");
 function sel(k,lbl,ops){
  const v=f[k];
  return '<span class="chip'+(v?" ativo":"")+'"><span class="cl">'+esc(lbl)+"</span>"+
   '<select data-filtro="'+k+'">'+Object.keys(ops).map(o=>
   '<option value="'+o+'"'+(v===o?" selected":"")+">"+esc(ops[o])+"</option>").join("")+"</select>"+
   (v?'<button data-limpa="'+k+'">×</button>':"")+iconeHint("f_"+k)+"</span>";
 }
}
function telaPainel(){
 const f=faixa(state.filtros.periodo),per=TEXTOS.periodos[state.filtros.periodo];
 const lista=negocios(),k=kpis(lista);
 const desfechados=ff=>lista.filter(d=>noDesfecho(d,ff));
 const kf=kpis(desfechados(f)),kfa=f?kpis(desfechados(f.ant)):null;
 /* O cartão tem quatro partes: rótulo, número, unidade e rodapé. Antes a frase
    inteira ("8 negócios · valor a definir") ia no lugar do número e quebrava em
    duas linhas — deixava de ser número e virava texto grande.
    Soma zero com negócios dentro não é zero: é valor não cadastrado. Nesse caso
    o número passa a ser a contagem, e a falta do valor vira qualificação. */
 const plural=nn=>nn+(nn===1?" negócio":" negócios");
 const money=(v,nn)=>(nn>0&&!v)
  ?{valor:String(nn),uni:nn===1?"negócio":"negócios",qual:TAG_VALOR}
  :{valor:brlC(v),uni:nn>0?"em "+plural(nn):"",qual:""};
 const cards=[
  ["aberto",money(k.aberto,k.nAberto),null,null,TEXTOS.semPeriodo],
  ["ponderada",money(k.ponderada,k.nAberto),null,null,TEXTOS.semPeriodo],
  ["fechado",money(kf.fechado,kf.nFechado),kf.fechado,kfa&&kfa.fechado,TEXTOS.periodoLbl+": "+per],
  ["conversao",kf.conversao==null
    ?{valor:"—",uni:"",qual:"nenhum negócio fechado ou perdido no período"}
    :{valor:Math.round(kf.conversao)+"%",uni:"",qual:""},
   kf.conversao,kfa?kfa.conversao:null,TEXTOS.periodoLbl+": "+per]];
 let h='<div class="grid kpis">';
 cards.forEach(([id,cel,v,pv,nota])=>{
  let dl="";
  /* Com o período em "Tudo" não existe período anterior, então nem a frase
     "sem base de comparação" cabe: ela sugere dado faltando onde não falta. */
  if(v!=null&&f){
   dl='<span class="delta soft">'+TEXTOS.semBase+"</span>";
   if(pv!=null&&pv!==0){const p=Math.round((v-pv)/Math.abs(pv)*100);
    dl='<span class="delta '+(p>=0?"up":"down")+'">'+(p>=0?"▲ ":"▼ ")+Math.abs(p)+"% contra o período anterior</span>";}
   dl="<div>"+dl+"</div>";
  }
  h+='<div class="card kpi" data-kpi="'+id+'" role="button" tabindex="0"'+
   ' aria-label="'+esc(TEXTOS.kpi[id])+": ver negócios\">"+
   '<div class="lbl">'+TEXTOS.kpi[id]+iconeHint("kpi_"+id)+"</div>"+
   '<div class="val"><span class="num">'+esc(cel.valor)+"</span>"+
   (cel.uni?'<span class="uni">'+esc(cel.uni)+"</span>":"")+"</div>"+
   (cel.qual?'<div class="qual">'+esc(cel.qual)+"</div>":"")+
   dl+'<div class="delta soft">'+esc(nota)+"</div></div>";
 });
 h+="</div>";
 /* Um funil por frente. Com o filtro de frente em "todas", os três aparecem
    empilhados: misturar etapas de funis diferentes numa barra só era o que
    fazia o quadro mentir sobre Governance e Payments. */
 const frentesFunil=state.filtros.frente?[state.filtros.frente]:["payments","capital","governance"];
 const funilH=frentesFunil.map(fr=>{
  const abertos=lista.filter(d=>frenteDe(d)===fr&&emAberto(d));
  const itens=FUNIS[fr].slice(0,CORTE[fr].ganho-1).map((nome,i)=>{
   const a=abertos.filter(d=>Number(d.etapa)===i+1);
   return{nome:(i+1)+" · "+nome,n:a.length,valor:a.reduce((s,d)=>s+(+d.valor||0),0),cor:CORF[fr]};
  }).filter(x=>x.n);
  return '<div class="fun"><div class="lbl" style="margin:0 0 8px"><span class="dot" style="background:'+
   CORF[fr]+'"></span>'+esc(TEXTOS.frentesLbl[fr])+"</div>"+
   barras(itens,itens.reduce((t,i)=>t+i.valor,0),true)+"</div>";
 }).join("");
 const porFrente=["payments","capital","governance"].map(fr=>{const a=lista.filter(d=>emAberto(d)&&d.frente===fr);
  return{nome:TEXTOS.frentesLbl[fr],valor:a.reduce((s,d)=>s+(+d.valor||0),0),cor:CORF[fr]};});
 h+='<div class="grid g2 w14 mt16">'+
  '<div class="card"><h2>'+TEXTOS.funil+iconeHint("funil")+"</h2>"+funilH+"</div>"+
  '<div class="card"><h2>'+TEXTOS.frentes+iconeHint("frentes")+"</h2>"+rosca(porFrente)+"</div></div>";
 const at=atencao(lista);
 let ah=at.length?'<div class="rowlist">'+at.map(x=>itemLinha(esc(nomeNegocio(x.d)),
  ['<span class="mut">'+esc(brlD(x.d.valor))+"</span>",
   '<span class="'+(x.motivo===TEXTOS.motivos.parado?"soft":"late")+'">'+esc(x.motivo)+"</span>"],
  ' data-abre="'+x.d.id+'" style="cursor:pointer"')).join("")+"</div>"
  :'<div class="empty">'+TEXTOS.vazio.atencao+"</div>";
 /* Nomes fora da lista do Admin, mas com negócio aberto, entram no fim: some
    do gráfico é pior que aparecer com a marca de fora da lista. */
 const nomesResp=RESPS.slice();
 lista.forEach(d=>{if(emAberto(d)&&d.responsavel&&nomesResp.indexOf(d.responsavel)<0)nomesResp.push(d.responsavel);});

/* Cada indicador guarda a lista que o gerou, e é a mesma régua do kpis(): sem
   isto a gaveta mostraria "mais ou menos" os negócios do número. */
function negociosDoKpi(id){
 const f=faixa(state.filtros.periodo),lista=negocios();
 const doPeriodo=()=>lista.filter(d=>noDesfecho(d,f));
 if(id==="aberto"||id==="ponderada")return lista.filter(emAberto);
 if(id==="fechado")return doPeriodo().filter(fechado);
 /* Conversão é uma razão: a lista é o denominador — fechados e perdidos. */
 return doPeriodo().filter(d=>fechado(d)||perdido(d));
}
function painelKpi(id){
 const f=faixa(state.filtros.periodo),per=TEXTOS.periodos[state.filtros.periodo];
 const ds=negociosDoKpi(id);
 const ponderado=d=>(Number(d.valor)||0)*(Number(d.chance)||0)/100;
 const chave=id==="ponderada"?ponderado:(d=>Number(d.valor)||0);
 const ordenados=ds.slice().sort((a,b)=>chave(b)-chave(a));
 const total=ordenados.reduce((t,d)=>t+chave(d),0);
 const nota=(id==="aberto"||id==="ponderada")?TEXTOS.semPeriodo:TEXTOS.periodoLbl+": "+per;
 let h='<div class="ph"><button class="x" data-fechar="1">Fechar</button>'+
  '<div class="lbl">'+esc(TEXTOS.kpi[id])+"</div>"+
  '<div style="font-size:18px;font-weight:600;margin-top:6px">'+
   esc(ordenados.length+(ordenados.length===1?" negócio":" negócios"))+
   '<span class="uni" style="margin-left:8px">'+esc(id==="conversao"
    ?ordenados.filter(fechado).length+" fechados"
    :(total?brlC(total):TAG_VALOR))+"</span></div>"+
  '<div class="qual">'+esc(nota)+"</div></div>";
 h+='<div class="pb">';
 h+='<div class="soft" style="font-size:12px;margin-bottom:8px">'+esc(TEXTOS.kpiExplica[id])+"</div>";
 if(!ordenados.length){h+='<div class="empty">'+TEXTOS.vazio.kpi+"</div>";return h+"</div>";}
 h+='<div class="rowlist">'+ordenados.map(d=>{
  const partes=[];
  if(id==="conversao")partes.push('<span class="'+(perdido(d)?"late":"mut")+'">'+
   (perdido(d)?"Perdido":"Fechado")+"</span>");
  else partes.push('<span class="mut">'+esc(etapaNome(d))+"</span>");
  partes.push(esc(TEXTOS.frentesLbl[d.frente]));
  partes.push(esc(d.responsavel));
  if(id==="ponderada")partes.push('<span class="mut">'+esc(brlD(d.valor))+" × "+
   esc(String(Number(d.chance)||0))+"% = "+esc(brlD(ponderado(d)))+"</span>");
  else partes.push('<span class="mut">'+esc(brlD(d.valor))+"</span>");
  return itemLinha(esc(nomeNegocio(d)),partes,' data-abre="'+d.id+'"');
 }).join("")+"</div>";
 h+='<div class="fld" style="border-bottom:0;margin-top:8px"><span class="lbl">Soma da lista</span>'+
  '<span style="font-weight:600">'+esc(id==="conversao"
   ?ordenados.filter(fechado).length+" de "+ordenados.length+" fechados"
   :(total?brl(total):TAG_VALOR))+"</span></div>";
 return h+"</div>";
}
function abrirPainel(p){

/* Texto, responsável e prazo editáveis no mesmo lugar em que se lê, como o
   resto da gaveta. Bloqueia e excluir são botões: são decisão, não digitação.
   A chave junta os dois códigos com "|" porque data-edit separa por ":". */
/* Concluir é botão, não caixinha: é a ação mais usada da linha e precisa dizer
   em que estado está. Concluída, a pendência sai da contagem, sai do To Do e
   deixa de bloquear o negócio — e o botão vira o caminho de volta. */
const ICO_CIRC="<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='6' fill='none' stroke='currentColor' stroke-width='1.6'/></svg>";
const ICO_CHECK="<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='7' fill='currentColor'/><path d='M4.6 8.3l2.2 2.2 4.6-4.6' fill='none' stroke='#fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>";
function linhaPendencia(d,p){
 const chave=d.id+"|"+p.id;
 return '<div class="pend'+(p.resolvida?" done":"")+'">'+
  '<button class="pdone'+(p.resolvida?" on":"")+'" data-pend="'+chave+'"'+
   ' aria-pressed="'+(p.resolvida?"true":"false")+'"'+
   ' title="'+esc(p.resolvida?TEXTOS.pendReabrir:TEXTOS.pendConcluir)+'">'+
   '<span class="ic">'+(p.resolvida?ICO_CHECK:ICO_CIRC)+"</span>"+
   esc(p.resolvida?TEXTOS.pendConcluida:TEXTOS.pendConcluir)+"</button>"+
  '<span class="corpo">'+ed("pend",chave,"texto",p.texto,"textarea")+
   '<span class="meta">'+ed("pend",chave,"responsavel",p.responsavel,"select",opcoesResp(p.responsavel,"—"))+
   "<span>·</span>"+ed("pend",chave,"prazo",p.prazo,"date")+"</span></span>"+
  '<span class="acs">'+

 let alvo=null;
 if(kind==="deal")alvo=state.data.deals.find(x=>x.id===id);
 else if(kind==="cliente")alvo=cliente(id);
 else if(kind==="parceiro")alvo=parceiro(id);
 if(kind==="cinco"){const d=state.data.deals.find(x=>x.id===id);d.cincoPerguntas[campo]=valor;d.atualizadoEm=agora();marcar();return;}
 if(kind==="seisnota"||kind==="seisobs"){

/* ===================== PALETA DE COMANDOS =====================

   passar por tela nenhuma: Cmd+K (ou Ctrl+K), digita, Enter. É o que faz a
   navegação parar de ser "clicar até achar". */
const CMD={aberta:false,q:"",sel:0,itens:[],modo:"tudo"};

 ["⌘ K / Ctrl K","Abrir esta paleta"],

 ["G depois T","To Do"],
 ["J e K","Andar pela lista do To Do"],
 ["C","Cadastrar negócio"],
 ["E","Alternar quadro e lista"],

  {g:"Ação",ico:"+",t:"Cadastrar parceiro",m:"",f:()=>{state.tela="contas";state.aba="parceiros";criarConta("parceiro");}},

  {g:"Ação",ico:"?",t:"Ver atalhos de teclado",m:"?",f:()=>{CMD.modo="atalhos";CMD.q="";CMD.sel=0;renderCmd();return true;}},
  {g:"Ação",ico:"i",t:"Versão publicada: "+VERSAO,m:"",f:()=>{toast("Versão publicada: "+VERSAO,true);}}

 (state.servidor?["exportar","imprimir"]:Object.keys(TEXTOS.menu)).forEach(k=>{

function renderCmd(){

   esc(k)+"</kbd></span></div>").join("");
  return;
 }
 CMD.itens=itensCmd();
 if(!CMD.itens.length){cx.innerHTML='<div class="cvazio">Nada com “'+esc(CMD.q)+"”.</div>";return;}
 if(CMD.sel>=CMD.itens.length)CMD.sel=CMD.itens.length-1;
 if(CMD.sel<0)CMD.sel=0;

function rodarCmd(i){
 const x=CMD.itens[i];if(!x)return;
 /* Ação que devolve true fica com a paleta aberta — é o caso dos atalhos. */

/* Digitação em campo não é atalho: sem isto, escrever "capital" numa nota
   navegaria a tela três vezes. */
const digitando=el=>!!el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT"||el.isContentEditable);
let teclaG=0;
document.addEventListener("keydown",e=>{
 /* e.key vem indefinido em evento de teclado sintético -- extensão de navegador
    e gerenciador de senha disparam isso, e o MetaMask instalado no navegador de
    quem relatou dispara em toda página. Sem esta linha, a PRIMEIRA comparação do
    handler estourava um TypeError, e com ela morriam todos os atalhos: ⌘K,
    Escape, Enter na paleta, j e k no To Do. Normalizar uma vez, no topo, é o
    único lugar em que isto não volta. */
 const tecla=typeof e.key==="string"?e.key:"";
 const k=tecla.toLowerCase();
 /* A paleta responde primeiro: ela é modal. */
 if((e.ctrlKey||e.metaKey)&&k==="k"){e.preventDefault();
  if(CMD.aberta)fecharCmd();else abrirCmd();return;}
 if(CMD.aberta){
  if(tecla==="Escape"){e.preventDefault();fecharCmd();return;}
  if(CMD.modo==="atalhos"){if(tecla==="Enter"){e.preventDefault();fecharCmd();}return;}
  if(tecla==="ArrowDown"){e.preventDefault();CMD.sel++;renderCmd();return;}
  if(tecla==="ArrowUp"){e.preventDefault();CMD.sel--;renderCmd();return;}
  if(tecla==="Enter"){e.preventDefault();rodarCmd(CMD.sel);return;}
  return;
 }
 if(!tecla)return;
 if(tecla==="Escape"&&state.hintBtn){e.preventDefault();fecharHint(true);return;}
 const cart=document.activeElement&&document.activeElement.closest?document.activeElement.closest("[data-kpi]"):null;
 if(cart&&(tecla==="Enter"||tecla===" ")){e.preventDefault();
  abrirPainel({tipo:"kpi",id:cart.dataset.kpi});return;}
 if(!digitando(document.activeElement)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
  if(k==="g"){teclaG=Date.now();return;}
  /* G seguido de letra, com um segundo de janela, como nas ferramentas de
     onde a ideia vem. */
  if(Date.now()-teclaG<1000&&(k==="p"||k==="n"||k==="c"||k==="t")){
   teclaG=0;e.preventDefault();
   irPara(k==="p"?"painel":k==="n"?"negocios":k==="t"?"todo":"contas");return;}
  if(tecla==="/"){e.preventDefault();$("#busca").focus();$("#busca").select();return;}
  if(tecla==="?"){e.preventDefault();abrirCmd("atalhos");return;}
  /* j e k andam pela lista do To Do; Enter abre o negócio da linha. */
  if(state.tela==="todo"&&!state.painel&&(k==="j"||k==="k"||tecla==="Enter")){
   if(!TODO_FOCO.length)return;
   if(tecla==="Enter"){
    if(state.todoSel>=0){e.preventDefault();abrirPainel({tipo:"deal",id:TODO_FOCO[state.todoSel]});}
    return;}
   e.preventDefault();
   state.todoSel=Math.max(0,Math.min(TODO_FOCO.length-1,state.todoSel+(k==="j"?1:-1)));
   render();
   const el=document.querySelector('[data-tirow="'+state.todoSel+'"]');
   if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest"});
   return;}
  if(k==="c"&&!state.painel){e.preventDefault();novoNegocio();return;}
  if(k==="e"&&state.tela==="negocios"){e.preventDefault();
   state.vista=state.vista==="lista"?"quadro":"lista";render();return;}
 }
 /* Ctrl+S baixa um HTML com o dataset embutido, que no servidor está vazio.
    O arquivo baixado seria uma casca sem dados. */
 if((e.ctrlKey||e.metaKey)&&k==="s"){e.preventDefault();
  if(state.servidor)toast("No servidor os dados ficam no banco. Use Exportar.",true);
  else salvarArquivo();}
 else if(tecla==="Escape"&&state.painel)fecharPainel();
});
/* arrastar */
document.addEventListener("dragstart",e=>{
 const c=e.target.closest(".dc");if(!c)return;
 e.dataTransfer.setData("text/plain",c.dataset.id);c.classList.add("drag");
});
document.addEventListener("dragend",e=>{const c=e.target.closest(".dc");if(c)c.classList.remove("drag");});
document.addEventListener("dragover",e=>{const col=e.target.closest(".col");if(!col)return;
 e.preventDefault();col.classList.add("over");});
document.addEventListener("dragleave",e=>{const col=e.target.closest(".col");if(col)col.classList.remove("over");});
document.addEventListener("drop",e=>{
 const col=e.target.closest(".col");if(!col)return;
 e.preventDefault();col.classList.remove("over");
 const id=e.dataTransfer.getData("text/plain");
 /* Cada quadro é de uma frente. Arrastar para o quadro de outra frente não
    faz sentido: o número da etapa lá quer dizer outra coisa. */
 const d=state.data.deals.find(x=>x.id===id);
 if(!d||frenteDe(d)!==col.dataset.frente)return;
 const err=moverEtapa(id,Number(col.dataset.etapa));
 state.erroCard=err?{id:id,msg:err}:null;render();
});
window.addEventListener("beforeunload",e=>{if(state.dirty){e.preventDefault();e.returnValue="";}});
let faixaAtual=faixaTela();
window.addEventListener("resize",()=>{
 clearTimeout(state.rt);
 state.rt=setTimeout(()=>{const f=faixaTela();if(f!==faixaAtual){faixaAtual=f;render();}
  else if(state.hintBtn)posicionarHint(state.hintBtn);},150);
});
window.addEventListener("scroll",()=>{if(state.hintBtn)posicionarHint(state.hintBtn);},true);
$("#hint").addEventListener("keydown",e=>{
 if(e.key==="Tab"){e.preventDefault();const b=$("#hint").querySelector("button");if(b)b.focus();}
 else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();fecharHint(true);}
});
function novoNegocio(){
 state.novo={titulo:"",tipoVenda:"direta",clienteId:"",parceiroId:"",frente:"payments",tese:"",
  clienteNovoNome:"",clienteNovoTipo:"PJ",
  publico:"B2B",publicoManual:false,
  valor:"",responsavel:RESPS[0],proximoPasso:"",prazo:agora(),chance:"50",erros:null};
 abrirPainel({tipo:"novo"});
}
function criar(){
 const n=state.novo,er={};
 if(!n.titulo.trim())er.titulo=TEXTOS.erros.titulo;
 /* Valor vazio e um estado legitimo: o negocio entra com a marca de valor a
    definir, como os credenciamentos que ja estao na base. Numero invalido
    continua sendo erro. */
 const valorLimpo=String(n.valor).replace(/\D/g,"");
 if(String(n.valor).trim()&&!valorLimpo)er.valor=TEXTOS.erros.valor;
 if(n.tipoVenda==="direta"&&!n.clienteId)er.clienteId=TEXTOS.erros.cliente;
 if(n.clienteId===CLIENTE_NOVO&&!n.clienteNovoNome.trim())er.clienteNovoNome=TEXTOS.erros.clienteNovo;
 if(n.tipoVenda==="parceiro"&&!n.parceiroId)er.parceiroId=TEXTOS.erros.parceiro;
 if(n.frente==="capital"&&!n.tese.trim())er.tese=TEXTOS.erros.tese;
 if(Object.keys(er).length){n.erros=er;renderPainelLateral();return;}
 snapshot();
 /* Cliente novo nasce com o mínimo que o formulário sabe. O que ele não sabe
    fica vazio: campo em branco é informação, palpite não é. */
 let clienteId=n.clienteId;
 if(clienteId===CLIENTE_NOVO){
  const c={id:uid("C"),nome:n.clienteNovoNome.trim(),tipo:n.clienteNovoTipo,
   publico:n.clienteNovoTipo==="PF"?"B2C":"B2B",responsavel:n.responsavel,
   frente:n.frente,origemNegocioId:"",tier:"",status:"",porte:"",setor:"",uf:"",notas:"",
   receitaRecorrente:0,parceiroId:n.tipoVenda==="parceiro"?n.parceiroId:null,
   exemplo:false,criadoEm:agora(),atualizadoEm:agora()};
  state.data.customers.push(c);clienteId=c.id;
 }
 state.data.deals.push({id:uid("N"),titulo:n.titulo.trim(),frente:n.frente,tipoVenda:n.tipoVenda,
  parceiroId:n.tipoVenda==="parceiro"?n.parceiroId:null,clienteId:clienteId||null,responsavel:n.responsavel,
  valor:valorLimpo?Number(valorLimpo):"",etapa:1,proximoPasso:n.proximoPasso,prazo:n.prazo,
  publico:publicoDe(n),mandatoAssinadoEm:"",checklist:{},
  chance:Math.max(0,Math.min(100,Number(n.chance)||0)),pendencias:[],tese:n.tese||"",estrutura:"",frenteCapital:"",
  investidor:"",statusCaptacao:"",cincoPerguntas:{pagamento:"NaoAvaliada",contrato:"NaoAvaliada",garantias:"NaoAvaliada",valorImovel:"NaoAvaliada",usoAlternativo:"NaoAvaliada"},
  seisCamadas:{qualidadeEmpresa:{nota:0,obs:""},contratoLongoPrazo:{nota:0,obs:""},garantias:{nota:0,obs:""},valorImovel:{nota:0,obs:""},trocaOcupante:{nota:0,obs:""},usoAlternativo:{nota:0,obs:""}},
  tags:valorLimpo?[]:[TAG_VALOR],situacao:"",segmento:"",origem:"",ufs:"",papeis:novoPapeis(),territorio:novoTerritorio(),comite:novoComite(),
  motivoPerda:"",notas:"",exemplo:false,criadoEm:agora(),atualizadoEm:agora(),fechadoEm:null,
  historico:[{de:"—",para:FUNIS[FUNIS[n.frente]?n.frente:"governance"][0],
   quando:new Date().toISOString(),quem:(state.usuario&&state.usuario.nome)||n.responsavel}]});
 state.painel=null;marcar();
}
/* Mesmo conjunto de campos dos registros que ja existem no dataset. Um campo
   a menos aqui e um campo que desaparece na primeira gravacao. */
function criarConta(kind){
 snapshot();
 const base={id:uid(kind==="cliente"?"C":"P"),nome:kind==="cliente"?"Novo cliente":"Novo parceiro",
  responsavel:RESPS[0],tier:"",status:"",porte:"",setor:"",notas:"",
  exemplo:false,criadoEm:agora(),atualizadoEm:agora()};
 if(kind==="cliente"){
  const o=Object.assign(base,{tipo:"PJ",publico:"B2B",frente:"capital",uf:"",receitaRecorrente:0,
   parceiroId:null,origemNegocioId:""});
  state.data.customers.push(o);state.aba="clientes";state.painel={tipo:"conta",kind:"cliente",id:o.id};
 }else{
  const o=Object.assign(base,{frentes:[],potencial:"",contato:""});
  state.data.partners.push(o);state.aba="parceiros";state.painel={tipo:"conta",kind:"parceiro",id:o.id};
 }
 marcar();
}
/* Perdido exige motivo. Sem pedir aqui, a etapa fica inalcancavel. */
function pedirMotivo(id){
 const d=state.data.deals.find(x=>x.id===id);
 if(!d||d.motivoPerda)return true;
 const m=prompt("Por que este negócio foi perdido?","");
 if(m==null||!m.trim())return false;
 d.motivoPerda=m.trim();d.atualizadoEm=agora();
 return true;
}
function menuAcao(k){
 if(k==="salvar")salvarArquivo();
 else if(k==="exportar")exportarJSON();
 else if(k==="importar")$("#fileimp").click();
 else if(k==="imprimir")window.print();
 else if(k==="limpar"){
  if(!confirm("Remover todos os registros marcados como exemplo?"))return;
  snapshot();
  state.data.deals=state.data.deals.filter(d=>!d.exemplo);
  state.data.customers=state.data.customers.filter(c=>!c.exemplo);
  state.data.partners=state.data.partners.filter(p=>!p.exemplo);
  state.painel=null;marcar();toast("Dados de exemplo removidos.");
 }else if(k==="recomecar"){
  /* No servidor o dataset embutido está vazio de propósito: recomeçar gravaria
     essa base vazia por cima do trabalho de todo mundo. O menu já esconde o
     item nesse modo; isto é a tranca de dentro. */
  if(state.servidor){toast("Recomeçar não existe no modo servidor.",true);return;}
  if(!confirm("Recomeçar apaga tudo o que foi editado e volta aos dados originais do arquivo. Continuar?"))return;
  snapshot();state.data=JSON.parse(JSON.stringify(EMBEDDED));state.painel=null;marcar();toast("Dados originais recarregados.");
 }
}
$("#fileimp").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{importarJSON(r.result);e.target.value="";};r.readAsText(f);
});
/* Descobre em que mundo estamos: servidor com sessão, servidor pedindo login,
   ou arquivo aberto direto do computador (aí segue exatamente como antes). */
(async function iniciar(){
 state.servidor=true;
 state.data={partners:[],customers:[],deals:[]};
 /* Antes de qualquer coisa: se o link trouxe erro, a tela de entrada tem de
    dizer isso, não abrir calada. */
 const avisoLink=erroDaUrl()||codigoNaUrl();
 const daUrl=sessaoDaUrl();
 if(daUrl&&await completarSessao(daUrl.sessao)&&await carregarPerfil()){
  render();
  if(daUrl.recuperacao||state.usuario.senhaProvisoria){exigirTroca();return;}
  if(await carregarEMigrar())return;
 }
 if(sessaoGuardada()&&await carregarPerfil()){
  if(state.usuario.senhaProvisoria){render();exigirTroca();return;}
  if(await carregarEMigrar())return;
 }
 render();mostrarLogin();
 if(avisoLink){const e=$("#lerro");if(e){e.textContent=avisoLink;e.className="erro on";}}
})();
$("#senhaform").addEventListener("submit",async e=>{
 e.preventDefault();
 const b=$("#sbtn"),err=$("#serro");
 b.disabled=true;b.textContent="Salvando…";err.className="erro";
 try{
  await trocarSenha($("#snova").value);
  if(state.trocaObrigatoria){
   await senhaTrocada();
   state.trocaObrigatoria=false;
   fecharTrocaSenha();
   await carregarEMigrar();
   toast("Senha definida. Bem-vindo.",true);
  }else{fecharTrocaSenha();toast("Senha alterada.",true);}
 }catch(x){err.textContent=x.message;err.className="erro on";}
 finally{b.disabled=false;b.textContent="Salvar nova senha";}
});
$("#scancel").addEventListener("click",fecharTrocaSenha);
$("#lesqueci").addEventListener("click",async()=>{
 const err=$("#lerro"),email=$("#lemail").value.trim();
 if(!email){err.textContent="Escreva seu e-mail primeiro.";err.className="erro on";return;}
 try{await pedirRecuperacao(email);err.textContent=TEXTOS.recEnviado(email);err.className="erro on";
  err.style.color="var(--pos)";}
 catch(x){err.textContent=x.message;err.className="erro on";err.style.color="";}
});

["#snova"].forEach(id=>$(id).addEventListener("input",()=>{$("#serro").className="erro";}));
["#lemail","#lsenha"].forEach(id=>$(id).addEventListener("input",()=>{$("#lerro").className="erro";}));

 const b=$("#lbtn"),err=$("#lerro");
 b.disabled=true;b.textContent=TEXTOS.entrando;err.className="erro";

 catch(x){err.textContent=x.message;err.className="erro on";}
 finally{b.disabled=false;b.textContent="Entrar";}
});
