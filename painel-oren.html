<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Oren · Painel comercial</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23092d29'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='8.5'%20fill='none'%20stroke='%23affa57'%20stroke-width='4'/%3E%3C/svg%3E">
<meta name="theme-color" content="#092d29">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script id="oren-dataset" type="application/json">{"partners":[],"customers":[],"deals":[]}</script>
<style>
/* ================= BASE (mobile first — 360px) ================= */
*{box-sizing:border-box;margin:0;padding:0}
:root{
--deep:#092d29;--mid:#0e5351;--luz:#affa57;--creme:#e8f3e8;
--capital:#62cc6d;--governance:#1da688;--payments:#affa57;
--bg:#f3f3f1;--surf:#fff;--alt:#fafaf8;--bd:#e3e6e3;--bdf:#d4d8d4;
--tx:#1a1a1a;--tx2:#4a564f;--tx3:#6b7672;--neg:#b00020;--pos:#1a6e3a;
--nav:56px;--safe:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
font-size:13px;font-weight:400;line-height:1.45;color:var(--tx);background:var(--bg);
font-variant-numeric:tabular-nums;display:flex;min-width:0}
svg{max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit;border-radius:0;max-width:100%}
button{cursor:pointer;background:none;border:1px solid var(--bdf);padding:8px 12px;min-height:44px}
button:hover{border-color:var(--mid)}
select,textarea,input:not([type=checkbox]){min-height:44px;padding:8px;min-width:0}
:focus-visible{outline:2px solid var(--mid);outline-offset:1px}
a{color:var(--mid);text-decoration:none}
a:hover{color:var(--deep);text-decoration:underline}
.lbl{font-size:11px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase}
.num{font-size:32px;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.d15{font-size:15px}
.mut{color:var(--tx2)}
.soft{color:var(--tx3)}
.mt16{margin-top:16px}
.sep{margin:0 4px}
/* ================= LATERAL (só a partir de 1024px) ================= */
#side{display:none;width:200px;flex:0 0 200px;background:var(--deep);color:var(--creme);
flex-direction:column;height:100vh;position:sticky;top:0}
#side .brand{padding:16px;border-bottom:1px solid rgba(232,243,232,.15)}
#side .brand b{font-weight:500;font-size:15px;letter-spacing:-.01em}
#side .brand div{font-size:11px;letter-spacing:.14em;color:var(--luz);margin-top:4px}
#nav{display:flex;flex-direction:column;padding:8px 0}
#nav button{border:0;text-align:left;padding:8px 16px;color:var(--creme);font-size:13px;
border-left:2px solid transparent;min-height:44px}
#nav button:hover{background:rgba(232,243,232,.07)}
#nav button.on{background:rgba(175,250,87,.12);border-left-color:var(--luz);font-weight:500}
#menu{margin-top:auto;padding:12px 8px;border-top:1px solid rgba(232,243,232,.15);
display:flex;flex-direction:column;gap:4px}
#menu .menur,#menu2 .menur{display:flex;align-items:center;gap:4px}
#menu .menur button[data-menu],#menu2 .menur button[data-menu]{flex:1 1 auto;min-width:0;text-align:left}
#menu button{border:0;text-align:left;color:rgba(232,243,232,.72);font-size:11px;padding:8px;min-height:44px}
#menu button:hover{color:var(--luz)}
/* ================= PRINCIPAL ================= */
#main{flex:1;min-width:0;display:flex;flex-direction:column;
padding-bottom:calc(var(--nav) + var(--safe) + 24px)}
#top{background:var(--deep);color:var(--creme);display:flex;align-items:center;flex-wrap:wrap;
gap:8px;padding:8px 16px;position:sticky;top:0;z-index:5}
#brandm{font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--luz);flex:0 0 auto}
#top h1{font-size:15px;font-weight:400;letter-spacing:-.02em;min-width:0;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#busca{order:5;flex:1 1 100%;background:rgba(232,243,232,.1);border:1px solid rgba(232,243,232,.25);
color:var(--creme);padding:8px}
#busca::placeholder{color:rgba(232,243,232,.55)}
#savedot{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-left:auto;flex:0 0 auto}
#savedot.ok{color:var(--luz)}
#savedot.no{color:#ffd7d7}
#btnnovo{display:none}
#hbusca{order:4}
/* menu de ações no celular */
#menum{position:relative;flex:0 0 auto}
#menum summary{list-style:none;cursor:pointer;min-height:44px;min-width:44px;display:flex;
align-items:center;justify-content:center;padding:8px 12px;font-size:11px;letter-spacing:.12em;
text-transform:uppercase;border:1px solid rgba(232,243,232,.25)}
#menum summary::-webkit-details-marker{display:none}
#menum[open] summary{border-color:var(--luz)}
#menu2{position:absolute;right:0;top:calc(100% + 8px);z-index:6;min-width:200px;
background:var(--surf);border:1px solid var(--bdf);display:flex;flex-direction:column;padding:4px}
#menu2 button{border:0;text-align:left;color:var(--tx);padding:8px 12px;min-height:44px}
#menu2 button:hover{background:var(--alt)}
#chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 16px 0;min-width:0}
#content{padding:16px;flex:1;min-width:0}
/* ================= NAVEGAÇÃO INFERIOR + FLUTUANTE (celular/tablet) ================= */
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:18;display:flex;background:var(--deep);
border-top:1px solid rgba(232,243,232,.15);padding-bottom:var(--safe)}
#bnav button{flex:1 1 0;min-width:0;border:0;height:var(--nav);min-height:var(--nav);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;
color:rgba(232,243,232,.72);font-size:11px;letter-spacing:.04em;transition:color 150ms ease-out}
#bnav button:hover{border:0}
#bnav button svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.5}
#bnav button.on{color:var(--luz)}
#fab{position:fixed;right:16px;bottom:calc(var(--nav) + var(--safe) + 16px);z-index:19;
width:56px;height:56px;min-height:56px;padding:0;border:0;border-radius:999px;
background:var(--mid);color:#fff;font-size:24px;line-height:1;
display:flex;align-items:center;justify-content:center}
#fab:hover{background:var(--deep);border:0}
/* ================= CHIPS + FILTROS ================= */
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--bdf);background:var(--surf);
padding:4px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);
min-width:0;max-width:100%;flex-wrap:wrap}
.chip b{font-weight:500;color:var(--tx);text-transform:none;letter-spacing:0;font-size:13px;
min-width:0;overflow-wrap:anywhere}
.chip select{border:1px solid var(--bd);background:var(--alt);padding:8px;min-width:0}
.chip button{border:0;padding:0 8px;color:var(--tx3);font-size:13px;line-height:1;min-height:44px;min-width:44px}
.chip button:hover{color:var(--neg)}
.seg{display:flex;border:1px solid var(--bdf);background:var(--surf);min-width:0;max-width:100%}
.seg button{border:0;border-right:1px solid var(--bd);padding:8px 12px;color:var(--tx2);min-width:0}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--mid);color:#fff;font-weight:500}
.tbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lnk{margin-left:auto;border:0;color:var(--mid);text-decoration:underline;padding:8px 0}
.lnk:hover{border:0;color:var(--deep)}
/* ================= CARTÕES ================= */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:1fr}
.g2{grid-template-columns:1fr}
.card{background:var(--surf);border:1px solid var(--bd);padding:12px;min-width:0}
.card h2{font-size:15px;font-weight:500;margin-bottom:12px}
.kpi .num{margin:8px 0 4px}
.delta{font-size:11px;letter-spacing:.04em}
.up{color:var(--pos)}.down{color:var(--neg)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);text-align:left;
font-weight:500;padding:8px 12px;border-bottom:1px solid var(--bdf);white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--mid)}
td{padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:top;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:var(--alt)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:#eef4ee}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;letter-spacing:.06em;
background:var(--bg);border:1px solid var(--bdf);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:4px;
vertical-align:middle;flex:0 0 auto}
.ini{display:inline-flex;width:24px;height:24px;border:1px solid var(--bdf);align-items:center;
justify-content:center;font-size:11px;color:var(--tx2);background:var(--alt);flex:0 0 auto}
.late{color:var(--neg)}
.empty{color:var(--tx3);font-size:13px;padding:16px 0;border-top:1px solid var(--bd)}
/* ================= LISTAS DE DUAS LINHAS ================= */
.rowlist{display:flex;flex-direction:column;min-width:0}
.rowlist>div{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
gap:4px;padding:12px 0;border-bottom:1px solid var(--bd);min-height:44px;min-width:0}
.rowlist>div:last-child{border-bottom:0}
.rl-main{display:block;max-width:100%;min-width:0;font-size:14px;font-weight:500;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-sub{display:block;max-width:100%;min-width:0;font-size:12px;color:var(--tx3);
white-space:normal;overflow-wrap:anywhere}
/* lista de cartões (celular) */
.clist{display:flex;flex-direction:column;gap:8px;min-width:0}
.ci{display:flex;flex-direction:column;gap:4px;background:var(--surf);border:1px solid var(--bd);
padding:12px;min-height:44px;min-width:0;cursor:pointer}
.ci .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ci .s{font-size:12px;color:var(--tx3);overflow-wrap:anywhere}
/* ================= GRÁFICOS ================= */
.gsvg{display:block;width:100%;height:auto}
.rosca{display:flex;flex-direction:column;gap:16px;min-width:0}
.rosca>svg{width:100%;max-width:180px;height:auto;align-self:center;flex:0 0 auto}
.rosca>.rowlist{flex:1 1 auto;min-width:0}
/* ================= QUADRO ================= */
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;overflow-y:visible;
scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 12px}
.bwrap+.bwrap{margin-top:24px}
.bh{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.fun+.fun{margin-top:16px;padding-top:16px;border-top:1px solid var(--bd)}
#pubseg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 16px 0;min-width:0}
.badge.b2c{border-color:#9ec7a8;background:#eef7f0;color:#1a6e3a}
.col{flex:0 0 86vw;scroll-snap-align:start;min-width:0;background:var(--surf);
border:1px solid var(--bd);min-height:200px;display:flex;flex-direction:column}
.col.over{border-color:var(--mid);background:#f2f8f4}
.colh{padding:12px;border-bottom:1px solid var(--bdf)}
.colh .n{font-size:13px;font-weight:500}
.colh .m{font-size:11px;color:var(--tx3);margin-top:4px;letter-spacing:.04em}
.cards{padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dc{border:1px solid var(--bd);background:var(--surf);padding:12px;cursor:pointer;min-width:0}
.dc:hover{border-color:var(--bdf)}
.dc.drag{opacity:.4}
.dc .cl{font-size:14px;font-weight:500;letter-spacing:-.01em;margin-bottom:4px;overflow-wrap:anywhere}
.dc .vl{font-weight:500;font-variant-numeric:tabular-nums}
.dc .rw{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;min-width:0}
.dc .np{font-size:13px;color:var(--tx2);margin-top:8px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;min-width:0}
.dc select{width:100%;margin-top:8px;border:1px solid var(--bd);padding:8px;background:var(--alt);font-size:12px}
.dc .err{margin-top:8px;border-left:2px solid var(--neg);padding:8px;background:#fff5f5;
color:var(--neg);font-size:11px;line-height:1.4}
/* ================= FOLHA / PAINEL DE DETALHE ================= */
#panel{position:fixed;left:0;right:0;bottom:0;top:0;width:100%;background:var(--surf);
z-index:20;display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain;
transform:translateY(100%);transition:transform 150ms ease-out;
box-shadow:0 -8px 32px rgba(9,45,41,.18);padding-bottom:calc(var(--safe) + 24px)}
#panel.open{transform:translateY(0)}
#shade{position:fixed;inset:0;background:rgba(9,45,41,.25);z-index:15;display:none}
#shade.open{display:block}
.ph{background:var(--deep);color:var(--creme);padding:16px;position:sticky;top:0;z-index:2}
.ph .x{float:right;border:0;color:var(--creme);font-size:13px;padding:8px;min-height:44px}
.ph .x:hover{color:var(--luz);border:0}
.pb{padding:16px}
.trk{display:flex;gap:8px;margin:16px 0;overflow-x:auto;scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;scrollbar-width:none}
.trk::-webkit-scrollbar{display:none}
.trk button{position:relative;flex:0 0 132px;scroll-snap-align:start;min-width:0;
display:flex;flex-direction:column;gap:4px;padding:8px;min-height:64px;
border:0;background:none;text-align:left}
.trk button:hover{border:0;background:var(--alt)}
.trk .bar{position:absolute;top:0;left:0;right:0;height:3px;background:var(--bd)}
.trk button.done .bar,.trk button.now .bar{background:var(--mid)}
.trk .n{font-size:11px;line-height:1;color:var(--tx3)}
.trk .t{font-size:12px;line-height:1.3;color:var(--tx3);
display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.trk button.now .t{color:var(--tx);font-weight:500}
.fld{display:grid;grid-template-columns:1fr;gap:4px;padding:8px 0;
border-bottom:1px solid var(--bd);align-items:start;min-width:0}
.fld>.lbl{padding-top:4px}
.fld>span{min-width:0;overflow-wrap:anywhere}
.sec{border-top:1px solid var(--bdf);margin-top:12px}
.sec>.sech{display:flex;align-items:center;gap:8px}
.sec>.sech>button[data-sec]{flex:1 1 auto;min-width:0;border:0;text-align:left;padding:12px 0;
font-size:13px;font-weight:500;display:flex;gap:8px}
.sec>.sech>button[data-sec]:hover{border:0}
.sec>.sech>button[data-sec] .cnt{color:var(--tx3);font-weight:400;margin-left:auto}
.sec .body{padding:0 0 12px}
[data-edit]{cursor:text;border-bottom:1px dashed transparent;padding:4px 0;display:inline-block;
max-width:100%;min-width:0}
[data-edit]:hover{border-bottom-color:var(--mid);background:#f6faf6}
[data-edit]::after{content:"editar";font-size:11px;color:var(--mid);margin-left:8px;opacity:0}
[data-edit]:hover::after{opacity:1}
[data-edit] input,[data-edit] select,[data-edit] textarea{width:100%;border:1px solid var(--mid);
padding:8px;background:#fff}
.pend{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd);
flex-wrap:wrap;min-width:0}
.pend input[type=checkbox]{width:24px;height:24px;margin:8px 0;flex:0 0 auto}
.pend>span{min-width:0;overflow-wrap:anywhere}
.pend .blk{color:var(--neg);font-size:11px;letter-spacing:.06em}
.pend .corpo{flex:1 1 12em;min-width:0;overflow-wrap:anywhere}
.pend .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--tx3);margin-top:2px}
.pend .meta [data-edit]{font-size:11px;padding:2px 0}
.pend .acs{display:flex;gap:4px;align-items:center;flex:0 0 auto;margin-left:auto}
.pend .acs button{font-size:11px;padding:6px 8px;min-height:32px;letter-spacing:.04em}
.pend .acs button.on{border-color:var(--neg);color:var(--neg)}
.pend.done{color:var(--tx3);text-decoration:line-through}
.err{color:var(--neg);font-size:11px;margin-top:4px;display:block}
/* ================= AVISO ================= */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + var(--safe) + 56px + 24px);
background:var(--deep);color:var(--creme);padding:12px 16px;display:none;gap:16px;
align-items:center;flex-wrap:wrap;z-index:30}
#toast.on{display:flex}
#toast button{border:1px solid var(--luz);color:var(--luz);padding:8px 12px}
#toast button:hover{border-color:var(--luz);background:rgba(175,250,87,.12)}
/* ================= ENTRAR ================= */
#login{position:fixed;inset:0;z-index:60;background:var(--deep);display:none;
align-items:center;justify-content:center;padding:16px}
#login.on{display:flex}
#login form{background:var(--surf);border:1px solid var(--bdf);padding:24px;width:100%;max-width:360px}
#login .marca{font-size:20px;font-weight:500;letter-spacing:-.02em;color:var(--deep)}
#login .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin:4px 0 24px}
#login label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
color:var(--tx3);margin-bottom:4px}
#login input{width:100%;border:1px solid var(--bdf);padding:8px;margin-bottom:16px;background:var(--alt)}
#login button{width:100%;background:var(--mid);border:1px solid var(--mid);color:#fff;
font-weight:500;padding:12px;min-height:44px}
#login button:hover{background:#0a4240;border-color:#0a4240}
#login .erro{color:var(--neg);font-size:11px;margin-bottom:16px;display:none}
#login .erro.on{display:block}
#quem{font-size:11px;letter-spacing:.06em;color:rgba(232,243,232,.72);padding:8px 16px;
border-top:1px solid rgba(232,243,232,.15);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#quem b{font-weight:500;color:var(--creme)}
#quem button{border:0;color:rgba(232,243,232,.72);font-size:11px;padding:8px 0;min-height:44px}
#quem button:hover{color:var(--luz)}
/* ================= HINTS ================= */
.hint{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
width:16px;height:16px;min-height:16px;padding:0;margin-left:8px;vertical-align:middle;
border:1px solid var(--bdf);background:var(--surf);color:var(--tx3);font-size:11px;line-height:1}
.hint:hover,.hint:focus-visible{color:var(--mid);border-color:var(--mid)}
.hint.esc{border-color:rgba(232,243,232,.35);background:none;color:rgba(232,243,232,.72)}
.hint.esc:hover,.hint.esc:focus-visible{color:var(--luz);border-color:var(--luz)}
#hint{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe));top:auto;z-index:40;
display:none;background:#fff;border:0;border-top:1px solid var(--bdf);padding:16px;
font-size:13px;line-height:1.45;color:var(--tx);box-shadow:0 -8px 32px rgba(9,45,41,.18)}
#hint.on{display:block}
#hint .lbl{margin-bottom:8px}
#hint p{margin-bottom:8px}
#hint p:last-of-type{margin-bottom:0}
#hint .hintx{margin-top:16px;border:1px solid var(--mid);color:var(--mid);padding:8px 12px}
#print{display:none}
/* ================= 768px — TABLET ================= */
@media (min-width:768px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .rowlist>div{flex-direction:row;align-items:baseline;gap:12px}
 .rl-main{flex:1 1 auto;min-width:0}
 .rl-sub{flex:0 0 auto;white-space:nowrap;text-align:right;overflow-wrap:normal}
 .rosca{flex-direction:row;align-items:center;gap:24px}
 .rosca>svg{flex:0 1 180px;min-width:96px;align-self:auto}
 .col{flex:0 0 60vw}
 .fld{grid-template-columns:150px 1fr;gap:12px}
 .card{padding:16px}
 #content{padding:24px}
 #chips{padding:24px 24px 0}
 .board{margin:0 -24px;padding:0 24px 12px}
 #pubseg{padding:24px 24px 0}
 #hint{left:auto;right:auto;bottom:auto;top:0;width:280px;max-width:280px;padding:12px;
  border:1px solid var(--bdf);box-shadow:none}
 #hint .hintx{margin-top:12px}
}
/* ================= 1024px — MESA ================= */
@media (min-width:1024px){
 button{min-height:32px;padding:8px 12px}
 select,textarea,input:not([type=checkbox]){min-height:32px;padding:4px 8px}
 #side{display:flex}
 #bnav,#fab{display:none}
 #main{padding-bottom:0}
 #top{height:56px;flex:0 0 56px;flex-wrap:nowrap;gap:16px;padding:0 24px}
 #brandm,#menum{display:none}
 #top h1{font-size:20px;flex:0 0 auto;min-width:180px}
 #busca{order:2;flex:1 1 auto;max-width:420px}
 #hbusca{order:3;margin-left:0}
 #savedot{order:3}
 #btnnovo{order:4;display:inline-flex;align-items:center;justify-content:center;
  background:var(--mid);border:1px solid var(--mid);color:#fff;font-weight:500;padding:8px 16px}
 #btnnovo:hover{background:#0a4240;border-color:#0a4240}
 #nav button,#menu button{min-height:32px}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .g2{grid-template-columns:1fr 1fr}
 .g2.w14{grid-template-columns:1.4fr 1fr}
 .chip button{min-height:24px;min-width:24px}
 .chip select{padding:4px 8px}
 /* Antes eram cinco colunas fixas, uma por fase. Agora as colunas são as
    etapas do funil, que variam de sete a dez, então a faixa continua rolando
    na horizontal e cada coluna tem largura própria: nome de etapa por
    extenso não caberia em dez colunas espremidas. */
 .board{margin:0;padding:0 0 12px}
 .col{flex:0 0 248px;scroll-snap-align:start}
 .dc select{padding:4px;font-size:11px}
 #panel{top:0;left:auto;right:0;width:520px;height:100vh;padding-bottom:0;
  border-left:1px solid var(--bdf);transform:translateX(100%);
  box-shadow:-8px 0 32px rgba(9,45,41,.12)}
 #panel.open{transform:translateX(0)}
 .ph{padding:16px 24px}
 .pb{padding:16px 24px}
 #toast{left:216px;right:auto;bottom:16px}
}
/* ===== abaixo de 1024px: sem arraste, sem estado de mouse ===== */
@media (max-width:1023px){
 .dc:hover{border-color:var(--bd)}
 .ci:hover{border-color:var(--bd)}
 .dc{-webkit-user-drag:none;-webkit-user-select:none;user-select:none}
 .board,.trk{touch-action:pan-x pan-y}
 [data-edit]::after{content:none}
 .hint::after{content:"";position:absolute;top:-14px;right:-14px;bottom:-14px;left:-14px}
}
/* ===== celular: respiro das duas linhas ===== */
@media (max-width:767px){
 #top h1{flex:1 1 auto}
 .rl-sub{line-height:1.5}
 .ci .s{line-height:1.5}
 .empty{padding:16px 0 8px}
}
/* ===== quem pediu menos movimento ===== */
@media (prefers-reduced-motion:reduce){
 #panel{transition:none}
 #bnav button{transition:none}
 .board,.trk{scroll-behavior:auto}
}
/* ================= IMPRESSÃO ================= */
@media print{
 #side,#top,#chips,#pubseg,#panel,#shade,#toast,#bnav,#fab,#hint,.hint,.seg,.noprint{display:none!important}
 body{min-width:0;display:block;background:#fff}
 #main{padding-bottom:0}
 #content{display:none}
 #print{display:block;padding:0}
 @page{size:A4 portrait;margin:14mm}
 thead{display:table-header-group}
 tr{page-break-inside:avoid}
 .card{border:0;padding:0}
 .tbl{overflow:visible}
}

 if(d.tipoVenda==="parceiro"&&!d.parceiroId)return TEXTOS.erros.parceiro;

 const n=Number(etapa);
 if(d.frente==="capital"&&!d.tese)return TEXTOS.erros.tese;

    compliance (etapa 4). Ata de 21/08/2026, seção 7.1 — conversa exploratória
    pode seguir, assinatura e onboarding não, antes da OB-03 e da OB-04. */
 if(d.frente==="payments"&&n>=5&&(d.pendencias||[]).some(p=>p.bloqueante&&!p.resolvida))
  return TEXTOS.erros.bloqueiaPayments;
 /* As exigências abaixo são de Capital. Antes valiam para todas as frentes, e
    com os funis novos isso travaria Governance na etapa 6 pedindo campos que
    a frente não tem. */
 if(d.frente==="capital"){
  const cm=d.comite||{};
  if(n>=6&&CINCO.some(([k])=>(d.cincoPerguntas||{})[k]==="NaoAvaliada"||!(d.cincoPerguntas||{})[k])) return TEXTOS.erros.cinco;
  if(n>=7&&!d.frenteCapital)return TEXTOS.erros.frenteCap;
  if(n>=4&&(!d.situacao||!d.segmento))return TEXTOS.erros.situacaoSegmento;
  if(n>=5&&!d.estrutura)return TEXTOS.erros.estruturaReq;
  if(n>=7&&(!cm.decisao||!cm.validadeAte))return TEXTOS.erros.comiteReq;
  if(n>=10&&!d.investidor)return TEXTOS.erros.investidorReq;
 }
 return null;
}
function moverEtapa(id,etapa,quem){
 const d=state.data.deals.find(x=>x.id===id);if(!d)return null;
 if(String(d.etapa)===String(etapa))return null;
 /* Sem ninguém logado não existe autor. Cair no responsável do negócio, como
    era antes, gravava que o Paulo moveu algo que o Paulo não moveu. */
 if(!quem&&!(state.usuario&&state.usuario.nome))return TEXTOS.erros.semUsuario;
 const e=validarEtapa(d,etapa);if(e)return e;
 snapshot();
 d.historico=d.historico||[];
 d.historico.push({de:etapaNome(d),para:etapaNome(d,etapa),quando:new Date().toISOString(),
  quem:quem||state.usuario.nome});
 d.etapa=etapa==="perdido"?"perdido":Number(etapa);
 /* Fechou quando alcançou a etapa de ganho da própria frente. */
 if(d.etapa!=="perdido"&&Number(d.etapa)>=corteDe(d).ganho){if(!d.fechadoEm)d.fechadoEm=agora();}
 else{d.fechadoEm=null;}
 d.atualizadoEm=agora();
 marcar();toast(TEXTOS.moveu);
 return null;
}

function boot(){

   if(o&&o.data&&o.data.deals){
    const emb=maisRecente(EMBEDDED),loc=o.salvoEm||maisRecente(o.data);
    if(!emb||loc>=emb){usar=o.data;dirty=!!o.dirty;}
   }}
 }catch(e){}
 state.data=JSON.parse(JSON.stringify(usar));
 state.dirty=dirty;
}
function maisRecente(d){let m="";(d.deals||[]).forEach(x=>{if(x.atualizadoEm>m)m=x.atualizadoEm;});return m;}

/* ====================== CONVERSA COM O SUPABASE ======================
   Sem servidor no meio: o painel fala direto com o banco. O token vive no
   próprio navegador e é renovado quando vence. */
const SESSAO_CHAVE="oren.sessao.v1";
function sessaoGuardada(){
 try{return JSON.parse(localStorage.getItem(SESSAO_CHAVE)||"null");}catch(e){return null;}
}
function guardarSessao(s){
 try{if(s)localStorage.setItem(SESSAO_CHAVE,JSON.stringify(s));else localStorage.removeItem(SESSAO_CHAVE);}catch(e){}
}
function cabecalhos(comToken,extras){
 const h={"apikey":SUPABASE_KEY,"content-type":"application/json"};
 const s=sessaoGuardada();
 if(comToken&&s&&s.access_token)h["Authorization"]="Bearer "+s.access_token;
 return Object.assign(h,extras||{});
}
async function renovarSessao(){
 const s=sessaoGuardada();
 if(!s||!s.refresh_token)return false;
 const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",
  {method:"POST",headers:cabecalhos(false),body:JSON.stringify({refresh_token:s.refresh_token})});
 if(!r.ok){guardarSessao(null);return false;}
 guardarSessao(await r.json());
 return true;
}
/* Toda chamada tenta uma vez; se o token venceu, renova e repete. */
async function sb(caminho,opcoes,jaRenovou){
 const o=Object.assign({},opcoes);
 const extras=o.extras;delete o.extras;
 const r=await fetch(SUPABASE_URL+caminho,Object.assign(o,{headers:cabecalhos(true,extras)}));
 if(r.status===401&&!jaRenovou&&await renovarSessao())return sb(caminho,opcoes,true);
 return r;
}
async function entrar(email,senha){

  {method:"POST",headers:cabecalhos(false),body:JSON.stringify({email:email,password:senha})});
 if(!r.ok){
  const e=await r.json().catch(()=>({}));
  throw new Error(/Invalid login/i.test(e.error_description||e.msg||"")?TEXTOS.erroLogin:(e.msg||e.error_description||TEXTOS.erroLogin));
 }
 guardarSessao(await r.json());

async function carregarDoServidor(semRender){

 if(r.status===401){mostrarLogin();return false;}

 state.data=linha.dados;state.versao=linha.versao;state.dirty=false;state.servidor=true;state.semRede=false;

/* Gravação direta, sem o atraso de salvarServidor. A migração precisa saber se
   gravou antes de seguir, e o debounce não devolve resposta. */
async function gravarAgora(){
 try{
  const r=await sb("/rest/v1/pipeline?id=eq.1&versao=eq."+encodeURIComponent(state.versao),
   {method:"PATCH",body:JSON.stringify({dados:state.data}),extras:{"Prefer":"return=representation"}});
  if(r.status===401){mostrarLogin();return false;}
  if(!r.ok)return false;
  const linhas=await r.json();
  if(!linhas.length){await carregarDoServidor(true);return false;}
  state.versao=linhas[0].versao;state.dirty=false;renderTopo();
  return true;
 }catch(e){state.semRede=true;renderTopo();return false;}
}
/* ---------------------------- MIGRAÇÃO ----------------------------
   Converte o formato antigo (funil único de dez etapas para as três frentes,
   sem campo de público) no schema 2. Roda uma vez: depois de gravado o
   schema, nunca mais. Converte em memória primeiro e só grava se quem está
   logado puder gravar. */
const MAPA_GOV={1:1,2:2,8:3,9:4};
function migrar(origem){
 const d=JSON.parse(JSON.stringify(origem||{}));
 d.partners=d.partners||[];d.customers=d.customers||[];d.deals=d.deals||[];
 const rel={antes:d.deals.length+d.customers.length+d.partners.length,
  depois:0,porEtapa:{},porFrente:{},porPublico:{},revisar:[]};
 d.deals.forEach(x=>{
  x.publico=publicoDe(x);
  if(x.mandatoAssinadoEm===undefined)x.mandatoAssinadoEm="";
  if(!x.checklist||typeof x.checklist!=="object")x.checklist={};
  if(!FUNIS[x.frente])x.frente="governance";
  if(x.etapa==="perdido")return;                       /* perdido é marca, preserva motivo */
  if(x.frente!=="governance")return;                   /* Capital e Payments ficam onde estão */
  const de=Number(x.etapa),para=MAPA_GOV[de];
  if(para){
   x.etapa=para;
   if(para===4&&!x.fechadoEm)x.fechadoEm=agora();
  }else{
   x.etapa=2;
   x.tags=Array.isArray(x.tags)?x.tags:[];
   if(x.tags.indexOf("revisar-migracao")<0)x.tags.push("revisar-migracao");
   rel.revisar.push(x.id+" (vinha da etapa "+de+")");
  }
 });
 /* Só deriva do tipo quando o cliente ainda não tem público definido: um
    B2B2C escolhido à mão não pode ser sobrescrito pela regra PF/PJ. */
 d.customers.forEach(c=>{
  c.publico=(PUBLICOS_VALIDOS.indexOf(c.publico)>=0)?c.publico:(c.tipo==="PF"?"B2C":"B2B");});
 d.partners.forEach(x=>{x.publico="B2B";});            /* parceiro é sempre B2B */
 d.schema=2;
 rel.depois=d.deals.length+d.customers.length+d.partners.length;
 d.deals.forEach(x=>{
  const k=String(x.etapa);
  rel.porEtapa[k]=(rel.porEtapa[k]||0)+1;
  rel.porFrente[x.frente]=(rel.porFrente[x.frente]||0)+1;
  rel.porPublico[x.publico]=(rel.porPublico[x.publico]||0)+1;
 });
 return {dados:d,rel:rel};
}
async function migrarSeNecessario(){
 for(let tentativa=1;tentativa<=3;tentativa++){
  if(!state.data||state.data.schema===2)return;
  const {dados,rel}=migrar(state.data);
  if(rel.antes!==rel.depois){
   console.error("Migração interrompida: "+rel.antes+" registros antes e "+rel.depois+" depois. Nada foi gravado.");
   return;
  }
  console.log("Migração para schema 2 — registros antes: "+rel.antes+" · depois: "+rel.depois+
   " (negócios: "+dados.deals.length+" · clientes: "+dados.customers.length+
   " · parceiros: "+dados.partners.length+")");
  console.log("Negócios por etapa:",rel.porEtapa);
  console.log("Negócios por frente:",rel.porFrente);
  console.log("Negócios por público:",rel.porPublico);
  if(rel.revisar.length)console.warn("Marcados como revisar-migracao:",rel.revisar);
  state.data=dados;
  if(state.usuario&&state.usuario.papel==="leitor"){
   console.log("Perfil somente leitura: dados convertidos apenas na tela, sem gravar.");
   return;
  }
  if(await gravarAgora()){console.log("Migração gravada.");return;}
  console.log("Conflito ao gravar a migração. Recarreguei do servidor e vou converter de novo (tentativa "+tentativa+" de 3).");
 }
 console.warn("Não consegui gravar a migração depois de três tentativas. Os dados na tela estão convertidos.");
}

function aplicarCargaAta(d){
 if(!d||!Array.isArray(d.deals)||!Array.isArray(d.customers))return null;
 const cli=CARGA_ATA.cliente,neg=CARGA_ATA.negocio;
 const jaCliente=d.customers.some(c=>c.id===cli.id);
 const jaNegocio=d.deals.some(x=>x.id===neg.id);
 if(!jaCliente)d.customers.push(JSON.parse(JSON.stringify(cli)));
 if(!jaNegocio)d.deals.push(JSON.parse(JSON.stringify(neg)));
 if(jaCliente&&jaNegocio){
  /* Normalização: o cliente fica só como "Gestora" (Fred é contato, não
     razão social) e a relação responde pelo Paulo. */
  const c=d.customers.find(x=>x.id===cli.id),e=d.deals.find(x=>x.id===neg.id);
  const antes=JSON.stringify([c.nome,c.notas,e.responsavel,e.notas]);
  c.nome=cli.nome;c.notas=cli.notas;e.responsavel=neg.responsavel;e.notas=neg.notas;
  if(JSON.stringify([c.nome,c.notas,e.responsavel,e.notas])===antes)return null;
  return "normalizou";
 }
 return "inseriu";
}

/* Grava com a versão em mãos. Se outra pessoa gravou antes, o banco não
   encontra a linha para atualizar e devolve lista vazia — é o sinal de
   conflito. Versão, data e autor são carimbados pelo próprio banco. */
function salvarServidor(){
 if(state.usuario&&state.usuario.papel==="leitor"){state.dirty=false;toast(TEXTOS.somenteLeitura,true);return;}
 clearTimeout(state.dbTimer);
 state.salvando=true;state.semRede=false;renderTopo();
 state.dbTimer=setTimeout(async()=>{
  try{
   const r=await sb("/rest/v1/pipeline?id=eq.1&versao=eq."+encodeURIComponent(state.versao),
    {method:"PATCH",body:JSON.stringify({dados:state.data}),
     extras:{"Prefer":"return=representation"}});
   if(r.status===401){state.salvando=false;mostrarLogin();return;}
   if(!r.ok)throw new Error("http "+r.status);
   const linhas=await r.json();
   if(!linhas.length){ // ninguém atualizado: versão velha ou acesso de leitura
    state.salvando=false;
    await carregarDoServidor();
    toast(TEXTOS.conflitoAviso,true);
    return;
   }
   state.versao=linhas[0].versao;state.dirty=false;state.salvando=false;renderTopo();
  }catch(e){state.salvando=false;state.semRede=true;renderTopo();}
 },800);
}

function faixa(p){
 const h=hoje(),y=h.getFullYear(),m=h.getMonth();
 if(p==="tudo")return null;
 if(p==="mes")return{de:new Date(y,m,1),ate:new Date(y,m+1,1),ant:{de:new Date(y,m-1,1),ate:new Date(y,m,1)}};
 if(p==="tri"){const q=Math.floor(m/3)*3;return{de:new Date(y,q,1),ate:new Date(y,q+3,1),ant:{de:new Date(y,q-3,1),ate:new Date(y,q,1)}};}
 return{de:new Date(y,0,1),ate:new Date(y+1,0,1),ant:{de:new Date(y-1,0,1),ate:new Date(y,0,1)}};
}
/* período: só a data de desfecho conta. criadoEm nunca entra nesse filtro. */
const iso=x=>[x.getFullYear(),String(x.getMonth()+1).padStart(2,"0"),String(x.getDate()).padStart(2,"0")].join("-");
const naFaixa=(data,f)=>!!data&&(!f||(data>=iso(f.de)&&data<iso(f.ate)));
function dataDesfecho(d){
 if(d.fechadoEm)return String(d.fechadoEm).slice(0,10);
 if(d.etapa==="perdido"){
  const h=(d.historico||[]).filter(x=>x.para==="Perdido").pop();
  return h?String(h.quando).slice(0,10):(d.atualizadoEm||null);
 }
 return null;
}
const noDesfecho=(d,f)=>naFaixa(dataDesfecho(d),f);
function textoBusca(d){
 const c=cliente(d.clienteId),p=parceiro(d.parceiroId);
 /* O codigo entra na busca: e como as pessoas se referem ao registro entre si
    ("o N-048"), e digitar isso nao achava nada. */
 return [d.id,d.titulo,d.proximoPasso,c&&c.id,c&&c.nome,p&&p.id,p&&p.nome,
  (d.pendencias||[]).map(x=>x.texto).join(" ")].filter(Boolean).join(" ").toLowerCase();
}
const achaConta=(o,q)=>!q||(o.nome+" "+o.id).toLowerCase().indexOf(q)>=0;
function negocios(){
 const q=state.filtros.busca.trim().toLowerCase();
 return state.data.deals.filter(d=>{
  if(state.filtros.frente&&d.frente!==state.filtros.frente)return false;
  if(state.filtros.responsavel&&d.responsavel!==state.filtros.responsavel)return false;
  if(state.filtros.tipoVenda&&d.tipoVenda!==state.filtros.tipoVenda)return false;
  if(state.publico&&publicoDe(d)!==state.publico)return false;
  if(q&&textoBusca(d).indexOf(q)<0)return false;
  return true;
 });
}
/* RÉGUA ÚNICA — todos os blocos usam estas três funções, sem interpretação
   própria. O corte agora vem de CORTE[frente], porque cada funil termina a
   venda numa etapa diferente:
     em aberto = etapas antes do ganho
     fechado   = a etapa de ganho e as de pós-venda
     perdido   = "perdido"
   Capital fecha em 9 e acompanha em 10. Governance fecha em 4 (Pagamento) e
   entrega de 5 a 7. Payments fecha em 6 (Ativação) e acompanha em 7. */
const emAberto=d=>d.etapa!=="perdido"&&Number(d.etapa)>=1&&Number(d.etapa)<corteDe(d).ganho;
const fechado=d=>d.etapa!=="perdido"&&Number(d.etapa)>=corteDe(d).ganho;
const perdido=d=>d.etapa==="perdido";
function kpis(lista){
 const ab=lista.filter(emAberto),fe=lista.filter(fechado),pe=lista.filter(perdido);
 const soma=a=>a.reduce((s,d)=>s+(Number(d.valor)||0),0);
 const conv=(fe.length+pe.length)?fe.length/(fe.length+pe.length)*100:null;
 return{aberto:soma(ab),ponderada:ab.reduce((s,d)=>s+(Number(d.valor)||0)*(Number(d.chance)||0)/100,0),
  fechado:soma(fe),conversao:conv,n:lista.length,
  nAberto:ab.length,nFechado:fe.length,nPerdido:pe.length};
}
function atencao(lista){
 const h=hoje(),out=[];
 lista.filter(emAberto).forEach(d=>{
  let m=null;
  if(d.prazo&&new Date(d.prazo)<h&&!fechado(d))m=TEXTOS.motivos.prazo;
  else if((d.pendencias||[]).some(p=>p.bloqueante&&!p.resolvida))m=TEXTOS.motivos.pend;
  else if(!d.proximoPasso||!String(d.proximoPasso).trim())m=TEXTOS.motivos.passo;
  else if(d.atualizadoEm&&dias(new Date(d.atualizadoEm),h)>30)m=TEXTOS.motivos.parado;
  if(m)out.push({d:d,motivo:m});
 });
 return out.sort((a,b)=>(Number(b.d.valor)||0)-(Number(a.d.valor)||0)).slice(0,15);
}

/* ---------------------------- AUDITORIA ----------------------------
   Roda sob demanda, no console: auditoria(). Só lê e imprime. Nenhuma
   correção automática, porque quase toda lacuna aqui precisa de decisão
   humana e um palpite gravado é pior que um campo vazio. */
function auditoria(){
 if(!state.data){console.warn("Sem dados carregados.");return[];}
 const d=state.data,achados=[];
 const add=(tipo,id,detalhe)=>achados.push({tipo:tipo,id:id,detalhe:detalhe});
 const dataOk=v=>!v||/^\d{4}-\d{2}-\d{2}$/.test(String(v).slice(0,10))&&!isNaN(new Date(String(v).slice(0,10)));
 const perfis={};RESPS.forEach(r=>perfis[r]=1);
 const hojeISO=agora();

 /* ids duplicados */
 [["deals",d.deals],["customers",d.customers],["partners",d.partners]].forEach(([nome,lista])=>{
  const visto={};
  (lista||[]).forEach(r=>{
   if(visto[r.id])add("id duplicado",r.id,"repetido em "+nome);
   visto[r.id]=1;
  });
 });

 (d.deals||[]).forEach(x=>{
  /* integridade referencial */
  if(x.clienteId&&!cliente(x.clienteId))add("cliente inexistente",x.id,"clienteId "+x.clienteId);
  if(x.parceiroId&&!parceiro(x.parceiroId))add("parceiro inexistente",x.id,"parceiroId "+x.parceiroId);
  if(!x.clienteId&&!x.parceiroId)add("negócio sem conta",x.id,"aparece pelo título, não por uma conta");
  if(x.tipoVenda==="direta"&&x.parceiroId)add("venda direta com parceiro",x.id,"parceiroId "+x.parceiroId);
  if(x.tipoVenda==="parceiro"&&!x.parceiroId)add("venda por parceiro sem parceiro",x.id,"");
  /* coerência de estado */
  const fr=frenteDe(x),f=FUNIS[fr],c=CORTE[fr];
  if(x.etapa!=="perdido"){
   const e=Number(x.etapa);
   if(!(e>=1&&e<=f.length))add("etapa fora do funil",x.id,"etapa "+x.etapa+" em "+fr+" (funil vai até "+f.length+")");
   if(e>=c.ganho&&!x.fechadoEm)add("fechado sem data",x.id,"etapa "+e+" já é ganho ou pós-venda");
   if(e<c.ganho&&x.fechadoEm)add("data de fechamento em negócio aberto",x.id,"fechadoEm "+x.fechadoEm);
  }else if(!x.motivoPerda||!String(x.motivoPerda).trim())add("perdido sem motivo",x.id,"");
  const ch=Number(x.chance);
  if(!(ch>=0&&ch<=100))add("chance fora de 0 a 100",x.id,String(x.chance));
  if(x.valor!==null&&x.valor!==undefined&&x.valor!==""){
   const v=Number(x.valor);
   if(isNaN(v))add("valor não numérico",x.id,String(x.valor));
   else if(v<0)add("valor negativo",x.id,String(v));
  }
  /* datas */
  ["prazo","criadoEm","atualizadoEm","fechadoEm","mandatoAssinadoEm"].forEach(k=>{
   if(x[k]&&!dataOk(x[k]))add("data inválida",x.id,k+" = "+x[k]);
  });
  if(x.criadoEm&&x.criadoEm>hojeISO)add("criado no futuro",x.id,x.criadoEm);
  if(x.criadoEm&&x.atualizadoEm&&x.atualizadoEm<x.criadoEm)add("atualizado antes de criado",x.id,x.atualizadoEm+" < "+x.criadoEm);
  /* pessoas */
  if(!x.responsavel||!perfis[x.responsavel])
   add("responsável fora da lista",x.id,String(x.responsavel)+" — o negócio desaparece de Por responsável e do filtro");
  /* histórico */
  let ant="";
  (x.historico||[]).forEach((h,i)=>{
   if(!h.quando||isNaN(new Date(h.quando)))add("histórico com data inválida",x.id,"evento "+i+": "+h.quando);
   else{
    if(ant&&String(h.quando)<ant)add("histórico fora de ordem",x.id,"evento "+i+": "+h.quando+" vem depois de "+ant);
    ant=String(h.quando);
   }
   if(h.quem&&!perfis[h.quem])add("autor do histórico sem perfil",x.id,'"'+h.quem+'" não corresponde a ninguém em RESPS');
  });
 });

 (d.customers||[]).concat(d.partners||[]).forEach(c=>{
  if(c.responsavel&&!perfis[c.responsavel])add("responsável fora da lista",c.id,String(c.responsavel));
  ["criadoEm","atualizadoEm"].forEach(k=>{if(c[k]&&!dataOk(c[k]))add("data inválida",c.id,k+" = "+c[k]);});
 });

 /* exibição: valor ausente não é zero */
 (d.deals||[]).forEach(x=>{
  if(x.valor===0||x.valor===null||x.valor===undefined||x.valor==="")
   add("valor não informado",x.id,"a tela mostra travessão, não R$ 0");
 });

 const porTipo={};achados.forEach(a=>{porTipo[a.tipo]=(porTipo[a.tipo]||0)+1;});
 console.log("=== Auditoria Oren ===");
 console.log("Negócios: "+(d.deals||[]).length+" · clientes: "+(d.customers||[]).length+
  " · parceiros: "+(d.partners||[]).length+" · schema: "+(d.schema||1));
 console.log("Achados: "+achados.length,porTipo);
 if(achados.length&&console.table)console.table(achados);
 else achados.forEach(a=>console.log(a.tipo+" · "+a.id+" · "+a.detalhe));
 console.log("Nada foi alterado. Corrija pelo painel ou peça a correção.");
 return achados;
}
window.auditoria=auditoria;

function barras(itens,total,porContagem){
 const base=porContagem?itens.reduce((a,i)=>a+(i.n||0),0):total;
 if(!itens.length||!base)return '<div class="empty">'+TEXTOS.vazio.grafico+"</div>";
 const cel=ehCel();
 const w=cel?320:560,lw=cel?0:140,rw=cel?0:(porContagem?230:200),bw=w-lw-rw,hb=cel?16:18,lin=cel?40:32;
 let s='<svg class="gsvg" viewBox="0 0 '+w+' '+(itens.length*lin)+'" width="100%" preserveAspectRatio="xMinYMin meet" role="img">';
 itens.forEach((it,i)=>{
  const medida=porContagem?(it.n||0):it.valor;
  const y=i*lin,len=Math.max(2,Math.round((medida/base)*bw));
  const vlr=porContagem
   ?it.n+(it.n===1?" negócio · ":" negócios · ")+(Number(it.valor)>0?brlV(it.valor):"valor a definir")
   :it.n+" · "+brlV(it.valor);
  if(cel){
   s+='<text x="0" y="'+(y+12)+'" font-size="12" fill="#4a564f">'+esc(it.nome)+"</text>";
   s+='<text x="'+w+'" y="'+(y+12)+'" text-anchor="end" font-size="12" fill="#1a1a1a">'+esc(vlr)+"</text>";
   s+='<rect x="0" y="'+(y+18)+'" width="'+len+'" height="'+hb+'" fill="'+(it.cor||"#0e5351")+'"></rect>';
  }else{
   s+='<text x="0" y="'+(y+18)+'" font-size="13" fill="#4a564f">'+esc(it.nome)+"</text>";
   s+='<rect x="'+lw+'" y="'+(y+6)+'" width="'+len+'" height="'+hb+'" fill="'+(it.cor||"#0e5351")+'"></rect>';
   s+='<text x="'+(lw+bw+8)+'" y="'+(y+18)+'" font-size="13" fill="#1a1a1a">'+esc(vlr)+"</text>";
  }
 });
 return s+"</svg>";
}
function rosca(itens){
 const tot=itens.reduce((s,i)=>s+i.valor,0);
 if(!tot)return '<div class="empty">'+TEXTOS.vazio.grafico+"</div>";
 const cx=90,cy=90,r=78,ri=48;let a=-Math.PI/2,s='<svg class="gsvg" viewBox="0 0 180 180" width="100%" role="img">';
 itens.forEach(it=>{
  if(!it.valor)return;
  const ang=it.valor/tot*Math.PI*2,b=a+ang;
  const p=(rr,t)=>[cx+rr*Math.cos(t),cy+rr*Math.sin(t)].map(v=>v.toFixed(2)).join(" ");
  const big=ang>Math.PI?1:0;
  s+='<path d="M '+p(r,a)+" A "+r+" "+r+" 0 "+big+" 1 "+p(r,b)+" L "+p(ri,b)+" A "+ri+" "+ri+" 0 "+big+" 0 "+p(ri,a)+' Z" fill="'+it.cor+'"></path>';
  a=b;
 });
 s+="</svg>";
 let lg='<div class="rowlist">';
 itens.forEach(it=>{lg+=itemLinha('<span class="dot" style="background:'+it.cor+'"></span>'+esc(it.nome),
  ['<span class="mut">'+esc(brlV(it.valor))+"</span>",
   '<span class="soft">'+(tot?Math.round(it.valor/tot*100):0)+"%</span>"]);});
 return '<div class="rosca">'+s+lg+"</div></div>";
}

function iconeHint(k,escuro){
 return '<button type="button" class="hint'+(escuro?" esc":"")+'" data-hint="'+k+
  '" aria-label="O que é isto" aria-expanded="false">?</button>';
}
function abrirHint(btn){
 const h=HINTS[btn.getAttribute("data-hint")];if(!h)return;
 fecharHint(false);
 const el=$("#hint");
 el.innerHTML='<div class="lbl">'+esc(h.t)+"</div><p>"+esc(h.a)+"</p>"+(h.b?"<p>"+esc(h.b)+"</p>":"")+
  '<button type="button" class="hintx" data-fechahint="1">Entendi</button>';
 el.className="on";el.removeAttribute("hidden");
 btn.setAttribute("aria-expanded","true");
 state.hintBtn=btn;
 posicionarHint(btn);
 el.querySelector(".hintx").focus();
}
function posicionarHint(btn){
 const el=$("#hint");
 if(ehCel()){el.style.left="";el.style.top="";return;}
 const r=btn.getBoundingClientRect();
 el.style.left=Math.max(8,Math.min(window.innerWidth-288,r.left-8))+"px";
 el.style.top=Math.max(8,Math.min(window.innerHeight-200,r.bottom+8))+"px";
}
function fecharHint(devolveFoco){
 const el=$("#hint");if(!el||el.className!=="on")return;
 el.className="";el.setAttribute("hidden","");el.innerHTML="";
 const b=state.hintBtn;state.hintBtn=null;
 if(b){b.setAttribute("aria-expanded","false");if(devolveFoco&&b.isConnected)b.focus();}
}

function render(){
 fecharHint(false);
 aplicarResponsaveis(state.data);   /* lista do Admin entra antes de qualquer select */
 renderTopo();renderNav();renderMenu();renderPubSeg();renderChips();
 const c=$("#content");
 if(state.tela==="painel")c.innerHTML=telaPainel();
 else if(state.tela==="negocios")c.innerHTML=telaNegocios();
 else c.innerHTML=telaContas();
 renderPainelLateral();renderImpressao();
}
function renderTopo(){
 $("#title").textContent=TEXTOS.nav[state.tela];
 const rotuloNovo=state.tela==="contas"
  ?(state.aba==="clientes"?TEXTOS.novoCliente:TEXTOS.novoParceiro):TEXTOS.novo;
 $("#btnnovo").textContent=rotuloNovo;
 $("#fab").title=rotuloNovo;
 $("#fab").setAttribute("aria-label",rotuloNovo);
 $("#busca").placeholder=TEXTOS.buscaPh;
 if($("#busca").value!==state.filtros.busca)$("#busca").value=state.filtros.busca;
 const s=$("#savedot");
 if(state.semRede){s.textContent=TEXTOS.semRede;s.className="no";}
 else if(state.salvando){s.textContent=TEXTOS.salvando;s.className="ok";}
 else{s.textContent=state.dirty?TEXTOS.naoSalvo:TEXTOS.salvo;s.className=state.dirty?"no":"ok";}
 const q=$("#quem");
 if(state.usuario)q.innerHTML="<b>"+esc(state.usuario.nome)+"</b>"+
  (state.usuario.papel==="leitor"?"<span>somente leitura</span>":"")+
  '<button data-senha="1">Trocar senha</button>'+
  '<button data-sair="1" style="margin-left:auto">'+TEXTOS.sair+"</button>";
 else q.innerHTML="";
}
function renderNav(){
 const telas=["painel","negocios","contas"];
 $("#nav").innerHTML=telas.map(k=>
  '<button data-tela="'+k+'" class="'+(state.tela===k?"on":"")+'">'+TEXTOS.nav[k]+"</button>").join("");
 $("#bnav").innerHTML=telas.map(k=>
  '<button data-tela="'+k+'" class="'+(state.tela===k?"on":"")+'"'+(state.tela===k?' aria-current="page"':"")+">"+
  ICONES[k]+"<span>"+TEXTOS.nav[k]+"</span></button>").join("");
}
function renderMenu(){
 /* No servidor os dados vivem no banco: salvar arquivo, importar, limpar e
    recomeçar sairiam por cima do trabalho de todo mundo. Sobram exportar
    (cópia de segurança) e imprimir. */
 const permitidos=state.servidor
  ?(state.usuario&&state.usuario.papel==="editor"?["importar","exportar","imprimir"]:["exportar","imprimir"])
  :Object.keys(TEXTOS.menu);
 const linha=esc_=>permitidos.map(k=>'<div class="menur"><button data-menu="'+k+'">'+
  TEXTOS.menu[k]+"</button>"+iconeHint("m_"+k,esc_)+"</div>").join("");
 $("#menu").innerHTML=linha(true);$("#menu2").innerHTML=linha(false);
}

   vale para as três telas. Em Contas ele filtra só a lista de clientes. */

   '<button data-pub="'+k+'" class="'+(state.publico===k?"on":"")+'">'+esc(PUBLICOS[k])+"</button>").join("")+"</div>";

function renderChips(){
 const f=state.filtros,ch=[];
 if(state.tela==="painel"){
  ch.push('<span class="soft" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase">'+
   esc(TEXTOS.periodoLbl)+iconeHint("periodo")+"</span>");
  ch.push('<div class="seg">'+Object.keys(TEXTOS.periodos).map(k=>
   '<button data-per="'+k+'" class="'+(f.periodo===k?"on":"")+'">'+TEXTOS.periodos[k]+"</button>").join("")+"</div>");
  ch.push('<span class="soft" style="font-size:11px">'+esc(TEXTOS.periodoAfeta)+"</span>");
 }
 ch.push(sel("frente",TEXTOS.col.frente,{"":"Todas as frentes",payments:"Payments",capital:"Capital",governance:"Governance"}));
 const rs={"":"Todos os responsáveis"};RESPS.forEach(r=>rs[r]=r);
 ch.push(sel("responsavel",TEXTOS.col.resp,rs));
 ch.push(sel("tipoVenda","Tipo de venda",{"":"Direta e por parceiro",direta:TEXTOS.tipoVenda.direta,parceiro:TEXTOS.tipoVenda.parceiro}));
 if(f.busca)ch.push('<span class="chip">Busca <b>'+esc(f.busca)+'</b><button data-limpa="busca">×</button></span>');
 $("#chips").innerHTML=ch.join("");
 function sel(k,lbl,ops){
  const v=f[k];
  return '<span class="chip">'+esc(lbl)+iconeHint("f_"+k)+' <select data-filtro="'+k+'">'+Object.keys(ops).map(o=>
   '<option value="'+o+'"'+(v===o?" selected":"")+">"+esc(ops[o])+"</option>").join("")+"</select>"+
   (v?'<button data-limpa="'+k+'">×</button>':"")+"</span>";
 }
}
function telaPainel(){
 const f=faixa(state.filtros.periodo),per=TEXTOS.periodos[state.filtros.periodo];
 const lista=negocios(),k=kpis(lista);
 const desfechados=ff=>lista.filter(d=>noDesfecho(d,ff));
 const kf=kpis(desfechados(f)),kfa=f?kpis(desfechados(f.ant)):null;
 /* Ticket de pessoa física é baixo: só o total em reais escondia o volume. */
 const qtd=(nn)=>(state.publico==="B2C"||state.publico==="B2B2C")?" · "+nn+(nn===1?" negócio":" negócios"):"";
 /* Soma zero com negócios dentro não é zero: é valor não cadastrado. Mostrar
    "R$ 0" aqui diria que nada foi fechado, quando foram oito. */
 const soma=(v,nn)=>(nn>0&&!v)?nn+(nn===1?" negócio":" negócios")+" · valor a definir":brlV(v)+qtd(nn);
 const cards=[
  ["aberto",soma(k.aberto,k.nAberto),null,null,TEXTOS.semPeriodo],
  ["ponderada",soma(k.ponderada,k.nAberto),null,null,TEXTOS.semPeriodo],
  ["fechado",soma(kf.fechado,kf.nFechado),kf.fechado,kfa&&kfa.fechado,TEXTOS.periodoLbl+": "+per],
  ["conversao",kf.conversao==null?"—":Math.round(kf.conversao)+"%",kf.conversao,kfa?kfa.conversao:null,TEXTOS.periodoLbl+": "+per]];
 let h='<div class="grid kpis">';
 cards.forEach(([id,txt,v,pv,nota])=>{
  let dl="";
  /* Com o período em "Tudo" não existe período anterior, então nem a frase
     "sem base de comparação" cabe: ela sugere dado faltando onde não falta. */
  if(v!=null&&f){
   dl='<span class="delta soft">'+TEXTOS.semBase+"</span>";
   if(pv!=null&&pv!==0){const p=Math.round((v-pv)/Math.abs(pv)*100);
    dl='<span class="delta '+(p>=0?"up":"down")+'">'+(p>=0?"▲ ":"▼ ")+Math.abs(p)+"% contra o período anterior</span>";}
   dl="<div>"+dl+"</div>";
  }
  h+='<div class="card kpi"><div class="lbl">'+TEXTOS.kpi[id]+iconeHint("kpi_"+id)+'</div><div class="num">'+esc(txt)+"</div>"+
   dl+'<div class="delta soft">'+esc(nota)+"</div></div>";
 });
 h+="</div>";
 /* Um funil por frente. Com o filtro de frente em "todas", os três aparecem
    empilhados: misturar etapas de funis diferentes numa barra só era o que
    fazia o quadro mentir sobre Governance e Payments. */
 const frentesFunil=state.filtros.frente?[state.filtros.frente]:["payments","capital","governance"];
 const funilH=frentesFunil.map(fr=>{
  const abertos=lista.filter(d=>frenteDe(d)===fr&&emAberto(d));
  const itens=FUNIS[fr].slice(0,CORTE[fr].ganho-1).map((nome,i)=>{
   const a=abertos.filter(d=>Number(d.etapa)===i+1);
   return{nome:(i+1)+" · "+nome,n:a.length,valor:a.reduce((s,d)=>s+(+d.valor||0),0),cor:CORF[fr]};
  }).filter(x=>x.n);
  return '<div class="fun"><div class="lbl" style="margin:0 0 8px"><span class="dot" style="background:'+
   CORF[fr]+'"></span>'+esc(TEXTOS.frentesLbl[fr])+"</div>"+
   barras(itens,itens.reduce((t,i)=>t+i.valor,0),true)+"</div>";
 }).join("");
 const porFrente=["payments","capital","governance"].map(fr=>{const a=lista.filter(d=>emAberto(d)&&d.frente===fr);
  return{nome:TEXTOS.frentesLbl[fr],valor:a.reduce((s,d)=>s+(+d.valor||0),0),cor:CORF[fr]};});
 h+='<div class="grid g2 w14 mt16">'+
  '<div class="card"><h2>'+TEXTOS.funil+iconeHint("funil")+"</h2>"+funilH+"</div>"+
  '<div class="card"><h2>'+TEXTOS.frentes+iconeHint("frentes")+"</h2>"+rosca(porFrente)+"</div></div>";
 const at=atencao(lista);
 let ah=at.length?'<div class="rowlist">'+at.map(x=>itemLinha(esc(nomeNegocio(x.d)),
  ['<span class="mut">'+esc(brlD(x.d.valor))+"</span>",
   '<span class="'+(x.motivo===TEXTOS.motivos.parado?"soft":"late")+'">'+esc(x.motivo)+"</span>"],
  ' data-abre="'+x.d.id+'" style="cursor:pointer"')).join("")+"</div>"
  :'<div class="empty">'+TEXTOS.vazio.atencao+"</div>";
 /* Nomes fora da lista do Admin, mas com negócio aberto, entram no fim: some
    do gráfico é pior que aparecer com a marca de fora da lista. */
 const nomesResp=RESPS.slice();
 lista.forEach(d=>{if(emAberto(d)&&d.responsavel&&nomesResp.indexOf(d.responsavel)<0)nomesResp.push(d.responsavel);});
 const porResp=nomesResp.map(r=>{const a=lista.filter(d=>emAberto(d)&&d.responsavel===r);
  return{nome:r+(RESPS.indexOf(r)<0?" (fora da lista)":""),n:a.length,
   valor:a.reduce((s,d)=>s+(+d.valor||0),0),cor:"#1da688"};}).filter(x=>x.n);
 const totR=porResp.reduce((s,i)=>s+i.valor,0);
 h+='<div class="grid g2 mt16">'+
  '<div class="card"><h2>'+TEXTOS.atencao+iconeHint("atencao")+"</h2>"+ah+"</div>"+
  '<div class="card"><h2>'+TEXTOS.porResp+iconeHint("porResp")+"</h2>"+barras(porResp,totR,true)+"</div></div>";
 const ev=[];lista.forEach(d=>(d.historico||[]).forEach(x=>{
  if(naFaixa(String(x.quando).slice(0,10),f))ev.push({d:d,x:x});}));
 ev.sort((a,b)=>String(b.x.quando).localeCompare(String(a.x.quando)));
 /* Dois nomes diferentes na mesma linha: quem moveu a etapa e quem responde
    pelo negócio. Sem rótulo, o leitor confundia um com o outro. */
 const evh=ev.length?'<div class="rowlist">'+ev.slice(0,10).map(e=>itemLinha(esc(nomeNegocio(e.d)),
  ['<span class="mut">'+esc(e.x.de+" → "+e.x.para)+"</span>",
   '<span class="soft">Movido por '+esc(e.x.quem||"—")+"</span>",
   '<span class="soft">Responsável: '+esc(e.d.responsavel||"—")+"</span>",
   '<span class="soft">'+dt(e.x.quando)+"</span>"],
  ' data-abre="'+e.d.id+'" style="cursor:pointer"')).join("")+"</div>"
  :'<div class="empty">'+TEXTOS.vazio.hist+"</div>";
 h+='<div class="card mt16"><h2>'+TEXTOS.recente+iconeHint("recente")+'</h2><div class="delta soft" style="margin:-8px 0 12px">'+
  esc(TEXTOS.periodoLbl+": "+per)+"</div>"+evh+"</div>";
 return h;
}
function telaNegocios(){
 const lista=negocios();
 let h='<div class="tbar">'+
  '<div class="seg"><button data-vista="quadro" class="'+(state.vista==="quadro"?"on":"")+'">'+TEXTOS.quadro+"</button>"+
  '<button data-vista="lista" class="'+(state.vista==="lista"?"on":"")+'">'+TEXTOS.lista+"</button></div>"+
  iconeHint("vista")+iconeHint("fases")+(state.vista==="quadro"?iconeHint("arrastar"):"")+
  '<span class="soft">'+lista.filter(d=>d.etapa!=="perdido").length+" negócios"+
  (state.publico?" · "+PUBLICOS[state.publico]:"")+" · "+
  brlV(lista.filter(d=>d.etapa!=="perdido").reduce((s,d)=>s+(+d.valor||0),0))+"</span>"+
  '<button data-perdidos="1" class="lnk">'+
  (state.perdidos?TEXTOS.voltarQuadro:TEXTOS.verPerdidos+" ("+lista.filter(d=>d.etapa==="perdido").length+")")+"</button>"+
  iconeHint("perdidos")+"</div>";
 if(state.perdidos)return h+tabela(lista.filter(d=>d.etapa==="perdido"));
 if(state.vista==="lista")return h+tabela(lista.filter(d=>d.etapa!=="perdido"));
 /* Um quadro por frente, porque as colunas são as etapas e cada frente tem
    as suas. Com uma frente escolhida no filtro, aparece só ela. */
 const frs=state.filtros.frente?[state.filtros.frente]:["payments","capital","governance"];
 const vivos=lista.filter(d=>d.etapa!=="perdido");
 if(!vivos.length)return h+'<div class="card"><div class="empty" style="border:0">'+
  esc(state.publico?TEXTOS.vazio.publico:TEXTOS.vazio.lista)+"</div></div>";
 frs.forEach(fr=>{
  const daFrente=vivos.filter(d=>frenteDe(d)===fr);
  /* Sem o filtro de frente, frente sem negócio nenhum não vira uma faixa de
     colunas vazias: o funil do Painel já diz que ela está vazia. */
  if(!daFrente.length&&!state.filtros.frente)return;
  h+='<div class="bwrap"><div class="lbl bh"><span class="dot" style="background:'+CORF[fr]+'"></span>'+
   esc(TEXTOS.frentesLbl[fr])+'<span class="soft">'+daFrente.length+" · "+
   brlC(daFrente.reduce((t,d)=>t+(+d.valor||0),0))+"</span></div>"+
   '<div class="board">'+FUNIS[fr].map((nome,i)=>{
    const et=i+1,ds=daFrente.filter(d=>Number(d.etapa)===et).sort((a,b)=>(+b.valor||0)-(+a.valor||0));
    return '<div class="col" data-etapa="'+et+'" data-frente="'+fr+'"><div class="colh">'+
     '<div class="n">'+et+" · "+esc(nome)+"</div>"+
     '<div class="m">'+ds.length+" · "+brlC(ds.reduce((t,d)=>t+(+d.valor||0),0))+"</div></div>"+
     '<div class="cards">'+ds.map(cardHTML).join("")+"</div></div>";
   }).join("")+"</div></div>";
 });

 h+='<h2 style="font-size:15px;font-weight:500;margin:24px 0 8px">Negócios desta conta</h2>';

function setCampo(kind,id,campo,valor){
 let alvo=null;
 if(kind==="deal")alvo=state.data.deals.find(x=>x.id===id);
 else if(kind==="cliente")alvo=cliente(id);
 else if(kind==="parceiro")alvo=parceiro(id);
 if(kind==="cinco"){const d=state.data.deals.find(x=>x.id===id);d.cincoPerguntas[campo]=valor;d.atualizadoEm=agora();marcar();return;}
 if(kind==="seisnota"||kind==="seisobs"){
  const d=state.data.deals.find(x=>x.id===id);d.seisCamadas=d.seisCamadas||{};
  d.seisCamadas[campo]=d.seisCamadas[campo]||{nota:0,obs:""};
  if(kind==="seisnota")d.seisCamadas[campo].nota=Math.max(0,Math.min(5,Number(valor)||0));
  else d.seisCamadas[campo].obs=valor;
  d.atualizadoEm=agora();marcar();return;
 }
 if(kind==="territorio"||kind==="territorioobs"){
  const d=state.data.deals.find(x=>x.id===id);d.territorio=d.territorio||novoTerritorio();
  d.territorio[campo]=d.territorio[campo]||{status:"NaoAvaliada",obs:""};
  if(kind==="territorio")d.territorio[campo].status=valor;else d.territorio[campo].obs=valor;
  d.atualizadoEm=agora();marcar();return;
 }
 if(kind==="pend"){
  const [did,pid]=id.split("|");
  const d=state.data.deals.find(x=>x.id===did);if(!d)return;
  const pd=(d.pendencias||[]).find(x=>x.id===pid);if(!pd)return;
  snapshot();pd[campo]=valor;d.atualizadoEm=agora();marcar();return;
 }
 if(kind==="papeis"){
  const d=state.data.deals.find(x=>x.id===id);d.papeis=d.papeis||novoPapeis();
  d.papeis[campo]=valor;d.atualizadoEm=agora();marcar();return;
 }
 if(kind==="comite"){
  const d=state.data.deals.find(x=>x.id===id);d.comite=d.comite||novoComite();
  d.comite[campo]=valor;d.atualizadoEm=agora();marcar();return;
 }
 if(!alvo)return;
 /* Venda direta nao pode ter parceiro: sem isto a troca de tipo deixa o
    negocio num estado que validarEtapa recusa, sem explicar por que. */
 if(kind==="deal"&&campo==="tipoVenda"&&valor==="direta")alvo.parceiroId=null;
 if(["valor","chance","receitaRecorrente","potencial"].indexOf(campo)>=0){
  let v=Number(String(valor).replace(/[^\d,-]/g,"").replace(",","."))||0;
  if(campo==="chance")v=Math.max(0,Math.min(100,v));
  alvo[campo]=v;
 }else alvo[campo]=valor;
 alvo.atualizadoEm=agora();
 marcar();
}
function startEdit(el){
 const [kind,id,campo]=el.getAttribute("data-edit").split(":");
 const tipo=el.getAttribute("data-tipo"),raw=el.getAttribute("data-raw");
 const ops=el.getAttribute("data-ops")?JSON.parse(el.getAttribute("data-ops")):null;
 let inp;
 if(ops){inp=document.createElement("select");
  Object.keys(ops).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=ops[k];if(k===raw)o.selected=true;inp.appendChild(o);});}
 else if(tipo==="textarea"){inp=document.createElement("textarea");inp.rows=4;inp.value=raw;}
 else{inp=document.createElement("input");inp.type=tipo==="date"?"date":"text";
  inp.value=tipo==="money"?String(Number(raw)||0):raw;}
 el.textContent="";el.appendChild(inp);inp.focus();
 if(inp.select)inp.select();
 let fim=false;
 const commit=()=>{if(fim)return;fim=true;setCampo(kind,id,campo,inp.value);};
 inp.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&tipo!=="textarea"){e.preventDefault();commit();}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();fim=true;render();}
  else if(e.key==="Tab"){commit();}
 });
 inp.addEventListener("change",()=>{if(ops||tipo==="date")commit();});
 inp.addEventListener("blur",commit);
}
document.addEventListener("click",e=>{
 const t=e.target;
 const g=s=>t.closest(s);
 let el;
 const hb=t.closest("[data-hint]");
 if(hb){if(state.hintBtn===hb)fecharHint(true);else abrirHint(hb);return;}
 if(t.closest("#hint")){if(t.closest("[data-fechahint]"))fecharHint(true);return;}
 if(state.hintBtn)fecharHint(false);
 if(el=g("[data-tela]")){state.tela=el.dataset.tela;state.perdidos=false;state.painel=null;render();return;}
 if(el=g("[data-sair]")){sair();return;}
 if(el=g("[data-senha]")){abrirTrocaSenha();return;}
 if(el=g("[data-menu]")){menuAcao(el.dataset.menu);return;}
 if(el=g("[data-per]")){state.filtros.periodo=el.dataset.per;render();return;}
 if(el=g("[data-limpa]")){state.filtros[el.dataset.limpa]="";render();return;}
 if(el=g("[data-vista]")){state.vista=el.dataset.vista;state.perdidos=false;render();return;}
 if(el=g("[data-perdidos]")){state.perdidos=!state.perdidos;render();return;}
 if(el=g("[data-aba]")){state.aba=el.dataset.aba;render();return;}
 if(el=g("[data-ord]")){const c=el.dataset.ord;
  if(state.ord.campo===c)state.ord.dir*=-1;else state.ord={campo:c,dir:1};render();return;}
 if(el=g("[data-sec]")){state.secoes[el.dataset.sec]=!state.secoes[el.dataset.sec];renderPainelLateral();return;}
 if(el=g("[data-pub]")){state.publico=el.dataset.pub;render();return;}
 if(el=g("[data-fechar]")){state.erroCard=null;fecharPainel();return;}
 if(el=g("[data-mover]")){const [id,et]=el.dataset.mover.split(":");
  if(et==="perdido"&&!pedirMotivo(id)){render();return;}
  const err=moverEtapa(id,et);state.erroCard=err?{id:id,msg:err}:null;if(err)render();return;}
 if(el=g("[data-novaconta]")){criarConta(el.dataset.novaconta);return;}
 if(el=g("[data-bloq]")){
  const [did,pid]=el.dataset.bloq.split("|");
  const d=state.data.deals.find(x=>x.id===did);if(!d)return;
  const pd=(d.pendencias||[]).find(x=>x.id===pid);if(!pd)return;
  snapshot();pd.bloqueante=!pd.bloqueante;d.atualizadoEm=agora();marcar();return;}
 if(el=g("[data-delpend]")){
  const [did,pid]=el.dataset.delpend.split("|");
  const d=state.data.deals.find(x=>x.id===did);if(!d)return;
  const pd=(d.pendencias||[]).find(x=>x.id===pid);if(!pd)return;
  if(!confirm("Excluir esta pendência? "+TEXTOS.confirmaExcluir.split("? ")[1]))return;
  snapshot();d.pendencias=d.pendencias.filter(x=>x.id!==pid);d.atualizadoEm=agora();
  marcar();toast("Pendência excluída.");return;}
 if(el=g("[data-novapend]")){
  const d=state.data.deals.find(x=>x.id===el.dataset.novapend);
  snapshot();d.pendencias=d.pendencias||[];
  d.pendencias.push({id:uid("PD"),texto:"",responsavel:d.responsavel,prazo:agora(),bloqueante:false,resolvida:false});
  d.atualizadoEm=agora();marcar();return;}
 if(el=g("[data-excluir]")){
  const id=el.dataset.excluir;
  if(!confirm(TEXTOS.confirmaExcluir))return;
  snapshot();state.data.deals=state.data.deals.filter(x=>x.id!==id);
  state.painel=null;marcar();toast(TEXTOS.excluiu);return;}
 if(el=g("[data-criar]")){criar();return;}
 if(el=g("[data-conta]")){const [k,id]=el.dataset.conta.split(":");abrirPainel({tipo:"conta",kind:k,id:id});return;}
 if(el=g("[data-abre]")){abrirPainel({tipo:"deal",id:el.dataset.abre});return;}
 if(el=g(".dc")&&!t.closest("select")){abrirPainel({tipo:"deal",id:g(".dc").dataset.id});return;}
 if(t.id==="shade"){fecharPainel();return;}
 /* Na tela Contas o botao grande cria conta. Antes criava negocio em qualquer
    tela, e nao havia caminho obvio para cadastrar cliente ou parceiro. */
 if(t.closest("#btnnovo,#fab")){
  if(state.tela==="contas")criarConta(state.aba==="clientes"?"cliente":"parceiro");
  else novoNegocio();
  return;}
 if(t.id==="toastundo"){desfazer();return;}
 const edt=t.closest("[data-edit]");
 if(edt&&!edt.querySelector("input,select,textarea"))startEdit(edt);
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.matches("[data-filtro]")){state.filtros[t.dataset.filtro]=t.value;render();return;}
 if(t.matches("[data-etapa]")){
  if(t.value==="perdido"&&!pedirMotivo(t.dataset.etapa)){render();return;}
  const err=moverEtapa(t.dataset.etapa,t.value);
  state.erroCard=err?{id:t.dataset.etapa,msg:err}:null;render();return;}
 if(t.matches("[data-pend]")){
  const [id,pid]=t.dataset.pend.split(":");
  const d=state.data.deals.find(x=>x.id===id),p=d.pendencias.find(x=>x.id===pid);
  snapshot();p.resolvida=t.checked;d.atualizadoEm=agora();marcar();return;}
 /* Marcar salva na hora, como as pendências. */
 if(t.matches("[data-check]")){
  const [id,chave]=t.dataset.check.split(":");
  const d=state.data.deals.find(x=>x.id===id);if(!d)return;
  snapshot();d.checklist=d.checklist||{};d.checklist[chave]=t.checked;
  d.atualizadoEm=agora();marcar();return;}
 if(t.matches("[data-novo]")){
  state.novo[t.dataset.novo]=t.value;
  if(t.dataset.novo==="publico")state.novo.publicoManual=true;
  /* Trocar o cliente atualiza a sugestão, desde que ninguém tenha mexido
     no campo à mão. */
  if(t.dataset.novo==="clienteId"&&!state.novo.publicoManual){
   const c=cliente(t.value);
   if(t.value!==CLIENTE_NOVO)state.novo.publico=(c&&c.tipo==="PF")?"B2C":"B2B";
   else state.novo.publico=state.novo.clienteNovoTipo==="PF"?"B2C":"B2B";
  }
  if(t.dataset.novo==="clienteNovoTipo"&&!state.novo.publicoManual)
   state.novo.publico=t.value==="PF"?"B2C":"B2B";
  if(["tipoVenda","frente","clienteId","clienteNovoTipo"].indexOf(t.dataset.novo)>=0)renderPainelLateral();return;}
});

document.addEventListener("dragstart",e=>{

document.addEventListener("drop",e=>{
 const col=e.target.closest(".col");if(!col)return;
 e.preventDefault();col.classList.remove("over");
 const id=e.dataTransfer.getData("text/plain");
 /* Cada quadro é de uma frente. Arrastar para o quadro de outra frente não
    faz sentido: o número da etapa lá quer dizer outra coisa. */
 const d=state.data.deals.find(x=>x.id===id);
 if(!d||frenteDe(d)!==col.dataset.frente)return;
 const err=moverEtapa(id,Number(col.dataset.etapa));
 state.erroCard=err?{id:id,msg:err}:null;render();
});

  else if(state.hintBtn)posicionarHint(state.hintBtn);},150);
});
window.addEventListener("scroll",()=>{if(state.hintBtn)posicionarHint(state.hintBtn);},true);
$("#hint").addEventListener("keydown",e=>{
 if(e.key==="Tab"){e.preventDefault();const b=$("#hint").querySelector("button");if(b)b.focus();}
 else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();fecharHint(true);}
});
function novoNegocio(){
 state.novo={titulo:"",tipoVenda:"direta",clienteId:"",parceiroId:"",frente:"payments",tese:"",
  clienteNovoNome:"",clienteNovoTipo:"PJ",
  publico:"B2B",publicoManual:false,
  valor:"",responsavel:RESPS[0],proximoPasso:"",prazo:agora(),chance:"50",erros:null};
 abrirPainel({tipo:"novo"});
}
function criar(){
 const n=state.novo,er={};
 if(!n.titulo.trim())er.titulo=TEXTOS.erros.titulo;
 /* Valor vazio e um estado legitimo: o negocio entra com a marca de valor a
    definir, como os credenciamentos que ja estao na base. Numero invalido
    continua sendo erro. */
 const valorLimpo=String(n.valor).replace(/\D/g,"");
 if(String(n.valor).trim()&&!valorLimpo)er.valor=TEXTOS.erros.valor;
 if(n.tipoVenda==="direta"&&!n.clienteId)er.clienteId=TEXTOS.erros.cliente;
 if(n.clienteId===CLIENTE_NOVO&&!n.clienteNovoNome.trim())er.clienteNovoNome=TEXTOS.erros.clienteNovo;
 if(n.tipoVenda==="parceiro"&&!n.parceiroId)er.parceiroId=TEXTOS.erros.parceiro;
 if(n.frente==="capital"&&!n.tese.trim())er.tese=TEXTOS.erros.tese;
 if(Object.keys(er).length){n.erros=er;renderPainelLateral();return;}
 snapshot();
 /* Cliente novo nasce com o mínimo que o formulário sabe. O que ele não sabe
    fica vazio: campo em branco é informação, palpite não é. */
 let clienteId=n.clienteId;
 if(clienteId===CLIENTE_NOVO){
  const c={id:uid("C"),nome:n.clienteNovoNome.trim(),tipo:n.clienteNovoTipo,
   publico:n.clienteNovoTipo==="PF"?"B2C":"B2B",responsavel:n.responsavel,
   frente:n.frente,tier:"",status:"",porte:"",setor:"",uf:"",notas:"",
   receitaRecorrente:0,parceiroId:n.tipoVenda==="parceiro"?n.parceiroId:null,
   exemplo:false,criadoEm:agora(),atualizadoEm:agora()};
  state.data.customers.push(c);clienteId=c.id;
 }
 state.data.deals.push({id:uid("N"),titulo:n.titulo.trim(),frente:n.frente,tipoVenda:n.tipoVenda,
  parceiroId:n.tipoVenda==="parceiro"?n.parceiroId:null,clienteId:clienteId||null,responsavel:n.responsavel,
  valor:valorLimpo?Number(valorLimpo):"",etapa:1,proximoPasso:n.proximoPasso,prazo:n.prazo,
  publico:publicoDe(n),mandatoAssinadoEm:"",checklist:{},
  chance:Math.max(0,Math.min(100,Number(n.chance)||0)),pendencias:[],tese:n.tese||"",estrutura:"",frenteCapital:"",
  investidor:"",statusCaptacao:"",cincoPerguntas:{pagamento:"NaoAvaliada",contrato:"NaoAvaliada",garantias:"NaoAvaliada",valorImovel:"NaoAvaliada",usoAlternativo:"NaoAvaliada"},
  seisCamadas:{qualidadeEmpresa:{nota:0,obs:""},contratoLongoPrazo:{nota:0,obs:""},garantias:{nota:0,obs:""},valorImovel:{nota:0,obs:""},trocaOcupante:{nota:0,obs:""},usoAlternativo:{nota:0,obs:""}},
  tags:valorLimpo?[]:[TAG_VALOR],situacao:"",segmento:"",origem:"",ufs:"",papeis:novoPapeis(),territorio:novoTerritorio(),comite:novoComite(),
  motivoPerda:"",notas:"",exemplo:false,criadoEm:agora(),atualizadoEm:agora(),fechadoEm:null,
  historico:[{de:"—",para:FUNIS[FUNIS[n.frente]?n.frente:"governance"][0],
   quando:new Date().toISOString(),quem:(state.usuario&&state.usuario.nome)||n.responsavel}]});
 state.painel=null;marcar();
}
/* Mesmo conjunto de campos dos registros que ja existem no dataset. Um campo
   a menos aqui e um campo que desaparece na primeira gravacao. */
function criarConta(kind){
 snapshot();
 const base={id:uid(kind==="cliente"?"C":"P"),nome:kind==="cliente"?"Novo cliente":"Novo parceiro",
  responsavel:RESPS[0],tier:"",status:"",porte:"",setor:"",notas:"",
  exemplo:false,criadoEm:agora(),atualizadoEm:agora()};
 if(kind==="cliente"){
  const o=Object.assign(base,{tipo:"PJ",frente:"capital",uf:"",receitaRecorrente:0,parceiroId:null});
  state.data.customers.push(o);state.aba="clientes";state.painel={tipo:"conta",kind:"cliente",id:o.id};
 }else{
  const o=Object.assign(base,{frentes:[],potencial:"",contato:""});
  state.data.partners.push(o);state.aba="parceiros";state.painel={tipo:"conta",kind:"parceiro",id:o.id};
 }
 marcar();
}
/* Perdido exige motivo. Sem pedir aqui, a etapa fica inalcancavel. */
function pedirMotivo(id){
 const d=state.data.deals.find(x=>x.id===id);
 if(!d||d.motivoPerda)return true;
 const m=prompt("Por que este negócio foi perdido?","");
 if(m==null||!m.trim())return false;
 d.motivoPerda=m.trim();d.atualizadoEm=agora();
 return true;
}
function menuAcao(k){
 if(k==="salvar")salvarArquivo();
 else if(k==="exportar")exportarJSON();
 else if(k==="importar")$("#fileimp").click();
 else if(k==="imprimir")window.print();
 else if(k==="limpar"){
  if(!confirm("Remover todos os registros marcados como exemplo?"))return;
  snapshot();
  state.data.deals=state.data.deals.filter(d=>!d.exemplo);
  state.data.customers=state.data.customers.filter(c=>!c.exemplo);
  state.data.partners=state.data.partners.filter(p=>!p.exemplo);
  state.painel=null;marcar();toast("Dados de exemplo removidos.");
 }else if(k==="recomecar"){
  /* No servidor o dataset embutido está vazio de propósito: recomeçar gravaria
     essa base vazia por cima do trabalho de todo mundo. O menu já esconde o
     item nesse modo; isto é a tranca de dentro. */
  if(state.servidor){toast("Recomeçar não existe no modo servidor.",true);return;}
  if(!confirm("Recomeçar apaga tudo o que foi editado e volta aos dados originais do arquivo. Continuar?"))return;
  snapshot();state.data=JSON.parse(JSON.stringify(EMBEDDED));state.painel=null;marcar();toast("Dados originais recarregados.");
 }
}
$("#fileimp").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{importarJSON(r.result);e.target.value="";};r.readAsText(f);
});
/* Descobre em que mundo estamos: servidor com sessão, servidor pedindo login,
   ou arquivo aberto direto do computador (aí segue exatamente como antes). */
(async function iniciar(){
 state.servidor=true;
 state.data={partners:[],customers:[],deals:[]};
 const daUrl=sessaoDaUrl();
 if(daUrl&&await completarSessao(daUrl.sessao)&&await carregarPerfil()){
  render();
  if(daUrl.recuperacao||state.usuario.senhaProvisoria){exigirTroca();return;}
  if(await carregarEMigrar())return;
 }
 if(sessaoGuardada()&&await carregarPerfil()){
  if(state.usuario.senhaProvisoria){render();exigirTroca();return;}
  if(await carregarEMigrar())return;
 }
 render();mostrarLogin();
})();
$("#senhaform").addEventListener("submit",async e=>{
 e.preventDefault();
 const b=$("#sbtn"),err=$("#serro");
 b.disabled=true;b.textContent="Salvando…";err.className="erro";
 try{
  await trocarSenha($("#snova").value);
  if(state.trocaObrigatoria){
   await senhaTrocada();
   state.trocaObrigatoria=false;
   fecharTrocaSenha();
   await carregarDoServidor();
   toast("Senha definida. Bem-vindo.",true);
  }else{fecharTrocaSenha();toast("Senha alterada.",true);}
 }catch(x){err.textContent=x.message;err.className="erro on";}
 finally{b.disabled=false;b.textContent="Salvar nova senha";}
});
$("#scancel").addEventListener("click",fecharTrocaSenha);
$("#lesqueci").addEventListener("click",async()=>{
 const err=$("#lerro"),email=$("#lemail").value.trim();
 if(!email){err.textContent="Escreva seu e-mail primeiro.";err.className="erro on";return;}
 try{await pedirRecuperacao(email);err.textContent="Enviei um link para "+email+".";err.className="erro on";
  err.style.color="var(--pos)";}
 catch(x){err.textContent=x.message;err.className="erro on";err.style.color="";}
});
/* Limpa a mensagem de erro assim que a pessoa começa a corrigir. */
["#snova"].forEach(id=>$(id).addEventListener("input",()=>{$("#serro").className="erro";}));
["#lemail","#lsenha"].forEach(id=>$(id).addEventListener("input",()=>{$("#lerro").className="erro";}));
$("#loginform").addEventListener("submit",async e=>{
 e.preventDefault();
 const b=$("#lbtn"),err=$("#lerro");
 b.disabled=true;b.textContent=TEXTOS.entrando;err.className="erro";
 try{await entrar($("#lemail").value,$("#lsenha").value);$("#lsenha").value="";}
 catch(x){err.textContent=x.message;err.className="erro on";}
 finally{b.disabled=false;b.textContent="Entrar";}
});
</script>
