<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Oren · Painel comercial</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23092d29'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='8.5'%20fill='none'%20stroke='%23affa57'%20stroke-width='4'/%3E%3C/svg%3E">
<meta name="theme-color" content="#092d29">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script id="oren-dataset" type="application/json">{"partners":[],"customers":[],"deals":[]}</script>
<style>
/* ================= BASE (mobile first — 360px) =================
   Sistema visual revisto com a gramática das ferramentas de trabalho
   modernas — Linear como referência: densidade alta, fio de cabelo em vez de
   moldura, cinza com hierarquia em vez de caixa dentro de caixa, movimento
   curto, e o verde da marca reservado para o que é ação ou estado. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
--deep:#092d29;--mid:#0e5351;--luz:#affa57;--creme:#e8f3e8;
--capital:#62cc6d;--governance:#1da688;--payments:#affa57;
--bg:#f7f8f7;--surf:#fff;--alt:#f2f4f2;--bd:#ecefec;--bdf:#dde2dd;
--tx:#16211d;--tx2:#5b6660;--tx3:#8a938e;--neg:#b00020;--pos:#1a6e3a;
--crit:#b00020;--warn:#a06400;--ok:#1a6e3a;--neutro:#b9c2bb;
--r:6px;--r2:10px;--sh1:0 1px 2px rgba(9,45,41,.05);
--sh2:0 4px 16px rgba(9,45,41,.10);--sh3:0 16px 48px rgba(9,45,41,.18);
--fast:120ms;--nav:56px;--safe:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
font-size:13px;font-weight:400;line-height:1.45;color:var(--tx);background:var(--bg);
font-variant-numeric:tabular-nums;display:flex;min-width:0;
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg{max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit;border-radius:var(--r);max-width:100%}
/* Botão neutro: fundo suave em vez de moldura. Moldura em tudo era o que dava
   o aspecto de formulário antigo. */
button{cursor:pointer;background:var(--alt);border:1px solid transparent;padding:8px 12px;
min-height:44px;color:var(--tx2);font-weight:500;transition:background var(--fast) ease-out,
color var(--fast) ease-out,border-color var(--fast) ease-out}
button:hover{background:#e6eae6;color:var(--tx)}
select,textarea,input:not([type=checkbox]){min-height:44px;padding:8px 10px;min-width:0;
background:var(--surf);border:1px solid var(--bdf);transition:border-color var(--fast) ease-out}
select:hover,input:not([type=checkbox]):hover{border-color:#c9d0c9}
:focus-visible{outline:2px solid var(--mid);outline-offset:1px}
a{color:var(--mid);text-decoration:none}
a:hover{color:var(--deep);text-decoration:underline}
.lbl{font-size:11px;letter-spacing:.1em;color:var(--tx3);text-transform:uppercase;font-weight:500}
/* Algarismo proporcional no número grande: tabular deixa "121" solto nesse
   corpo. Tabular fica para coluna de tabela, onde precisa alinhar. */
.num{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.1;
font-variant-numeric:proportional-nums;overflow-wrap:anywhere}
.uni{font-size:13px;font-weight:500;color:var(--tx2)}
.qual{font-size:12px;color:var(--tx3);margin-top:2px}
.d15{font-size:15px}
.mut{color:var(--tx2)}
.soft{color:var(--tx3)}
.mt16{margin-top:16px}
.sep{margin:0 4px}
/* tecla, no estilo das ferramentas com atalho em tudo */
kbd{font-family:inherit;font-size:10px;line-height:1;padding:3px 5px;border-radius:4px;
background:var(--alt);color:var(--tx3);border:1px solid var(--bd);white-space:nowrap;
font-variant-numeric:tabular-nums}
/* ================= LATERAL (só a partir de 1024px) ================= */
#side{display:none;width:224px;flex:0 0 224px;background:var(--deep);color:var(--creme);
flex-direction:column;height:100vh;position:sticky;top:0}
#side .brand{padding:14px 16px 12px}
#side .brand b{font-weight:600;font-size:14px;letter-spacing:-.01em}
#side .brand div{font-size:10px;letter-spacing:.14em;color:rgba(175,250,87,.75);margin-top:3px}
#nav{display:flex;flex-direction:column;padding:4px 8px;gap:2px}
#nav button{border:0;background:none;text-align:left;padding:6px 8px;color:rgba(232,243,232,.78);
font-size:13px;font-weight:500;min-height:34px;border-radius:var(--r);
display:flex;align-items:center;gap:10px}
#nav button svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6}
#nav button .atk{margin-left:auto;font-size:10px;letter-spacing:.08em;opacity:0;
color:rgba(232,243,232,.5)}
#nav button:hover{background:rgba(232,243,232,.08);color:var(--creme)}
#nav button:hover .atk{opacity:1}
#nav button.on{background:rgba(175,250,87,.14);color:var(--luz)}
#menu{margin-top:auto;padding:8px;border-top:1px solid rgba(232,243,232,.1);
display:flex;flex-direction:column;gap:2px}
#menu .menur,#menu2 .menur{display:flex;align-items:center;gap:2px}
#menu .menur button[data-menu],#menu2 .menur button[data-menu]{flex:1 1 auto;min-width:0;text-align:left}
#menu button{border:0;background:none;text-align:left;color:rgba(232,243,232,.6);font-size:12px;
padding:6px 8px;min-height:32px;border-radius:var(--r);font-weight:400}
#menu button:hover{color:var(--creme);background:rgba(232,243,232,.06)}
/* ================= PRINCIPAL ================= */
#main{flex:1;min-width:0;display:flex;flex-direction:column;
padding-bottom:calc(var(--nav) + var(--safe) + 24px)}
/* A barra de cima deixou de ser um bloco escuro: agora é superfície clara com
   um fio embaixo, e o escuro fica só na lateral. Menos peso, mais foco no dado. */
#top{background:var(--surf);color:var(--tx);display:flex;align-items:center;flex-wrap:wrap;
gap:8px;padding:8px 16px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
#brandm{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--deep);flex:0 0 auto}
#top h1{font-size:14px;font-weight:600;letter-spacing:-.01em;min-width:0;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#busca{order:5;flex:1 1 100%;background:var(--alt);border:1px solid transparent;
color:var(--tx);padding:8px 10px;border-radius:var(--r)}
#busca::placeholder{color:var(--tx3)}
#busca:hover{border-color:var(--bdf)}
#busca:focus{background:var(--surf);border-color:var(--mid)}
#savedot{order:2;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-left:auto;
flex:0 0 auto;color:var(--tx3);font-weight:500}
#savedot.ok{color:var(--pos)}
#savedot.no{color:var(--neg)}
#btnnovo{display:none}
#hbusca{order:4}
/* Atalho para a paleta, escrito no próprio botão: é assim que se aprende. */
#btncmd{order:3;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--alt);
border:1px solid transparent;color:var(--tx3);padding:6px 8px;min-height:36px;font-weight:500}
#btncmd:hover{background:#e6eae6;color:var(--tx)}
#btncmd .rot{display:none}
@media (max-width:1023px){#btncmd kbd{display:none}}
/* botão do menu de ações no celular */
#menum{order:4;position:relative;flex:0 0 auto}
#menum summary{list-style:none;cursor:pointer;min-height:44px;min-width:44px;display:flex;
align-items:center;justify-content:center;padding:8px 12px;font-size:11px;letter-spacing:.1em;
text-transform:uppercase;border:1px solid var(--bdf);border-radius:var(--r);color:var(--tx2)}
#menum summary::-webkit-details-marker{display:none}
#menum[open] summary{border-color:var(--mid);color:var(--mid)}
#menu2{position:absolute;right:0;top:calc(100% + 6px);z-index:6;min-width:220px;
background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);box-shadow:var(--sh2);
display:flex;flex-direction:column;padding:4px}
#menu2 button{border:0;background:none;text-align:left;color:var(--tx);padding:8px 10px;
min-height:40px;border-radius:var(--r);font-weight:400}
#menu2 button:hover{background:var(--alt)}
#chips{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;padding:12px 16px 0;min-width:0}
#content{padding:16px;flex:1;min-width:0}
/* ================= NAVEGAÇÃO INFERIOR + FLUTUANTE (celular/tablet) ================= */
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:18;display:flex;background:var(--deep);
padding-bottom:var(--safe)}
#bnav button{flex:1 1 0;min-width:0;border:0;background:none;height:var(--nav);min-height:var(--nav);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;
color:rgba(232,243,232,.68);font-size:10px;letter-spacing:.04em;font-weight:500;
transition:color var(--fast) ease-out}
#bnav button:hover{border:0;background:none}
#bnav button svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6}
#bnav button.on{color:var(--luz)}
#fab{position:fixed;right:16px;bottom:calc(var(--nav) + var(--safe) + 16px);z-index:19;
width:52px;height:52px;min-height:52px;padding:0;border:0;border-radius:999px;
background:var(--mid);color:#fff;font-size:24px;line-height:1;box-shadow:var(--sh2);
display:flex;align-items:center;justify-content:center}
#fab:hover{background:var(--deep);border:0}
/* ================= CHIPS + FILTROS ================= */
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--surf);
padding:3px 6px 3px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
color:var(--tx3);min-width:0;max-width:100%;flex-wrap:wrap;border-radius:var(--r2);font-weight:500}
.chip b{font-weight:500;color:var(--tx);text-transform:none;letter-spacing:0;font-size:13px;
min-width:0;overflow-wrap:anywhere}
.chip>.cl{display:none}
/* Filtro em uso ganha a cor da ação: dá para ver de longe que a tela está filtrada. */
.chip.ativo{border-color:#bcd6c6;background:#f4faf6}
.chip.ativo select{color:var(--mid)}
.chip select{border:1px solid transparent;background:none;padding:6px 4px;min-width:0;min-height:32px;
font-weight:500;color:var(--tx)}
.chip select:hover{border-color:var(--bdf);background:var(--alt)}
.chip button{border:0;background:none;padding:0 6px;color:var(--tx3);font-size:14px;line-height:1;
min-height:44px;min-width:44px;border-radius:999px}
.chip button:hover{color:var(--neg);background:var(--alt)}
/* controle segmentado: pastilha que desliza sobre fundo neutro */
.seg{display:flex;background:var(--alt);border:1px solid var(--bd);min-width:0;max-width:100%;
border-radius:var(--r2);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;color:var(--tx2);min-width:0;min-height:34px;
border-radius:calc(var(--r2) - 3px);font-weight:500;white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.7);color:var(--tx)}
.seg button.on{background:var(--surf);color:var(--deep);box-shadow:var(--sh1)}
.tbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lnk{margin-left:auto;border:0;background:none;color:var(--mid);padding:8px 0;font-weight:500}
.lnk:hover{border:0;background:none;color:var(--deep);text-decoration:underline}
/* ================= CARTÕES ================= */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:1fr}
.g2{grid-template-columns:1fr}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);padding:14px;min-width:0}
.card h2{font-size:13px;font-weight:600;margin-bottom:12px;letter-spacing:-.01em;
display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi[data-kpi]{cursor:pointer;transition:border-color var(--fast) ease-out,box-shadow var(--fast) ease-out}
.kpi[data-kpi]:hover{border-color:var(--bdf);box-shadow:var(--sh2)}
.kpi[data-kpi]:hover .lbl{color:var(--mid)}
.kpi .lbl{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;
display:flex;align-items:center;min-height:18px}
.kpi .val{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.kpi .delta{margin-top:6px;display:block}
.delta{font-size:11px;letter-spacing:.04em}
.up{color:var(--pos)}.down{color:var(--neg)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);text-align:left;
font-weight:500;padding:8px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--mid)}
td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--alt)}
.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;letter-spacing:.04em;
background:var(--alt);border:1px solid var(--bd);white-space:nowrap;color:var(--tx2);font-weight:500}
.dot{display:inline-block;width:6px;height:6px;border-radius:999px;margin-right:6px;
vertical-align:middle;flex:0 0 auto}
.ini{display:inline-flex;width:22px;height:22px;border:1px solid var(--bd);align-items:center;
justify-content:center;font-size:10px;font-weight:600;color:var(--tx2);background:var(--alt);
flex:0 0 auto;border-radius:999px;letter-spacing:.02em}
.late{color:var(--neg)}
.empty{color:var(--tx3);font-size:13px;padding:16px 0;border-top:1px solid var(--bd)}
/* ================= LISTAS DE DUAS LINHAS ================= */
.rowlist{display:flex;flex-direction:column;min-width:0}
.rowlist>div{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
gap:3px;padding:10px 0;border-bottom:1px solid var(--bd);min-height:44px;min-width:0;
transition:background var(--fast) ease-out}
.rowlist>div:last-child{border-bottom:0}
.rowlist>div[data-abre]{cursor:pointer;padding-left:6px;padding-right:6px;margin:0 -6px;
border-radius:var(--r)}
.rowlist>div[data-abre]:hover{background:var(--alt)}
.rl-main{display:block;max-width:100%;min-width:0;font-size:13px;font-weight:500;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* No To Do o texto da tarefa é o conteúdo, não um rótulo: pode ocupar duas
   linhas em vez de ser cortado. */
#content .rowlist .rl-main{white-space:normal;overflow:visible;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rl-main .blk{color:var(--neg);font-size:10px;letter-spacing:.06em;font-weight:600;margin-right:4px}
.rl-sub{display:block;max-width:100%;min-width:0;font-size:12px;color:var(--tx3);
white-space:normal;overflow-wrap:anywhere}
/* lista de cartões (celular) */
.clist{display:flex;flex-direction:column;gap:6px;min-width:0}
.ci{display:flex;flex-direction:column;gap:3px;background:var(--surf);border:1px solid var(--bd);
border-radius:var(--r2);padding:12px;min-height:44px;min-width:0;cursor:pointer;
transition:border-color var(--fast) ease-out,background var(--fast) ease-out}
.ci:hover{border-color:var(--bdf);background:#fdfdfc}
.ci .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ci .s{font-size:12px;color:var(--tx3);overflow-wrap:anywhere}
/* ================= GRÁFICOS ================= */
.gsvg{display:block;width:100%;height:auto}
.rosca{display:flex;flex-direction:column;gap:16px;min-width:0}
.rosca>svg{width:100%;max-width:180px;height:auto;align-self:center;flex:0 0 auto}
.rosca>.rowlist{flex:1 1 auto;min-width:0}
/* ================= QUADRO ================= */
.board{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;overflow-y:visible;
scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 12px}
.bwrap+.bwrap{margin-top:24px}
.bh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:11px;
letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:500}
.fun+.fun{margin-top:16px;padding-top:16px;border-top:1px solid var(--bd)}
#pubseg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px 0;min-width:0}
.badge.b2c{border-color:#cbe3d1;background:#f0f7f2;color:var(--pos)}
/* Coluna sem moldura: fundo levemente rebaixado, como as raias das ferramentas
   modernas. A moldura em cada coluna competia com a moldura de cada cartão. */
.col{flex:0 0 86vw;scroll-snap-align:start;min-width:0;background:var(--alt);
border:1px solid transparent;border-radius:var(--r2);min-height:180px;display:flex;flex-direction:column;
transition:background var(--fast) ease-out,border-color var(--fast) ease-out}
.col.over{border-color:var(--mid);background:#eaf3ee}
.colh{padding:10px 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.colh .n{font-size:12px;font-weight:600;color:var(--tx2);letter-spacing:-.01em}
.colh .m{font-size:11px;color:var(--tx3);letter-spacing:.02em;margin-left:auto}
.cards{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dc{border:1px solid var(--bd);background:var(--surf);border-radius:var(--r);padding:10px;
cursor:pointer;min-width:0;box-shadow:var(--sh1);
transition:border-color var(--fast) ease-out,box-shadow var(--fast) ease-out}
.dc:hover{border-color:var(--bdf);box-shadow:var(--sh2)}
.dc.drag{opacity:.4}
.dc .cl{font-size:13px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px;overflow-wrap:anywhere}
.dc .vl{font-weight:600;font-variant-numeric:tabular-nums}
.dc .rw{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;min-width:0}
.dc .np{font-size:12px;color:var(--tx2);margin-top:6px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;min-width:0}
.dc select{width:100%;margin-top:8px;border:1px solid var(--bd);padding:6px 8px;
background:var(--alt);font-size:12px}
.dc .err{margin-top:8px;border-left:2px solid var(--neg);padding:8px;background:#fff5f5;
color:var(--neg);font-size:11px;line-height:1.4;border-radius:0 var(--r) var(--r) 0}
/* ================= FOLHA / PAINEL DE DETALHE ================= */
#panel{position:fixed;left:0;right:0;bottom:0;top:0;width:100%;background:var(--surf);
z-index:20;display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain;
transform:translateY(100%);transition:transform 160ms cubic-bezier(.32,.72,0,1);
box-shadow:var(--sh3);padding-bottom:calc(var(--safe) + 24px)}
#panel.open{transform:translateY(0)}
#shade{position:fixed;inset:0;background:rgba(9,45,41,.28);z-index:15;display:none;
backdrop-filter:blur(1px)}
#shade.open{display:block}
/* Cabeçalho da gaveta em superfície clara: o bloco verde escuro roubava a
   atenção do que importa, que é o nome do negócio. */
.ph{background:var(--surf);color:var(--tx);padding:14px 16px;position:sticky;top:0;z-index:2;
border-bottom:1px solid var(--bd)}
.ph .x{float:right;border:0;background:none;color:var(--tx3);font-size:12px;padding:6px 8px;
min-height:36px;font-weight:500}
.ph .x:hover{color:var(--tx);background:var(--alt)}
.ph .lbl{color:var(--tx3)!important}
.pb{padding:12px 16px}
/* trilha de etapas: barra fina contínua, etapa atual em destaque */
.trk{display:flex;gap:6px;margin:12px 0 16px;overflow-x:auto;scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;scrollbar-width:none}
.trk::-webkit-scrollbar{display:none}
.trk button{position:relative;flex:0 0 128px;scroll-snap-align:start;min-width:0;
display:flex;flex-direction:column;gap:4px;padding:10px 8px 8px;min-height:62px;
border:0;background:none;text-align:left;border-radius:var(--r)}
.trk button:hover{border:0;background:var(--alt)}
.trk .bar{position:absolute;top:0;left:0;right:0;height:2px;background:var(--bdf);border-radius:2px}
.trk button.done .bar{background:var(--governance)}
.trk button.now .bar{background:var(--mid)}
.trk .n{font-size:10px;line-height:1;color:var(--tx3);font-weight:600;letter-spacing:.04em}
.trk .t{font-size:12px;line-height:1.3;color:var(--tx3);
display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.trk button.now .t{color:var(--tx);font-weight:600}
.fld{display:grid;grid-template-columns:1fr;gap:3px;padding:8px 0;
border-bottom:1px solid var(--bd);align-items:start;min-width:0}
.fld>.lbl{padding-top:3px;text-transform:none;letter-spacing:0;font-size:12px;font-weight:400}
.fld>span{min-width:0;overflow-wrap:anywhere}
.sec{border-top:1px solid var(--bd);margin-top:8px}
.sec>.sech{display:flex;align-items:center;gap:8px}
.sec>.sech>button[data-sec]{flex:1 1 auto;min-width:0;border:0;background:none;text-align:left;
padding:12px 0;font-size:13px;font-weight:600;display:flex;gap:8px;color:var(--tx)}
.sec>.sech>button[data-sec]:hover{border:0;background:none;color:var(--mid)}
.sec>.sech>button[data-sec] .cnt{color:var(--tx3);font-weight:400;margin-left:auto}
.sec .body{padding:0 0 12px}
[data-edit]{cursor:text;border-radius:4px;padding:4px 6px;margin:-4px -6px;display:inline-block;
max-width:100%;min-width:0;transition:background var(--fast) ease-out}
[data-edit]:hover{background:var(--alt)}
[data-edit]::after{content:"editar";font-size:11px;color:var(--mid);margin-left:8px;opacity:0}
[data-edit]:hover::after{opacity:1}
[data-edit] input,[data-edit] select,[data-edit] textarea{width:100%;border:1px solid var(--mid);
padding:6px 8px;background:#fff}
.pend{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd);
flex-wrap:wrap;min-width:0}
.pend input[type=checkbox]{width:18px;height:18px;margin:4px 0;flex:0 0 auto;accent-color:var(--mid)}
.pend>span{min-width:0;overflow-wrap:anywhere}
.pend .blk{color:var(--neg);font-size:10px;letter-spacing:.06em;font-weight:600}
.pend .corpo{flex:1 1 12em;min-width:0;overflow-wrap:anywhere}
.pend .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;
color:var(--tx3);margin-top:2px}
.pend .meta [data-edit]{font-size:11px;padding:2px 4px;margin:-2px -4px}
.pend .acs{display:flex;gap:4px;align-items:center;flex:0 0 auto;margin-left:auto;
opacity:1;transition:opacity var(--fast) ease-out}
.pend .acs button{font-size:11px;padding:5px 8px;min-height:30px;letter-spacing:.02em}
.pend .acs button.on{background:#fdf0f2;color:var(--neg)}
.pend.done{color:var(--tx3)}
.pend.done .corpo{text-decoration:line-through}
/* Concluir: pastilha com o estado escrito, não só a cor. Concluída fica verde
   de estado, e o hover indica que dá para reabrir. */
.pdone{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;margin:1px 0 0;
font-size:11px;font-weight:600;letter-spacing:.01em;padding:5px 9px;min-height:30px;
border:1px solid var(--bd);border-radius:999px;color:var(--tx2);background:var(--surf)}
.pdone:hover{border-color:var(--mid);color:var(--deep);background:var(--alt)}
.pdone .ic{width:14px;height:14px;display:flex;flex:0 0 auto}
.pdone .ic svg{width:14px;height:14px}
.pdone.on{background:#eef4f0;border-color:#cfe0d5;color:var(--ok)}
.pdone.on .ic{color:var(--ok)}
/* A faixa que separa o que já foi feito. */
.pfeitas{margin:14px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
font-weight:600;color:var(--tx3)}
/* Atalhos do contato: aparecem só quando há o que abrir. */
.clinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.clinks a{font-size:12px;font-weight:500;color:var(--mid);text-decoration:none}
.clinks a:hover{color:var(--deep);text-decoration:underline}
.err{color:var(--neg);font-size:11px;margin-top:4px;display:block}
/* ================= ENCAMINHAR ================= */
.encres{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 4px;font-size:13px;color:var(--tx2)}
.encres b{font-weight:600;color:var(--tx);font-variant-numeric:proportional-nums}
.encacs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.encacs .pri{background:var(--deep);color:#fff;border-color:var(--deep)}
.encacs .pri:hover{background:var(--mid);border-color:var(--mid)}
.btnl{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;
border:1px solid var(--bd);border-radius:var(--r);background:var(--surf);
font-size:13px;font-weight:500;color:var(--tx);text-decoration:none}
.btnl:hover{border-color:var(--mid);background:var(--alt);color:var(--deep)}
.enclink{width:100%;border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px;
font-size:12px;background:var(--alt);color:var(--tx2)}
.encmsg{width:100%;border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;
font-size:12px;line-height:1.5;background:var(--alt);color:var(--tx2);resize:vertical;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* ================= TO DO ================= */
/* Duas abas grandes: o que é meu, e o que é do time. Nada mais para escolher. */
.tabs{display:flex;gap:2px;background:var(--alt);border:1px solid var(--bd);border-radius:var(--r2);
padding:3px;margin-bottom:14px}
.tabs button{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;
background:none;border:0;min-height:40px;border-radius:calc(var(--r2) - 4px);
font-size:14px;font-weight:600;color:var(--tx2);letter-spacing:-.01em}
.tabs button:hover:not(:disabled){background:rgba(255,255,255,.7);color:var(--tx)}
.tabs button.on{background:var(--surf);color:var(--deep);box-shadow:var(--sh1)}
.tabs button .n{font-size:11px;font-weight:600;background:var(--bg);color:var(--tx3);
border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.tabs button.on .n{background:var(--deep);color:#fff}
.tabs button:disabled{opacity:.4}
/* Próximos passos não é aba: é outro eixo. Fica no mesmo trilho, mas depois de
   um fio, para não parecer que substitui a escolha de pessoa. */
.tabs button.tsep{flex:0 0 auto;padding:0 14px;margin-left:5px;position:relative}
.tabs button.tsep::before{content:"";position:absolute;left:-3px;top:8px;bottom:8px;
width:1px;background:var(--bd)}
@media (max-width:640px){
 .tabs{flex-wrap:wrap;row-gap:3px}
 .tabs button{flex:1 1 40%}
 .tabs button.tsep{flex:1 1 100%;margin-left:0}
 .tabs button.tsep::before{display:none}
}
/* A área de destaque: quatro números, o que cada um conta e o que quer dizer.
   Cada cartão é o próprio filtro. O fio de 1px entre eles é o fundo aparecendo
   pelo gap do grid — moldura por cartão viraria caixa dentro de caixa. */
.tdest{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bd);
border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;margin-bottom:14px}
.tdc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;
background:var(--surf);border:0;border-radius:0;padding:11px 14px 12px;
transition:background var(--fast) ease-out}
.tdc:hover:not(:disabled){background:var(--alt)}
.tdc:disabled{opacity:.45}
/* Selecionado: fundo rebaixado e um fio de 2px no topo, na cor do estado. */
.tdc.on{background:#eef4f0;box-shadow:inset 0 2px 0 var(--deep)}
.tdc.crit.on{box-shadow:inset 0 2px 0 var(--crit)}
.tdc.warn.on{box-shadow:inset 0 2px 0 var(--warn)}
.tdc.neutro.on{box-shadow:inset 0 2px 0 var(--neutro)}
/* Algarismo proporcional: número grande solto não precisa alinhar em coluna. */
.tdn{font-size:23px;font-weight:600;line-height:1.15;letter-spacing:-.022em;
font-variant-numeric:proportional-nums;color:var(--tx)}
.tdc.crit .tdn{color:var(--crit)}
.tdc.warn .tdn{color:var(--warn)}
.tdc.neutro .tdn{color:var(--tx2)}
.tdl{font-size:12px;font-weight:600;color:var(--tx2);letter-spacing:-.006em}
.tdf{font-size:11px;line-height:1.35;color:var(--tx3)}
/* Uma superfície por grupo, com o cabeçalho grudando no topo ao rolar. */
.tgrupo{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);
overflow:hidden;margin-bottom:12px}
.tgrupo .th{display:flex;align-items:center;background:var(--surf);
border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2;padding-right:8px}
/* O que abre e fecha ocupa a faixa toda menos o botão de encaminhar. */
.tgrupo .thb{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;
padding:10px 14px;background:none;border:0;border-radius:0;text-align:left}
.tgrupo .thb.ac{cursor:pointer;transition:background var(--fast) ease-out}
.tgrupo .thb.ac:hover{background:var(--alt)}
/* Encaminhar por pessoa: discreto, e no celular vira só o verbo. */
.tgrupo .thenc{flex:0 0 auto;font-size:11px;font-weight:600;padding:5px 9px;min-height:28px;
border:1px solid transparent;border-radius:999px;color:var(--tx3);background:none}
.tgrupo .thenc:hover{border-color:var(--bd);color:var(--deep);background:var(--surf)}
.tgrupo.fechada .th{border-bottom:0}
.chev{width:14px;height:14px;flex:0 0 auto;color:var(--tx3);display:flex;
transition:transform var(--fast) ease-out}
.chev svg{width:14px;height:14px}
.chev.on{transform:rotate(90deg)}
/* Abrir e fechar todas: discreto, à direita, encostado na primeira seção. */
.tacc{display:flex;align-items:center;gap:6px;margin:-6px 0 8px}
.tacc .sp{flex:1 1 auto}
/* "Só de <pessoa>": a pastilha que o link liga, com o × que devolve a lista. */
.tso{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
padding:5px 10px;min-height:30px;border-radius:999px;border:1px solid #cfe0d5;
background:#eef4f0;color:var(--deep)}
.tso .x{font-size:14px;line-height:1;opacity:.6}
.tso:hover{border-color:var(--mid)}
.tso:hover .x{opacity:1}
.tacc button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;
padding:4px 6px;font-size:12px;font-weight:500;color:var(--tx3);border-radius:var(--r)}
.tacc button:hover{background:var(--alt);color:var(--tx)}
.tgrupo .th .ic{width:16px;height:16px;flex:0 0 auto;color:var(--tx3);display:flex}
.tgrupo .th .ic svg{width:16px;height:16px;fill:currentColor}
.tgrupo .th .tn{font-size:13px;font-weight:600;letter-spacing:-.012em;min-width:0;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgrupo .th .tc{font-size:11px;font-weight:600;color:var(--tx3);background:var(--alt);
border-radius:999px;padding:2px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.tgrupo .th .tb{font-size:11px;font-weight:600;color:var(--crit);background:#fdf0f2;
border-radius:999px;padding:2px 8px;flex:0 0 auto}
.tgrupo .th .tw{font-size:11px;font-weight:600;color:var(--warn);background:#fdf6ea;
border-radius:999px;padding:2px 8px;flex:0 0 auto}
.tgrupo .th .tp{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.tgrupo .th .td{font-size:12px;color:var(--tx3);margin-left:auto;text-align:right}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
border-radius:999px;font-size:10px;font-weight:600;color:var(--tx2);flex:0 0 auto;
letter-spacing:.02em;text-transform:uppercase}
.tsub{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--alt);
border-bottom:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--tx2)}
.tsub .tc{font-size:11px;color:var(--tx3);background:var(--surf);border-radius:999px;padding:2px 7px}
/* A linha: gutter de estado, texto, data. */
.ti{display:flex;align-items:center;border-bottom:1px solid var(--bd);cursor:pointer;
position:relative;transition:background var(--fast) ease-out}
.ti:last-child{border-bottom:0}
.ti:hover{background:var(--alt)}
.ti.sel{background:#eef4f0}
.ti.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--mid)}
.ti>.ic{flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:var(--tkc)}
.ti>.ic svg{width:13px;height:13px;fill:var(--tkc)}
.ti.prazo>.ic svg,.ti.semPrazo>.ic svg{fill:none}
.ti .mid{flex:1 1 auto;min-width:0;padding:9px 10px 9px 0;display:flex;flex-direction:column;gap:1px}
.ti .tt{font-size:13px;font-weight:500;line-height:1.35;letter-spacing:-.005em;overflow-wrap:anywhere;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ti .mt{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .rt{flex:0 0 auto;padding:9px 14px 9px 8px;display:flex;flex-direction:column;
align-items:flex-end;gap:1px;text-align:right;justify-content:center}
.ti .dt{font-size:12px;font-variant-numeric:tabular-nums;color:var(--tx2);white-space:nowrap}
.ti .dt.vazia{color:var(--tx3);font-variant-numeric:normal;font-style:italic}
.ti .qd{font-size:11px;color:var(--tx3);white-space:nowrap}
.ti.vencido .qd,.ti.hoje .qd{color:var(--warn);font-weight:500}
/* A virada para "sem data" dentro da seção da pessoa. */
.tvirada{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--alt);
border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:11px;
letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--tx2)}
.tvirada .ic{width:13px;height:13px;color:var(--neutro);display:flex}
.tvirada .ic svg{width:13px;height:13px;fill:none}
.tvirada .tc{font-size:11px;color:var(--tx3);background:var(--surf);border-radius:999px;
padding:2px 7px;letter-spacing:0}
.tvirada .td{margin-left:auto;font-size:11px;color:var(--tx3);text-transform:none;
letter-spacing:0;font-weight:400}
/* ================= PALETA DE COMANDOS ================= */
#cmdshade{position:fixed;inset:0;background:rgba(9,45,41,.32);z-index:48;display:none}
#cmdshade.on{display:block}
#cmd{position:fixed;left:8px;right:8px;top:8px;z-index:49;background:var(--surf);
border:1px solid var(--bdf);border-radius:var(--r2);box-shadow:var(--sh3);display:none;
flex-direction:column;overflow:hidden;max-height:calc(100vh - 16px)}
#cmd.on{display:flex}
#cmd .cbusca{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
#cmd .cbusca svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:var(--tx3);stroke-width:1.8}
#cmd input{flex:1 1 auto;border:0;background:none;padding:0;min-height:28px;font-size:15px}
#cmd input:focus{outline:0}
#cmd .clista{overflow-y:auto;padding:6px;min-height:0}
#cmd .cgrupo{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);
font-weight:600;padding:10px 8px 4px}
#cmd .cit{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:var(--r);
cursor:pointer;min-height:38px}
#cmd .cit .cico{width:20px;flex:0 0 auto;text-align:center;color:var(--tx3);font-size:11px;font-weight:600}
#cmd .cit .ctit{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
font-weight:500}
#cmd .cit .cmeta{flex:0 0 auto;font-size:11px;color:var(--tx3);white-space:nowrap}
#cmd .cit.sel{background:var(--alt)}
#cmd .cit.sel .cico{color:var(--mid)}
#cmd .cvazio{padding:24px 12px;text-align:center;color:var(--tx3)}
#cmd .cpe{display:flex;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--bd);
font-size:11px;color:var(--tx3);flex-wrap:wrap}
#cmd .cpe span{display:flex;gap:4px;align-items:center}
/* ================= AVISO ================= */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + var(--safe) + 56px + 24px);
background:var(--deep);color:var(--creme);padding:10px 14px;display:none;gap:16px;
align-items:center;flex-wrap:wrap;z-index:30;border-radius:var(--r2);box-shadow:var(--sh2);
font-size:13px}
#toast.on{display:flex}
#toast button{border:1px solid rgba(175,250,87,.4);background:none;color:var(--luz);
padding:6px 10px;min-height:32px}
#toast button:hover{border-color:var(--luz);background:rgba(175,250,87,.14);color:var(--luz)}
/* ================= ENTRAR ================= */
#login{position:fixed;inset:0;z-index:60;background:var(--deep);display:none;
align-items:center;justify-content:center;padding:16px}
#login.on{display:flex}
#login form{background:var(--surf);border:1px solid var(--bdf);border-radius:var(--r2);
box-shadow:var(--sh3);padding:24px;width:100%;max-width:360px}
#login .marca{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--deep)}
#login .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin:4px 0 20px}
#login label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:500}
#login input{width:100%;border:1px solid var(--bdf);padding:8px 10px;margin-bottom:14px;background:var(--surf)}
#login button{width:100%;background:var(--mid);border:1px solid var(--mid);color:#fff;
font-weight:600;padding:10px;min-height:44px}
#login button:hover{background:#0a4240;border-color:#0a4240;color:#fff}
#login .erro{color:var(--neg);font-size:12px;margin-bottom:14px;display:none}
#login .erro.on{display:block}
#quem{font-size:11px;letter-spacing:.02em;color:rgba(232,243,232,.6);padding:8px 16px;
border-top:1px solid rgba(232,243,232,.1);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#quem b{font-weight:600;color:var(--creme)}
#quem button{border:0;background:none;color:rgba(232,243,232,.6);font-size:11px;padding:6px 0;
min-height:32px}
#quem button:hover{color:var(--luz);background:none}
#quem .ver{flex:1 1 100%;font-size:10px;letter-spacing:.06em;color:rgba(232,243,232,.4);
font-variant-numeric:tabular-nums}
/* ================= HINTS ================= */
.hint{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
width:15px;height:15px;min-height:15px;padding:0;margin-left:6px;vertical-align:middle;
border:1px solid var(--bd);border-radius:999px;background:var(--surf);color:var(--tx3);
font-size:10px;line-height:1;font-weight:600}
.hint:hover,.hint:focus-visible{color:var(--mid);border-color:var(--mid);background:var(--surf)}
.hint.esc{border-color:var(--bd);background:var(--alt);color:var(--tx3)}
.hint.esc:hover,.hint.esc:focus-visible{color:var(--mid);border-color:var(--mid)}
#hint{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe));top:auto;z-index:40;
display:none;background:var(--surf);border:0;border-top:1px solid var(--bdf);padding:16px;
font-size:13px;line-height:1.5;color:var(--tx);box-shadow:var(--sh3)}
#hint.on{display:block}
#hint .lbl{margin-bottom:8px}
#hint p{margin-bottom:8px}
#hint p:last-of-type{margin-bottom:0}
#hint .hintx{margin-top:16px;border:1px solid var(--bdf);background:var(--surf);color:var(--tx2);padding:8px 12px}
#hint .hintx:hover{background:var(--alt);color:var(--tx)}
#print{display:none}
/* ================= 768px — TABLET ================= */
@media (min-width:768px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .rowlist>div{flex-direction:row;align-items:baseline;gap:12px}
 .rl-main{flex:1 1 auto;min-width:0}
 .rl-sub{flex:0 0 auto;white-space:nowrap;text-align:right;overflow-wrap:normal}
 .rosca{flex-direction:row;align-items:center;gap:24px}
 .rosca>svg{flex:0 1 180px;min-width:96px;align-self:auto}
 .col{flex:0 0 60vw}
 .fld{grid-template-columns:150px 1fr;gap:12px}
 .card{padding:16px}
 #content{padding:20px 24px}
 #chips{padding:16px 24px 0}
 .board{margin:0 -24px;padding:0 24px 12px}
 #pubseg{padding:16px 24px 0}
 #cmd{left:50%;right:auto;transform:translateX(-50%);top:12vh;width:min(600px,calc(100vw - 32px));
  max-height:min(560px,70vh)}
 #hint{left:auto;right:auto;bottom:auto;top:0;width:300px;max-width:300px;padding:14px;
  border:1px solid var(--bdf);border-radius:var(--r2);box-shadow:var(--sh2)}
 #hint .hintx{margin-top:12px}
}
/* ================= 1024px — MESA ================= */
@media (min-width:1024px){
 button{min-height:30px;padding:6px 10px}
 select,textarea,input:not([type=checkbox]){min-height:30px;padding:5px 8px}
 #side{display:flex}
 #bnav,#fab{display:none}
 #main{padding-bottom:0}
 #top{height:52px;flex:0 0 52px;flex-wrap:nowrap;gap:12px;padding:0 20px}
 #brandm,#menum{display:none}
 #top h1{font-size:15px;flex:0 0 auto;min-width:140px}
 #busca{order:2;flex:1 1 auto;max-width:440px}
 #btncmd{min-height:30px}
 #btncmd .rot{display:inline}
 #hbusca{order:3;margin-left:0}
 #savedot{order:3}

 .board{margin:0;padding:0 0 12px}

function validarEtapa(d,etapa){
 if(d.tipoVenda==="parceiro"&&!d.parceiroId)return TEXTOS.erros.parceiro;
 if(d.tipoVenda==="direta"&&!d.clienteId)return TEXTOS.erros.cliente;
 if(d.tipoVenda==="direta"&&d.parceiroId)return TEXTOS.erros.semParceiro;
 if(etapa==="perdido")return d.motivoPerda?null:TEXTOS.erros.perda;
 const n=Number(etapa);
 if(d.frente==="capital"&&!d.tese)return TEXTOS.erros.tese;
 /* Payments: pendência bloqueante em aberto trava o avanço além de Análise de
    compliance (etapa 4). Ata de 21/08/2026, seção 7.1 — conversa exploratória
    pode seguir, assinatura e onboarding não, antes da OB-03 e da OB-04. */
 if(d.frente==="payments"&&n>=5&&(d.pendencias||[]).some(p=>p.bloqueante&&!p.resolvida))
  return TEXTOS.erros.bloqueiaPayments;
 /* As exigências abaixo são de Capital. Antes valiam para todas as frentes, e
    com os funis novos isso travaria Governance na etapa 6 pedindo campos que
    a frente não tem. */
 if(d.frente==="capital"){
  const cm=d.comite||{};
  if(n>=6&&CINCO.some(([k])=>(d.cincoPerguntas||{})[k]==="NaoAvaliada"||!(d.cincoPerguntas||{})[k])) return TEXTOS.erros.cinco;
  if(n>=7&&!d.frenteCapital)return TEXTOS.erros.frenteCap;
  if(n>=4&&(!d.situacao||!d.segmento))return TEXTOS.erros.situacaoSegmento;
  if(n>=5&&!d.estrutura)return TEXTOS.erros.estruturaReq;
  if(n>=7&&(!cm.decisao||!cm.validadeAte))return TEXTOS.erros.comiteReq;
  if(n>=10&&!d.investidor)return TEXTOS.erros.investidorReq;
 }
 return null;
}

 if(String(d.etapa)===String(etapa))return null;
 /* Sem ninguém logado não existe autor. Cair no responsável do negócio, como
    era antes, gravava que o Paulo moveu algo que o Paulo não moveu. */
 if(!quem&&!(state.usuario&&state.usuario.nome))return TEXTOS.erros.semUsuario;
 const e=validarEtapa(d,etapa);if(e)return e;
 snapshot();
 d.historico=d.historico||[];
 d.historico.push({de:etapaNome(d),para:etapaNome(d,etapa),quando:new Date().toISOString(),
  quem:quem||state.usuario.nome});
 d.etapa=etapa==="perdido"?"perdido":Number(etapa);

 return null;
}

/* ====================== CONVERSA COM O SUPABASE ======================
   Sem servidor no meio: o painel fala direto com o banco. O token vive no
   próprio navegador e é renovado quando vence. */
const SESSAO_CHAVE="oren.sessao.v1";
function sessaoGuardada(){
 try{return JSON.parse(localStorage.getItem(SESSAO_CHAVE)||"null");}catch(e){return null;}
}
function guardarSessao(s){
 try{if(s)localStorage.setItem(SESSAO_CHAVE,JSON.stringify(s));else localStorage.removeItem(SESSAO_CHAVE);}catch(e){}
}
function cabecalhos(comToken,extras){
 const h={"apikey":SUPABASE_KEY,"content-type":"application/json"};
 const s=sessaoGuardada();
 if(comToken&&s&&s.access_token)h["Authorization"]="Bearer "+s.access_token;
 return Object.assign(h,extras||{});
}
async function renovarSessao(){
 const s=sessaoGuardada();
 if(!s||!s.refresh_token)return false;
 const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",
  {method:"POST",headers:cabecalhos(false),body:JSON.stringify({refresh_token:s.refresh_token})});
 if(!r.ok){guardarSessao(null);return false;}
 guardarSessao(await r.json());
 return true;
}
/* Toda chamada tenta uma vez; se o token venceu, renova e repete. */
async function sb(caminho,opcoes,jaRenovou){
 const o=Object.assign({},opcoes);
 const extras=o.extras;delete o.extras;
 const r=await fetch(SUPABASE_URL+caminho,Object.assign(o,{headers:cabecalhos(true,extras)}));
 if(r.status===401&&!jaRenovou&&await renovarSessao())return sb(caminho,opcoes,true);
 return r;
}
/* Três rodadas de "não loga" se passaram porque a tela dizia sempre a mesma
   frase para causas diferentes. Agora cada resposta do GoTrue vira a frase que
   corresponde, e o código técnico vai no fim entre parênteses: com ele, um
   print da tela basta para saber onde mexer. */
function erroDoLogin(status,e){
 /* e.message entra na lista: é onde o gateway põe "Invalid API key", e sem ele
    um 401 de chave trocada saía como "senha inválida" -- a mensagem mais
    enganosa possível quando o time inteiro está fora. */
 const t=String(e.error_description||e.msg||e.message||e.error||"");
 const cod=String(e.error_code||e.error||"")||("HTTP "+status);
 let msg=TEXTOS.erroLogin;
 /* 5xx não é credencial: dizer "senha inválida" aqui manda a pessoa trocar uma
    senha que estava certa. */
 if(status===401||/api key/i.test(t))msg=TEXTOS.erroChave;
 else if(status>=500||status===503)msg=TEXTOS.erroServidor;
 else if(/not confirmed/i.test(t))msg=TEXTOS.erroNaoConfirmado;
 else if(/banned|too many|rate/i.test(t)||status===429)msg=TEXTOS.erroBanido;
 else if(/password/i.test(t)&&/not set|missing/i.test(t))msg=TEXTOS.erroSemSenha;
 else if(t&&!/invalid login/i.test(t))msg=t;
 return msg+" ("+cod+")";
}
async function entrar(email,senha){
 const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",
  {method:"POST",headers:cabecalhos(false),body:JSON.stringify({email:email,password:senha})});
 if(!r.ok){
  const e=await r.json().catch(()=>({}));
  throw new Error(erroDoLogin(r.status,e));
 }
 guardarSessao(await r.json());
 const ok=await carregarPerfil();
 if(!ok)throw new Error(ERRO_PERFIL||TEXTOS.semPerfil);
 if(state.usuario.senhaProvisoria)return exigirTroca();
 /* carregarEMigrar, não carregarDoServidor: quem entra pelo formulário precisa
    passar pela migração e pelas cargas igual a quem já tinha sessão. Com o
    caminho curto aqui, o dado novo só aparecia no recarregamento seguinte. */
 return carregarEMigrar();
}
/* Duas falhas diferentes moravam num "return false" só: pedido recusado (RLS,
   coluna que não existe, projeto errado) e conta sem linha em perfil. A segunda
   se resolve em /admin; a primeira, não -- e dizer a mesma coisa nas duas manda
   quem lê para o lugar errado. */
let ERRO_PERFIL="";
async function carregarPerfil(){
 ERRO_PERFIL="";
 const s=sessaoGuardada();
 if(!s||!s.user)return false;
 const r=await sb("/rest/v1/perfil?select=nome,papel,senha_provisoria&id=eq."+encodeURIComponent(s.user.id),{method:"GET"});
 if(!r.ok){ERRO_PERFIL=TEXTOS.semPerfilLer(r.status);return false;}
 const linhas=await r.json();
 if(!linhas.length)return false;
 state.usuario={nome:linhas[0].nome,papel:linhas[0].papel,email:s.user.email,
  senhaProvisoria:!!linhas[0].senha_provisoria};
 return true;

async function carregarDoServidor(semRender){
 const r=await sb("/rest/v1/pipeline?select=dados,versao,atualizado_em,atualizado_por&id=eq.1",{method:"GET"});
 if(r.status===401){mostrarLogin();return false;}
 if(!r.ok){state.semRede=true;renderTopo();return false;}
 const linhas=await r.json();
 const linha=linhas[0]||{dados:{partners:[],customers:[],deals:[]},versao:0};
 state.data=linha.dados;state.versao=linha.versao;state.dirty=false;state.servidor=true;state.semRede=false;
 esconderLogin();
 if(!semRender)render();
 return true;
}
/* Gravação direta, sem o atraso de salvarServidor. A migração precisa saber se
   gravou antes de seguir, e o debounce não devolve resposta. */
async function gravarAgora(){
 try{
  const r=await sb("/rest/v1/pipeline?id=eq.1&versao=eq."+encodeURIComponent(state.versao),
   {method:"PATCH",body:JSON.stringify({dados:state.data}),extras:{"Prefer":"return=representation"}});
  if(r.status===401){mostrarLogin();return false;}
  if(!r.ok)return false;
  const linhas=await r.json();
  if(!linhas.length){await carregarDoServidor(true);return false;}
  state.versao=linhas[0].versao;state.dirty=false;renderTopo();
  return true;
 }catch(e){state.semRede=true;renderTopo();return false;}
}
/* ---------------------------- MIGRAÇÃO ----------------------------
   Converte o formato antigo (funil único de dez etapas para as três frentes,
   sem campo de público) no schema 2. Roda uma vez: depois de gravado o
   schema, nunca mais. Converte em memória primeiro e só grava se quem está
   logado puder gravar. */
const MAPA_GOV={1:1,2:2,8:3,9:4};
function migrar(origem){
 const d=JSON.parse(JSON.stringify(origem||{}));
 d.partners=d.partners||[];d.customers=d.customers||[];d.deals=d.deals||[];
 const rel={antes:d.deals.length+d.customers.length+d.partners.length,
  depois:0,porEtapa:{},porFrente:{},porPublico:{},revisar:[]};
 d.deals.forEach(x=>{
  x.publico=publicoDe(x);
  if(x.mandatoAssinadoEm===undefined)x.mandatoAssinadoEm="";
  if(!x.checklist||typeof x.checklist!=="object")x.checklist={};
  if(!FUNIS[x.frente])x.frente="governance";
  if(x.etapa==="perdido")return;                       /* perdido é marca, preserva motivo */
  if(x.frente!=="governance")return;                   /* Capital e Payments ficam onde estão */
  const de=Number(x.etapa),para=MAPA_GOV[de];
  if(para){
   x.etapa=para;
   if(para===4&&!x.fechadoEm)x.fechadoEm=agora();
  }else{
   x.etapa=2;
   x.tags=Array.isArray(x.tags)?x.tags:[];
   if(x.tags.indexOf("revisar-migracao")<0)x.tags.push("revisar-migracao");
   rel.revisar.push(x.id+" (vinha da etapa "+de+")");
  }
 });
 /* Só deriva do tipo quando o cliente ainda não tem público definido: um
    B2B2C escolhido à mão não pode ser sobrescrito pela regra PF/PJ. */
 d.customers.forEach(c=>{
  c.publico=(PUBLICOS_VALIDOS.indexOf(c.publico)>=0)?c.publico:(c.tipo==="PF"?"B2C":"B2B");});
 d.partners.forEach(x=>{x.publico="B2B";});            /* parceiro é sempre B2B */
 d.schema=2;
 rel.depois=d.deals.length+d.customers.length+d.partners.length;
 d.deals.forEach(x=>{
  const k=String(x.etapa);
  rel.porEtapa[k]=(rel.porEtapa[k]||0)+1;
  rel.porFrente[x.frente]=(rel.porFrente[x.frente]||0)+1;
  rel.porPublico[x.publico]=(rel.porPublico[x.publico]||0)+1;
 });
 return {dados:d,rel:rel};
}
async function migrarSeNecessario(){
 for(let tentativa=1;tentativa<=3;tentativa++){
  if(!state.data||state.data.schema===2)return;
  const {dados,rel}=migrar(state.data);
  if(rel.antes!==rel.depois){
   console.error("Migração interrompida: "+rel.antes+" registros antes e "+rel.depois+" depois. Nada foi gravado.");
   return;
  }
  console.log("Migração para schema 2 — registros antes: "+rel.antes+" · depois: "+rel.depois+
   " (negócios: "+dados.deals.length+" · clientes: "+dados.customers.length+
   " · parceiros: "+dados.partners.length+")");
  console.log("Negócios por etapa:",rel.porEtapa);
  console.log("Negócios por frente:",rel.porFrente);
  console.log("Negócios por público:",rel.porPublico);
  if(rel.revisar.length)console.warn("Marcados como revisar-migracao:",rel.revisar);
  state.data=dados;
  if(state.usuario&&state.usuario.papel==="leitor"){
   console.log("Perfil somente leitura: dados convertidos apenas na tela, sem gravar.");
   return;
  }
  if(await gravarAgora()){console.log("Migração gravada.");return;}
  console.log("Conflito ao gravar a migração. Recarreguei do servidor e vou converter de novo (tentativa "+tentativa+" de 3).");
 }
 console.warn("Não consegui gravar a migração depois de três tentativas. Os dados na tela estão convertidos.");
}

function aplicarCargaAta(d){
 if(!d||!Array.isArray(d.deals)||!Array.isArray(d.customers))return null;
 const cli=CARGA_ATA.cliente,neg=CARGA_ATA.negocio;
 const jaCliente=d.customers.some(c=>c.id===cli.id);
 const jaNegocio=d.deals.some(x=>x.id===neg.id);
 if(!jaCliente)d.customers.push(JSON.parse(JSON.stringify(cli)));
 if(!jaNegocio)d.deals.push(JSON.parse(JSON.stringify(neg)));
 if(jaCliente&&jaNegocio){
  /* Normalização: o cliente fica só como "Gestora" (Fred é contato, não
     razão social) e a relação responde pelo Paulo. */
  const c=d.customers.find(x=>x.id===cli.id),e=d.deals.find(x=>x.id===neg.id);
  const antes=JSON.stringify([c.nome,c.notas,e.responsavel,e.notas]);
  c.nome=cli.nome;c.notas=cli.notas;e.responsavel=neg.responsavel;e.notas=neg.notas;
  if(JSON.stringify([c.nome,c.notas,e.responsavel,e.notas])===antes)return null;
  return "normalizou";
 }
 return "inseriu";
}
async function cargaAtaSeNecessario(){

 if(state.usuario&&state.usuario.papel==="leitor")return;
 for(let tentativa=1;tentativa<=3;tentativa++){
  const antes=state.data.deals.length+state.data.customers.length;
  const oque=aplicarCargaAta(state.data);
  if(!oque)return;
  const depois=state.data.deals.length+state.data.customers.length;
  console.log("Carga da ata de 21/08/2026: "+oque+" · registros antes "+antes+" · depois "+depois);
  if(await gravarAgora()){console.log("Carga da ata gravada.");return;}
  console.log("Conflito ao gravar a carga da ata. Recarreguei do servidor (tentativa "+tentativa+" de 3).");
 }
 console.warn("Não consegui gravar a carga da ata depois de três tentativas.");
}

function aplicarCargaRelato(d){
 if(!d||!Array.isArray(d.deals)||!Array.isArray(d.customers))return null;
 let n=0;
 CARGA_RELATO.clientes.forEach(c=>{
  if(!d.customers.some(x=>x.id===c.id)){d.customers.push(JSON.parse(JSON.stringify(c)));n++;}});
 CARGA_RELATO.negocios.forEach(g=>{
  if(!d.deals.some(x=>x.id===g.id)){d.deals.push(JSON.parse(JSON.stringify(g)));n++;}});
 return n;
}
async function cargaRelatoSeNecessario(){
 if(!state.data)return;
 if(state.usuario&&state.usuario.papel==="leitor")return;
 for(let tentativa=1;tentativa<=3;tentativa++){
  const n=aplicarCargaRelato(state.data);
  if(!n)return;
  console.log("Carga do relato de 24/08/2026: "+n+" registros inseridos.");
  if(await gravarAgora()){console.log("Carga do relato gravada.");return;}
  console.log("Conflito ao gravar a carga do relato. Recarreguei do servidor (tentativa "+tentativa+" de 3).");
 }
 console.warn("Não consegui gravar a carga do relato depois de três tentativas.");
}

/* Grava com a versão em mãos. Se outra pessoa gravou antes, o banco não
   encontra a linha para atualizar e devolve lista vazia — é o sinal de
   conflito. Versão, data e autor são carimbados pelo próprio banco. */
function salvarServidor(){
 if(state.usuario&&state.usuario.papel==="leitor"){state.dirty=false;toast(TEXTOS.somenteLeitura,true);return;}
 clearTimeout(state.dbTimer);
 state.salvando=true;state.semRede=false;renderTopo();
 state.dbTimer=setTimeout(async()=>{
  try{
   const r=await sb("/rest/v1/pipeline?id=eq.1&versao=eq."+encodeURIComponent(state.versao),
    {method:"PATCH",body:JSON.stringify({dados:state.data}),
     extras:{"Prefer":"return=representation"}});
   if(r.status===401){state.salvando=false;mostrarLogin();return;}
   if(!r.ok)throw new Error("http "+r.status);
   const linhas=await r.json();
   if(!linhas.length){ // ninguém atualizado: versão velha ou acesso de leitura
    state.salvando=false;
    await carregarDoServidor();
    toast(TEXTOS.conflitoAviso,true);
    return;
   }
   state.versao=linhas[0].versao;state.dirty=false;state.salvando=false;renderTopo();
  }catch(e){state.salvando=false;state.semRede=true;renderTopo();}
 },800);
}

/* O link do e-mail de recuperacao volta com o token depois do # . Sem ler isto,
   a pessoa cai na tela de entrada e nada acontece. */
function sessaoDaUrl(){
 const h=location.hash||"";
 if(h.indexOf("access_token=")<0)return null;
 const p=new URLSearchParams(h.replace(/^#/,""));
 const t=p.get("access_token");
 if(!t)return null;
 history.replaceState(null,"",location.pathname+location.search);
 return {sessao:{access_token:t,refresh_token:p.get("refresh_token")||"",
  token_type:p.get("token_type")||"bearer"},recuperacao:p.get("type")==="recovery"};
}
async function completarSessao(s){
 const r=await fetch(SUPABASE_URL+"/auth/v1/user",
  {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+s.access_token}});
 if(!r.ok)return false;
 s.user=await r.json();guardarSessao(s);return true;
}
/* redirect_to é o que faltava: sem ele, o link do e-mail volta para o Site URL
   do projeto -- que nasce como http://localhost:3000 e é onde a pessoa cai
   quando "o reset não funciona". Com ele, o link volta para o endereço de onde
   o pedido saiu. O endereço precisa estar na lista de Redirect URLs do projeto,
   senão o Supabase ignora e usa o Site URL de novo. */
async function pedirRecuperacao(email){
 const r=await fetch(SUPABASE_URL+"/auth/v1/recover",
  {method:"POST",headers:cabecalhos(false),
   body:JSON.stringify({email:email,redirect_to:baseLink()})});
 if(r.ok)return;
 if(r.status===429)throw new Error(TEXTOS.recLimite);
 throw new Error(TEXTOS.recFalhou);
}
/* O Supabase devolve link expirado, já usado ou inválido como #error=... Sem
   ler isso, a pessoa cai na tela de entrada sem explicação nenhuma e conclui,
   com razão, que a redefinição não funciona. */
function erroDaUrl(){
 const h=location.hash||"";
 if(h.indexOf("error")<0)return null;
 const p=new URLSearchParams(h.replace(/^#/,""));
 const d=p.get("error_description")||p.get("error");
 if(!d)return null;
 history.replaceState(null,"",location.pathname+location.search);
 return TEXTOS.linkErro(d);
}
/* Fluxo PKCE: o código só se troca com o verificador que a biblioteca guardou
   ao pedir, e este painel não usa biblioteca. Em vez de silêncio, diz o que
   ajustar no projeto. */
function codigoNaUrl(){
 const p=new URLSearchParams(location.search||"");
 if(!p.get("code"))return null;
 history.replaceState(null,"",location.pathname);
 return TEXTOS.linkCode;
}

function baixar(nome,tipo,txt){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;
 document.body.appendChild(a);a.click();a.remove();
}
/* Backup tem três exigências que um "salvar como" não tem: ser o que está no
   banco agora (e não o que esta aba viu quando abriu), dizer no nome de qual
   momento ele é, e dizer dentro de si o que ele contém. */
function nomeBackup(sufixo){
 const d=new Date(),z=n=>String(n).padStart(2,"0");
 return "oren-backup-"+d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+
  "-"+z(d.getHours())+z(d.getMinutes())+(sufixo||"")+".json";
}
async function exportarJSON(){
 let sufixo="";
 /* Reler antes de gerar, para o backup não sair de uma aba velha. Com
    alteração ainda não gravada nesta aba, não releio: sobrescreveria o
    trabalho de quem está exportando. */
 if(state.servidor&&!state.dirty){
  if(!await carregarDoServidor(true))sufixo="-NAO-CONFERIDO-COM-O-BANCO";
  else render();
 }else if(state.dirty)sufixo="-COM-ALTERACAO-NAO-GRAVADA";
 const d=state.data||{};
 const conteudo={parceiros:(d.partners||[]).length,clientes:(d.customers||[]).length,
  negocios:(d.deals||[]).length};
 /* _backup descreve o arquivo; a importação o descarta, para ele nunca virar
    parte do documento e reaparecer no backup seguinte. */
 const copia=Object.assign({},d,{_backup:{
  gerado:new Date().toISOString(),versaoDocumento:state.versao,
  por:(state.usuario&&state.usuario.nome)||"",selo:VERSAO,conteudo:conteudo,
  observacao:"Este arquivo é o documento do pipeline inteiro. Contas de acesso "+
   "(tabela perfil e auth) e o histórico de versões (pipeline_historico) vivem no "+
   "banco e não entram aqui."}});
 baixar(nomeBackup(sufixo),"application/json",JSON.stringify(copia,null,1));
 toast(TEXTOS.backupOk(conteudo,state.versao),true);
}
function importarJSON(txt){
 if(state.servidor&&!confirm("Isto substitui TODOS os dados no banco, para todo mundo. Continuar?"))return;
 try{const o=JSON.parse(txt);
  if(!o||!Array.isArray(o.deals)||!Array.isArray(o.customers)||!Array.isArray(o.partners))throw 0;
  delete o._backup;   /* descrição do arquivo, não dado do documento */
  snapshot();state.data=o;marcar();
 }catch(e){toast(TEXTOS.erros.importar,true);}
}
function snapshot(){state.undo=JSON.stringify(state.data);}
function toast(msg,semUndo){

}

function faixa(p){
 const h=hoje(),y=h.getFullYear(),m=h.getMonth();
 if(p==="tudo")return null;
 if(p==="mes")return{de:new Date(y,m,1),ate:new Date(y,m+1,1),ant:{de:new Date(y,m-1,1),ate:new Date(y,m,1)}};
 if(p==="tri"){const q=Math.floor(m/3)*3;return{de:new Date(y,q,1),ate:new Date(y,q+3,1),ant:{de:new Date(y,q-3,1),ate:new Date(y,q,1)}};}
 return{de:new Date(y,0,1),ate:new Date(y+1,0,1),ant:{de:new Date(y-1,0,1),ate:new Date(y,0,1)}};
}
/* período: só a data de desfecho conta. criadoEm nunca entra nesse filtro. */
const iso=x=>[x.getFullYear(),String(x.getMonth()+1).padStart(2,"0"),String(x.getDate()).padStart(2,"0")].join("-");
const naFaixa=(data,f)=>!!data&&(!f||(data>=iso(f.de)&&data<iso(f.ate)));
function dataDesfecho(d){
 if(d.fechadoEm)return String(d.fechadoEm).slice(0,10);
 if(d.etapa==="perdido"){
  const h=(d.historico||[]).filter(x=>x.para==="Perdido").pop();
  return h?String(h.quando).slice(0,10):(d.atualizadoEm||null);
 }
 return null;
}
const noDesfecho=(d,f)=>naFaixa(dataDesfecho(d),f);
/* O contato é um objeto {nome,cargo,telefone,email,site,obs}. Parceiro tinha
   antes um campo "contato" de texto livre; quando ele existe, o texto vai
   inteiro para observações — não para "nome", porque não se sabe se o que
   estava escrito ali era nome, telefone ou recado, e chutar seria inventar. */
function contatoDe(o){
 const c=o&&o.contato;
 if(!c)return {};
 if(typeof c==="string")return c.trim()?{obs:c}:{};
 return c;
}
const contatoTexto=o=>{const c=contatoDe(o);
 return [c.nome,c.cargo,c.telefone,c.email,c.site,c.obs].filter(Boolean).join(" ");};
const soDigitos=v=>String(v||"").replace(/\D/g,"");
/* Sempre https: assim um "javascript:" digitado no campo não vira link. */
const urlDe=v=>{const t=String(v||"").trim();
 return /^https?:\/\//i.test(t)?t:"https://"+t.replace(/^\/+/,"");};
function linksContato(c){
 const L=[],tel=soDigitos(c.telefone);
 /* 10 ou 11 dígitos é número brasileiro sem país: o 55 entra para o wa.me
    funcionar. Acima disso já veio com código de país e não se mexe. */
 if(tel.length>=10)L.push('<a href="https://wa.me/'+(tel.length<=11?"55":"")+tel+
  '" target="_blank" rel="noopener">WhatsApp</a>');
 if(String(c.email||"").indexOf("@")>0)L.push('<a href="mailto:'+esc(c.email)+'">E-mail</a>');
 if(String(c.site||"").trim())L.push('<a href="'+esc(urlDe(c.site))+
  '" target="_blank" rel="noopener">Site</a>');
 return L.length?'<div class="clinks">'+L.join("")+"</div>":"";
}

/* RÉGUA ÚNICA — todos os blocos usam estas três funções, sem interpretação
   própria. O corte agora vem de CORTE[frente], porque cada funil termina a
   venda numa etapa diferente:
     em aberto = etapas antes do ganho
     fechado   = a etapa de ganho e as de pós-venda
     perdido   = "perdido"
   Capital fecha em 9 e acompanha em 10. Governance fecha em 4 (Pagamento) e
   entrega de 5 a 7. Payments fecha em 6 (Ativação) e acompanha em 7. */
const emAberto=d=>d.etapa!=="perdido"&&Number(d.etapa)>=1&&Number(d.etapa)<corteDe(d).ganho;
const fechado=d=>d.etapa!=="perdido"&&Number(d.etapa)>=corteDe(d).ganho;
const perdido=d=>d.etapa==="perdido";
function kpis(lista){
 const ab=lista.filter(emAberto),fe=lista.filter(fechado),pe=lista.filter(perdido);
 const soma=a=>a.reduce((s,d)=>s+(Number(d.valor)||0),0);
 const conv=(fe.length+pe.length)?fe.length/(fe.length+pe.length)*100:null;
 return{aberto:soma(ab),ponderada:ab.reduce((s,d)=>s+(Number(d.valor)||0)*(Number(d.chance)||0)/100,0),
  fechado:soma(fe),conversao:conv,n:lista.length,
  nAberto:ab.length,nFechado:fe.length,nPerdido:pe.length};
}

function itensTodo(){

 /* O filtro de responsável desta tela vale para quem FAZ, não para o dono do

  if(f.busca.trim()&&textoBusca(d).indexOf(f.busca.trim().toLowerCase())<0)return false;
  return emAberto(d);
 });
 const consultados=d=>PAPEIS.map(([k,l])=>{const v=(d.papeis||{})[k];return v?l+": "+v:"";}).filter(Boolean);
 const item=(d,tipo,texto,quem,prazo)=>{

 };
 base.forEach(d=>{

  else out.push(item(d,"definir","Definir o próximo passo deste negócio",d.responsavel,d.prazo));
 });

/* Bloqueio primeiro, depois o mais atrasado, depois o prazo mais próximo. */
const ORDEM_TODO={bloqueio:0,vencido:1,hoje:2,prazo:3,semPrazo:4};
function ordenarTodo(itens){
 return itens.slice().sort((a,b)=>{
  const ea=ORDEM_TODO[a.estado],eb=ORDEM_TODO[b.estado];
  if(ea!==eb)return ea-eb;
  if(a.prazo&&b.prazo)return b.atraso-a.atraso;
  return 0;
 });
}

function itensDe(quem){

/* Uma linha por item, em texto puro: é o que se cola numa conversa. O texto
   diz o estado por extenso, porque em WhatsApp não há cor nem ícone. */

 const itens=itensDe(quem),h=hoje();
 const n=itens.length;
 const bl=itens.filter(x=>x.estado==="bloqueio").length;
 const vc=itens.filter(x=>x.estado==="vencido"||x.estado==="hoje").length;

 const L=["To Do · "+(quem||TEXTOS.encTime)];
 L.push(n+(n===1?" item":" itens")+" em aberto"+

  (vc?" · "+vc+" atrasado"+(vc===1?"":"s"):"")+
  (sd?" · "+sd+" sem data":""));
 L.push("");
 itens.slice(0,ENC_TETO).forEach(x=>{
  const quando=x.prazo
   ?dt(x.prazo)+(x.atraso>0?" (vencido há "+x.atraso+(x.atraso===1?" dia":" dias")+")"
     :x.atraso===0?" (hoje)":"")
   :"sem data";
  L.push("- ["+TODO_ESTADOS[x.estado].lbl.toLowerCase()+"] "+x.texto);
  L.push("  "+nomeNegocio(x.d)+" · "+TEXTOS.frentesLbl[x.d.frente]+" · "+quando+

 L.push("");
 L.push("Lista completa: "+linkTodo(quem));
 return L.join("\n");
}

async function copiar(texto){
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(texto);}
  else{
   /* Sem clipboard API — file:// e navegador antigo — o caminho da textarea
      escondida ainda funciona. */
   const t=document.createElement("textarea");
   t.value=texto;t.style.position="fixed";t.style.opacity="0";
   document.body.appendChild(t);t.select();
   const ok=document.execCommand("copy");document.body.removeChild(t);
   if(!ok)throw new Error("execCommand");
  }
  toast(TEXTOS.encCopiado,true);
 }catch(e){toast(TEXTOS.encNaoCopiou);}
}

 if(!state.todoQuem)state.todoQuem=(eu&&meus.length)?"minhas":"todos";

 /* Próximos passos é outro eixo: não é "de quem", é "que tipo de tarefa". Por
    isso é um interruptor ao lado das abas, e não uma terceira aba — ele compõe
    com a pessoa escolhida, com as pastilhas de estado e com o acordeão, em vez
    de substituir a escolha anterior. Passo e "definir o próximo passo" contam
    juntos: o negócio sem passo escrito é o caso mais urgente da lista. */

 if(state.todoSo&&!doQuem.some(x=>x.quem===state.todoSo))state.todoSo="";

 h+='<div class="tdest">'+destaques.map(([k,n,l,f,cls])=>{

   ' aria-pressed="'+(on?"true":"false")+'"'+((n||!k)?"":" disabled")+'>'+

   '<span class="tdl">'+esc(l)+"</span>"+
   '<span class="tdf">'+esc(f)+"</span></button>";
 }).join("")+"</div>";

 const filtrados=state.todoFiltro
  ?base.filter(x=>state.todoFiltro==="vencido"?(x.estado==="vencido"||x.estado==="hoje")
    :state.todoFiltro==="semPrazo"?!x.prazo

 TODO_FOCO.length=0;TODO_SECOES.length=0;
 if(!filtrados.length){
  const vazio=mostrandoMinhas&&!state.todoFiltro
   ?esc(TEXTOS.vazio.todoMinhas)+' <button class="lnk" data-todoquem="todos" style="margin:0">'+
    esc(TEXTOS.todoTodos)+"</button>"
   :esc(state.todoFiltro?TEXTOS.vazio.todoFiltro:TEXTOS.vazio.todo);
  return h+'<div class="tgrupo"><div class="empty" style="border:0;padding:28px 16px;text-align:center">'+
   vazio+"</div></div>";
 }
 /* Um caminho só para as duas abas: uma seção por responsável, cada pessoa
    aparecendo UMA vez, com tudo o que é dela dentro e o sem data no fim da
    própria seção. Em "minhas" isso dá exatamente uma seção — sequência só,
    de cima para baixo, mas agora com o cabeçalho que conta os bloqueios.
    Antes o sem data virava um bloco geral no fim e a mesma pessoa aparecia
    duas vezes na tela; e a aba de quem entrou não somava nada.
    corpoTodo monta TODO_SECOES, e a barra depende dela: primeiro o corpo. */
 const corpo=corpoTodo(filtrados);
 return h+barraAcordeao()+corpo;
}
/* A ordem em que as linhas aparecem, para j e k andarem por ela. Só entra
   aqui o que está visível: seção fechada não tem linha, e Enter não pode
   abrir um negócio que ninguém está vendo. */
const TODO_FOCO=[];
/* Os nomes das seções desta renderização, na ordem da tela. */
const TODO_SECOES=[];
/* Quais seções ficam abertas. Guardado no navegador de quem lê, porque é
   preferência de leitura, não dado do negócio: não vai para o banco nem
   aparece para os outros. Nome ausente do mapa = ainda não houve escolha,
   e vale o padrão. */
const TODO_ABRE_CHAVE="oren.todo.secoes.v1";
let TODO_ABRE=(function(){
 try{const o=JSON.parse(localStorage.getItem(TODO_ABRE_CHAVE)||"{}");
  return (o&&typeof o==="object")?o:{};}catch(e){return {};}
})();
function gravarAbertas(){
 try{localStorage.setItem(TODO_ABRE_CHAVE,JSON.stringify(TODO_ABRE));}catch(e){}
}
/* Sem escolha registrada, abre a seção de quem entrou; se ela não existe,
   abre a primeira da ordem. Uma aberta, sempre: tela com tudo fechado
   parece tela sem dado. */
function secaoPadrao(ordem){
 const eu=(state.usuario&&state.usuario.nome)||"";
 return (eu&&ordem.indexOf(eu)>=0)?eu:(ordem[0]||"");
}
function secaoAberta(k,padrao){
 return TODO_ABRE[k]!==undefined?!!TODO_ABRE[k]:k===padrao;
}
/* Abrir e fechar todas de uma vez. Fica acima da primeira seção, à direita,
   e só aparece quando há mais de uma pessoa e nenhum filtro ligado. */
function barraAcordeao(){
 let esq="";
 if(state.todoSo)esq='<button class="tso" data-todoso="">'+esc(TEXTOS.soDe(state.todoSo))+
  '<span class="x">×</span></button>';
 let dir='<button data-todoenc="'+esc(state.todoSo)+'">'+esc(TEXTOS.encBtn)+"</button>";
 if(!state.todoFiltro&&TODO_SECOES.length>=2){
  const padrao=secaoPadrao(TODO_SECOES);
  const abrir=TODO_SECOES.filter(k=>!secaoAberta(k,padrao)).length>0;
  dir='<button data-todoacc="'+(abrir?"abrir":"fechar")+'">'+
   '<span class="chev'+(abrir?"":" on")+'">'+ICO_CHEV+"</span>"+
   esc(abrir?TEXTOS.todoExpandir:TEXTOS.todoRecolher)+"</button>"+dir;
 }
 return '<div class="tacc">'+esq+'<span class="sp"></span>'+dir+"</div>";
}
function corpoTodo(itens){
 const chave=x=>(x.quem||TEXTOS.semQuem);
 const grupos={};
 itens.forEach(x=>{const k=chave(x);(grupos[k]=grupos[k]||[]).push(x);});
 const ordem=Object.keys(grupos).sort((a,b)=>{
  const ba=grupos[a].filter(x=>x.estado==="bloqueio").length,bb=grupos[b].filter(x=>x.estado==="bloqueio").length;
  if(ba!==bb)return bb-ba;
  if(grupos[a].length!==grupos[b].length)return grupos[b].length-grupos[a].length;
  return a.localeCompare(b,"pt-BR");
 });
 TODO_SECOES.length=0;
 ordem.forEach(k=>TODO_SECOES.push(k));
 /* Com filtro ligado tudo abre, e o cabeçalho volta a ser cabeçalho: filtro
    já é um estreitamento, e estreitar duas vezes esconde a resposta. Uma
    pessoa só também não vira acordeão — não há o que organizar. */
 const semAcordeao=!!state.todoFiltro||ordem.length<2;
 const padrao=secaoPadrao(ordem);
 return ordem.map(k=>{
  const g=ordenarTodo(grupos[k]),bl=g.filter(x=>x.estado==="bloqueio").length;
  const vc=g.filter(x=>x.estado==="vencido"||x.estado==="hoje").length;
  /* Com o filtro "Sem data" ligado o total já é o número de sem data. */
  const sd=state.todoFiltro==="semPrazo"?0:g.filter(x=>!x.prazo).length;
  const aberta=semAcordeao||secaoAberta(k,padrao);
  /* Fechada, o cabeçalho é tudo o que se lê: ele tem de dizer se vale abrir.
     Daí total, bloqueados, atrasados e sem data ficarem nele. */
  const miolo='<span class="av" style="background:'+corDoNome(k)+'">'+
    esc(k===TEXTOS.semQuem?"?":iniciais(k))+"</span>"+
   '<span class="tn">'+esc(k)+'</span><span class="tc">'+g.length+"</span>"+
   ((bl||vc)?'<span class="tp">'+
     (bl?'<span class="tb">'+bl+(bl===1?" bloqueado":" bloqueados")+"</span>":"")+
     (vc?'<span class="tw">'+vc+(vc===1?" atrasado":" atrasados")+"</span>":"")+
    "</span>":"")+
   (sd?'<span class="td">'+sd+" sem data</span>":"");
  /* Botão dentro de botão é HTML inválido, então o cabeçalho é uma faixa com
     dois botões: o que abre e fecha, e o que encaminha aquela pessoa. */
  const enc='<button class="thenc" data-todoenc="'+esc(k===TEXTOS.semQuem?"":k)+
   '" title="'+esc(TEXTOS.encBtn+": "+k)+'">'+esc(TEXTOS.encBtn)+"</button>";
  const cab='<header class="th">'+(semAcordeao
   ?'<span class="thb">'+miolo+"</span>"
   :'<button class="thb ac" data-todosec="'+esc(k)+'" aria-expanded="'+(aberta?"true":"false")+
    '" title="'+esc(aberta?TEXTOS.todoFecharSec:TEXTOS.todoAbrirSec(g.length))+'">'+
    '<span class="chev'+(aberta?" on":"")+'">'+ICO_CHEV+"</span>"+miolo+"</button>")+
   enc+"</header>";
  return '<section class="tgrupo'+(aberta?"":" fechada")+'">'+cab+
   (aberta?linhasTodo(g,true):"")+"</section>";
 }).join("");
}
/* Cor do avatar tirada do nome: estável, discreta, e nunca a cor de estado. */
const AVCORES=["#e6efe8","#e9ecf4","#f3ecdf","#efe7f0","#e2eff0","#f0eae2"];
function corDoNome(n){
 let t=0;String(n).split("").forEach(c=>t=(t*31+c.charCodeAt(0))%9973);
 return AVCORES[t%AVCORES.length];
}
function linhasTodo(itens,dentroDoGrupo){
 let h="",abriuSemData=false;
 /* Com o filtro "Sem data" ligado toda linha está sem data: a faixa seria ruído. */
 const faixa=state.todoFiltro!=="semPrazo";
 itens.forEach(x=>{
  const e=TODO_ESTADOS[x.estado];
  /* Uma faixa só, na virada: daqui para baixo nada tem data marcada. */
  if(faixa&&x.estado==="semPrazo"&&!abriuSemData){
   abriuSemData=true;
   h+='<div class="tvirada"><span class="ic">'+ICO_ESTADO.semPrazo+"</span>"+
    esc(TEXTOS.semPrazoT)+'<span class="td">'+esc(TEXTOS.semPrazoSub)+"</span></div>";
  }
  const i=TODO_FOCO.length;TODO_FOCO.push(x.d.id);
  const quando=x.prazo
   ?(x.atraso>0?"vencido há "+x.atraso+(x.atraso===1?" dia":" dias")
     :x.atraso===0?"hoje":"em "+(-x.atraso)+(x.atraso===-1?" dia":" dias"))
   :"";
  const meta=[esc(nomeNegocio(x.d)),esc(TEXTOS.frentesLbl[x.d.frente])+" · "+esc(etapaNome(x.d))];
  if(!dentroDoGrupo)meta.push(x.quem?esc(x.quem):'<span class="late">'+esc(TEXTOS.semQuem)+"</span>");
  if(x.aprova&&x.aprova!==x.quem)meta.push("responde: "+esc(x.aprova));
  h+='<div class="ti '+x.estado+(state.todoSel===i?" sel":"")+'" data-abre="'+x.d.id+
   '" data-tirow="'+i+'" style="--tkc:'+e.cor+'" title="'+esc(e.lbl)+'">'+
   '<span class="ic">'+ICO_ESTADO[x.estado]+"</span>"+
   '<span class="mid"><span class="tt">'+esc(x.texto)+"</span>"+
    '<span class="mt">'+meta.join(SEP)+"</span></span>"+
   '<span class="rt">'+(x.prazo
     ?'<span class="dt">'+esc(dt(x.prazo))+"</span>"+(quando?'<span class="qd">'+esc(quando)+"</span>":"")
     :'<span class="dt vazia">definir data</span>')+"</span></div>";
 });
 return h;
}
function atencao(lista){
 const h=hoje(),out=[];
 lista.filter(emAberto).forEach(d=>{
  let m=null;
  if(d.prazo&&new Date(d.prazo)<h&&!fechado(d))m=TEXTOS.motivos.prazo;
  else if((d.pendencias||[]).some(p=>p.bloqueante&&!p.resolvida))m=TEXTOS.motivos.pend;
  else if(!d.proximoPasso||!String(d.proximoPasso).trim())m=TEXTOS.motivos.passo;
  else if(d.atualizadoEm&&dias(new Date(d.atualizadoEm),h)>30)m=TEXTOS.motivos.parado;
  if(m)out.push({d:d,motivo:m});
 });
 return out.sort((a,b)=>(Number(b.d.valor)||0)-(Number(a.d.valor)||0)).slice(0,15);
}

/* ---------------------------- AUDITORIA ----------------------------
   Roda sob demanda, no console: auditoria(). Só lê e imprime. Nenhuma
   correção automática, porque quase toda lacuna aqui precisa de decisão
   humana e um palpite gravado é pior que um campo vazio. */
function auditoria(){
 if(!state.data){console.warn("Sem dados carregados.");return[];}
 const d=state.data,achados=[];
 const add=(tipo,id,detalhe)=>achados.push({tipo:tipo,id:id,detalhe:detalhe});
 const dataOk=v=>!v||/^\d{4}-\d{2}-\d{2}$/.test(String(v).slice(0,10))&&!isNaN(new Date(String(v).slice(0,10)));
 const perfis={};RESPS.forEach(r=>perfis[r]=1);
 const hojeISO=agora();

 /* ids duplicados */
 [["deals",d.deals],["customers",d.customers],["partners",d.partners]].forEach(([nome,lista])=>{
  const visto={};
  (lista||[]).forEach(r=>{
   if(visto[r.id])add("id duplicado",r.id,"repetido em "+nome);
   visto[r.id]=1;
  });
 });

 (d.deals||[]).forEach(x=>{
  /* integridade referencial */
  if(x.clienteId&&!cliente(x.clienteId))add("cliente inexistente",x.id,"clienteId "+x.clienteId);
  if(x.parceiroId&&!parceiro(x.parceiroId))add("parceiro inexistente",x.id,"parceiroId "+x.parceiroId);
  if(!x.clienteId&&!x.parceiroId)add("negócio sem conta",x.id,"aparece pelo título, não por uma conta");
  if(x.tipoVenda==="direta"&&x.parceiroId)add("venda direta com parceiro",x.id,"parceiroId "+x.parceiroId);
  if(x.tipoVenda==="parceiro"&&!x.parceiroId)add("venda por parceiro sem parceiro",x.id,"");
  /* coerência de estado */
  const fr=frenteDe(x),f=FUNIS[fr],c=CORTE[fr];
  if(x.etapa!=="perdido"){
   const e=Number(x.etapa);
   if(!(e>=1&&e<=f.length))add("etapa fora do funil",x.id,"etapa "+x.etapa+" em "+fr+" (funil vai até "+f.length+")");
   if(e>=c.ganho&&!x.fechadoEm)add("fechado sem data",x.id,"etapa "+e+" já é ganho ou pós-venda");
   if(e<c.ganho&&x.fechadoEm)add("data de fechamento em negócio aberto",x.id,"fechadoEm "+x.fechadoEm);
  }else if(!x.motivoPerda||!String(x.motivoPerda).trim())add("perdido sem motivo",x.id,"");
  const ch=Number(x.chance);
  if(!(ch>=0&&ch<=100))add("chance fora de 0 a 100",x.id,String(x.chance));
  if(x.valor!==null&&x.valor!==undefined&&x.valor!==""){
   const v=Number(x.valor);
   if(isNaN(v))add("valor não numérico",x.id,String(x.valor));
   else if(v<0)add("valor negativo",x.id,String(v));
  }
  /* datas */
  ["prazo","criadoEm","atualizadoEm","fechadoEm","mandatoAssinadoEm"].forEach(k=>{
   if(x[k]&&!dataOk(x[k]))add("data inválida",x.id,k+" = "+x[k]);
  });
  if(x.criadoEm&&x.criadoEm>hojeISO)add("criado no futuro",x.id,x.criadoEm);
  if(x.criadoEm&&x.atualizadoEm&&x.atualizadoEm<x.criadoEm)add("atualizado antes de criado",x.id,x.atualizadoEm+" < "+x.criadoEm);
  /* pessoas */
  if(!x.responsavel||!perfis[x.responsavel])
   add("responsável fora da lista",x.id,String(x.responsavel)+" — o negócio desaparece de Por responsável e do filtro");
  /* histórico */
  let ant="";
  (x.historico||[]).forEach((h,i)=>{
   if(!h.quando||isNaN(new Date(h.quando)))add("histórico com data inválida",x.id,"evento "+i+": "+h.quando);
   else{
    if(ant&&String(h.quando)<ant)add("histórico fora de ordem",x.id,"evento "+i+": "+h.quando+" vem depois de "+ant);
    ant=String(h.quando);
   }
   if(h.quem&&!perfis[h.quem])add("autor do histórico sem perfil",x.id,'"'+h.quem+'" não corresponde a ninguém em RESPS');
  });
 });

 (d.customers||[]).concat(d.partners||[]).forEach(c=>{
  if(c.responsavel&&!perfis[c.responsavel])add("responsável fora da lista",c.id,String(c.responsavel));
  ["criadoEm","atualizadoEm"].forEach(k=>{if(c[k]&&!dataOk(c[k]))add("data inválida",c.id,k+" = "+c[k]);});
 });

 /* exibição: valor ausente não é zero */
 (d.deals||[]).forEach(x=>{
  if(x.valor===0||x.valor===null||x.valor===undefined||x.valor==="")
   add("valor não informado",x.id,"a tela mostra travessão, não R$ 0");
 });

 const porTipo={};achados.forEach(a=>{porTipo[a.tipo]=(porTipo[a.tipo]||0)+1;});
 console.log("=== Auditoria Oren ===");
 console.log("Negócios: "+(d.deals||[]).length+" · clientes: "+(d.customers||[]).length+
  " · parceiros: "+(d.partners||[]).length+" · schema: "+(d.schema||1));
 console.log("Achados: "+achados.length,porTipo);
 if(achados.length&&console.table)console.table(achados);
 else achados.forEach(a=>console.log(a.tipo+" · "+a.id+" · "+a.detalhe));
 console.log("Nada foi alterado. Corrija pelo painel ou peça a correção.");
 return achados;
}
window.auditoria=auditoria;
